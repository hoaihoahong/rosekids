# Cấu hình máy chủ AI RoseKids cho Cloudflare (Workers Builds đọc file này khi deploy).
name = "rosekids-ai"
main = "worker.js"
compatibility_date = "2026-09-01"
keep_vars = true

# Chạy máy chủ ở Mỹ: Cloudflare gần Việt Nam hay chạy ở Hồng Kông, nơi Anthropic không phục vụ.
[placement]
region = "aws:us-east-1"
