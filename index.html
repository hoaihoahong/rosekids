<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hệ sinh thái RoseKids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: a garden-notebook app. Left rail of modules (top tabs on phones), working sheet on the right. */
:root{
  --bg:#fbf7f6; --sheet:#ffffff; --ink:#2b1f22; --muted:#76656a; --line:#ecdfe0;
  --rose:#b23a5b; --rose-soft:#f8e3e9; --leaf:#3f7a52; --leaf-soft:#e3f1e6;
  --sun:#a86a12; --sun-soft:#fbefd9; --sky:#2f6a8f; --sky-soft:#e1eef6;
  --display:"Lora",Georgia,"Times New Roman",serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1517; --sheet:#251c1f; --ink:#f3e9eb; --muted:#b7a3a8; --line:#3a2d31;
  --rose:#ec7d9a; --rose-soft:#43232d; --leaf:#80c595; --leaf-soft:#20352a;
  --sun:#e3b066; --sun-soft:#3d2e17; --sky:#82bde0; --sky-soft:#1b2f3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1517; --sheet:#251c1f; --ink:#f3e9eb; --muted:#b7a3a8; --line:#3a2d31;
  --rose:#ec7d9a; --rose-soft:#43232d; --leaf:#80c595; --leaf-soft:#20352a;
  --sun:#e3b066; --sun-soft:#3d2e17; --sky:#82bde0; --sky-soft:#1b2f3c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.5rem} h3{font-size:1.1rem}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--sheet)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.15rem;display:block}
.brand small{color:var(--muted);font-size:.78rem}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup>span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px 4px}
.nav{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;font-size:.92rem}
.nav:hover{background:var(--rose-soft)}
.nav:focus-visible{outline:2px solid var(--rose)}
.nav.on{background:var(--rose);color:#fff}
.nav em{font-style:normal;font-size:.75rem;opacity:.75;font-variant-numeric:tabular-nums}
.main{padding-block:22px 60px;padding-inline:clamp(16px,3vw,40px);min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:22px}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
select,input[type=text],input[type=date],input[type=month],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.5}
select:focus,input:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:-1px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 14px;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--rose)}
.btn:focus-visible{outline:2px solid var(--rose)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.warn{color:var(--rose)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-nhap{background:var(--line);color:var(--muted)}
.st-cho{background:var(--sun-soft);color:var(--sun)}
.st-duyet{background:var(--leaf-soft);color:var(--leaf)}
.st-sua{background:var(--rose-soft);color:var(--rose)}
.banner{border-radius:10px;padding:12px 16px;background:var(--sun-soft);color:var(--ink);font-size:.9rem;margin-bottom:16px}
/* hierarchy stem */
.stem{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.stem button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 4px;position:relative}
.stem button:focus-visible{outline:2px solid var(--rose);border-radius:8px}
.stem .bud{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);font-family:var(--display);font-weight:700;font-size:1.1rem;z-index:1;border:2px solid var(--sheet)}
.stem button:hover .bud{background:var(--rose);color:#fff}
.stem .lbl{font-size:.8rem;line-height:1.3}
.stem::before{content:"";position:absolute;left:8%;right:8%;top:29px;height:2px;background:var(--leaf);opacity:.5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.stat b{font-family:var(--display);font-size:1.6rem;display:block;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.item{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:hover{background:var(--rose-soft)}
.item:focus-visible{outline:2px solid var(--rose)}
.item .t{font-weight:600}
.item .m{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.86rem;font-weight:500;min-width:0}
label.f>span.h{font-weight:400;color:var(--muted);font-size:.78rem}
.domain{border-left:3px solid var(--leaf);padding-left:12px}
.ktgrid th,.ktgrid td{border-right:2px solid #8a6b74;border-bottom:1px solid #b9a3aa}
.ktgrid thead th{font-size:1rem}
.ktgrid tbody th{font-size:.98rem}
.mtc{border-bottom:1px dotted currentColor;cursor:help}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--rose-soft);font-weight:600;font-size:.8rem}
td textarea{min-height:70px;border:none;padding:4px;background:transparent}
.wk{min-width:760px}
.wk td:first-child{font-weight:600;width:130px;background:var(--bg)}
.ev td.c{text-align:center;width:88px}
.tog{all:unset;cursor:pointer;display:inline-block;min-width:68px;padding:3px 6px;border-radius:6px;font-size:.78rem;font-weight:600;background:var(--line);color:var(--muted)}
.tog.dat{background:var(--leaf-soft);color:var(--leaf)}
.tog.chua{background:var(--rose-soft);color:var(--rose)}
.tog:focus-visible{outline:2px solid var(--rose)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.8rem}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chip:focus-visible{outline:2px solid var(--rose)}
.note{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.88rem;z-index:9}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem}
.crumbs button{all:unset;cursor:pointer;color:var(--rose);text-decoration:underline;text-underline-offset:3px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:14px 16px;gap:10px}
  .navs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .navgroup{flex-direction:row;gap:6px}
  .navgroup>span{display:none}
  .nav{white-space:nowrap;border:1px solid var(--line)}
  .stem{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
  .stem::before{display:none}
}
@media (prefers-reduced-motion:no-preference){.nav,.btn,.item{transition:background .15s,border-color .15s}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="17" r="11" fill="var(--rose-soft)"/><path d="M20 9c5 0 8 3.5 8 7.5S24 23 20 23s-8-2.5-8-6.5S15 9 20 9z" fill="var(--rose)"/><path d="M20 12c2.5 0 4 1.8 4 4s-2 3.5-4 3.5-4-1.5-4-3.5 1.5-4 4-4z" fill="var(--sheet)" opacity=".5"/><path d="M20 23v13M20 30c-3-3-6-3-8-2 2 2 5 3 8 2zm0-2c3-3 6-3 8-2-2 2-5 3-8 2z" stroke="var(--leaf)" stroke-width="2" fill="var(--leaf)" stroke-linecap="round"/></svg>
      <div><b>RoseKids</b><small>Hệ sinh thái hoa hồng</small></div>
    </div>
    <nav class="navs" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="who" id="who"></div>
    </div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ==== MÃ KẾT NỐI FIREBASE CỦA TRƯỜNG ==== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCgcRFdbPglRpKgcHeXBt-fYFIGBQhQo6k",
  authDomain: "rosekids-32f0c.firebaseapp.com",
  projectId: "rosekids-32f0c",
  storageBucket: "rosekids-32f0c.firebasestorage.app",
  messagingSenderId: "722548770821",
  appId: "1:722548770821:web:54f2083be038c62583346c"
};
/* Email quản trị (Ban giám hiệu), luôn có toàn quyền */
const ADMIN_EMAILS = ['mamnonhoahong2018@gmail.com'];
/* ======================================== */
const YEAR_NOW=(()=>{const d=new Date();const y=d.getFullYear();return d.getMonth()>=7?`${y}-${y+1}`:`${y-1}-${y}`})();
const YEARS=(()=>{const a=+YEAR_NOW.slice(0,4);return[`${a-1}-${a}`,YEAR_NOW,`${a+1}-${a+2}`]})();
const AGES=['Nhà trẻ 24–36 tháng','Mẫu giáo bé 3–4 tuổi','Mẫu giáo nhỡ 4–5 tuổi','Mẫu giáo lớn 5–6 tuổi'];
const DOMAINS=[['the_chat','Phát triển thể chất'],['nhan_thuc','Phát triển nhận thức'],['ngon_ngu','Phát triển ngôn ngữ'],['tc_xh','Phát triển tình cảm và kỹ năng xã hội'],['tham_my','Phát triển thẩm mỹ']];
const ROLES={bgh:'Ban giám hiệu',tct:'Tổ chuyên môn',gv:'Giáo viên lớp'};
const STATUS={nhap:['Nháp','st-nhap'],cho:['Chờ duyệt','st-cho'],duyet:['Đã duyệt','st-duyet'],sua:['Cần sửa','st-sua']};
const WEEK_ROWS=['Đón trẻ – Trò chuyện','Thể dục sáng','Hoạt động học','Hoạt động ngoài trời','Hoạt động góc','Hoạt động chiều','Nêu gương – Trả trẻ'];
const WEEK_COLS=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6'];
const PERIODS=[['T9','Tháng 9'],['T10','Tháng 10'],['T11','Tháng 11'],['T12','Tháng 12'],['T1','Tháng 1'],['T2','Tháng 2'],['T3','Tháng 3'],['T4','Tháng 4'],['T5','Tháng 5'],['HK1','Cuối học kỳ I'],['CN','Cuối năm học']];
const LEVELS=[
 {k:'truong',short:'Nhà trường',name:'Kế hoạch nhà trường',parent:null,cls:false,approve:['bgh'],
  fields:[['tinh_hinh','Đặc điểm tình hình','Thuận lợi, khó khăn, số lớp, số trẻ, đội ngũ'],['muc_tieu','Mục tiêu năm học'],['nhiem_vu','Nhiệm vụ trọng tâm'],['chi_tieu','Chỉ tiêu','Tỷ lệ chuyên cần, bé ngoan, trẻ suy dinh dưỡng…'],['giai_phap','Biện pháp, giải pháp'],['lich','Lịch công tác theo tháng']]},
 {k:'namhoc',short:'KHGD năm học',name:'Kế hoạch giáo dục năm học',parent:'truong',cls:false,age:true,approve:['bgh'],
  fields:[['DOMAINS','Mục tiêu giáo dục theo lĩnh vực'],['noi_dung','Nội dung giáo dục'],['chu_de','Dự kiến chủ đề cả năm','Tên chủ đề, thời gian thực hiện']]},
 {k:'lop',short:'KHGD lớp',name:'Kế hoạch giáo dục lớp',parent:'namhoc',cls:true,approve:['bgh','tct'],
  fields:[['dac_diem','Đặc điểm lớp','Sĩ số, tình hình trẻ, cơ sở vật chất'],['DOMAINS','Mục tiêu của lớp theo lĩnh vực'],['chu_de','Chủ đề và số tuần thực hiện']]},
 {k:'thang',short:'Kế hoạch tháng',name:'Kế hoạch tháng',parent:'lop',cls:true,approve:['bgh','tct'],
  fields:[['chu_de','Chủ đề tháng'],['muc_tieu','Mục tiêu tháng','Ghi số thứ tự mục tiêu lấy từ KHGD lớp'],['noi_dung','Nội dung'],['hoat_dong','Hoạt động và chuẩn bị'],['su_kien','Ngày lễ, sự kiện trong tháng']]},
 {k:'tuan',short:'Kế hoạch tuần',name:'Kế hoạch tuần',parent:'thang',cls:true,approve:['bgh','tct'],
  fields:[['chu_de','Chủ đề nhánh'],['GRID','Lịch hoạt động trong tuần'],['ghi_chu','Ghi chú']]},
 {k:'ngay',short:'Giáo án ngày',name:'Giáo án hoạt động ngày',parent:'tuan',cls:true,approve:['bgh','tct'],
  fields:[['ten_hd','Tên hoạt động'],['LINHVUC','Lĩnh vực'],['doi_tuong','Số trẻ, thời gian, địa điểm'],['md_kt','Mục đích – Kiến thức'],['md_kn','Mục đích – Kỹ năng'],['md_td','Mục đích – Thái độ'],['chuan_bi','Chuẩn bị','Đồ dùng của cô, của trẻ'],['tien_hanh','Tiến hành','Hoạt động 1: Gây hứng thú · Hoạt động 2 · Hoạt động 3 · Kết thúc'],['danh_gia','Đánh giá trẻ cuối ngày','Sức khỏe, cảm xúc, hành vi; kiến thức, kỹ năng của trẻ']]},
];
const LV=Object.fromEntries(LEVELS.map(l=>[l.k,l]));
const childLevel=k=>LEVELS.find(l=>l.parent===k);

const S={db:null,auth:null,fbUser:null,me:null,users:[],meId:null,names:{},ready:false,classes:[],children:[],plans:[],proc:[],period:[],spFiles:[],yccd:[],yccdMeta:[],topicSets:[],classGoals:[],topicPlans:[],planLog:[],weekPlans:[],kc:{},kt:{},aiCfg:null,
  role:'gv',year:YEAR_NOW,view:'home',arg:null,flt:{cls:'',st:''},evCls:'',evKy:'T10',procChild:'',procDomains:[],confirm:null};
try{const p=JSON.parse(localStorage.getItem('rk_prefs')||'{}');Object.assign(S,{year:p.year||YEAR_NOW,evCls:p.evCls||''})}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('rk_prefs',JSON.stringify({year:S.year,evCls:S.evCls}))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return dd?`${dd}/${m}/${y}`:`${m}/${y}`};
const today=()=>new Date().toISOString().slice(0,10);
const clsName=id=>S.classes.find(c=>c.id===id)?.name||'—';
const BLOCKS=['Văn phòng','Nhà trẻ','Mẫu giáo'];
const tClasses=()=>S.classes.filter(c=>c.block!=='Văn phòng');
const nameOf=id=>S.names[id]||'Một thành viên';
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2200)}
const pill=st=>{const [l,c]=STATUS[st]||STATUS.nhap;return`<span class="pill ${c}">${l}</span>`};

/* ---------- data (Firebase) ---------- */
let unsubs=[];
function boot(){
  render();
  if(!window.firebase||!FIREBASE_CONFIG.apiKey){S.ready=true;S.setupMissing=true;render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth();S.auth=auth;
  auth.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f());unsubs=[];
    S.fbUser=u;S.meId=u?.uid||null;S.db=null;S.ready=false;S.me=null;S.role='gv';S.names={};for(const k of ['users','classes','children','plans','proc','period','depts','staff','spFiles','yccd','yccdMeta','topicSets','classGoals','topicPlans','planLog','weekPlans'])S[k]=[];S.sp={};S.catalog=null;
    if(!u){S.ready=true;render();return}
    const db=firebase.firestore();
    const isAdmin=ADMIN_EMAILS.includes((u.email||'').toLowerCase());
    const meRef=db.doc('users/'+u.uid);
    const email=(u.email||'').toLowerCase();
    const staffRef=db.doc('staff/'+email);
    const compute=(me,st)=>{
      if(isAdmin)return{...me,...(st||{}),role:'bgh',status:'active'};
      if(st)return{...me,...st,role:roleOfPosition(st.position),status:st.status==='khoa'?'khoa':'active'};
      return{...me,role:me.role,status:me.status};
    };
    try{
      let snap=await meRef.get();
      if(!snap.exists){await meRef.set({email:u.email||'',name:u.displayName||u.email||'',role:'gv',status:'cho',classIds:[],createdAt:new Date().toISOString()});snap=await meRef.get()}
      let st=null;try{const ss=await staffRef.get();if(ss.exists)st=ss.data()}catch(e){}
      S.myStaff=st;S.me=compute(snap.data(),st);
    }catch(e){console.warn(e);S.me={status:'loi'}}
    S.role=S.me.role||'gv';
    let lastMe=null;
    const recheck=()=>{if(!lastMe)return;const n=compute(lastMe,S.myStaff);if(n.status!==S.me.status||n.role!==S.me.role){location.reload();return}S.me=n;render()};
    unsubs.push(meRef.onSnapshot(d=>{if(!d.exists)return;lastMe=d.data();recheck()}));
    unsubs.push(staffRef.onSnapshot(d=>{S.myStaff=d.exists?d.data():null;recheck()},()=>{}));
    if(S.me.status!=='active'){S.ready=true;render();return}
    S.db=db;
    let pending=18;const done=()=>{if(--pending<=0){S.ready=true}render()};
    const sub=(col,key,sort)=>{let first=true;unsubs.push(db.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));if(sort)S[key].sort(sort);if(key==='users'||key==='staff')buildNames();if(first){first=false;done()}else render()},err=>{console.warn(col,err);if(first){first=false;done()}}))};
    sub('users','users',(a,b)=>(a.name||'').localeCompare(b.name||'','vi'));
    sub('classes','classes',(a,b)=>(a.order??999)-(b.order??999)||(a.name||'').localeCompare(b.name||'','vi',{numeric:true}));
    sub('children','children',(a,b)=>(a.name||'').localeCompare(b.name||'','vi'));
    sub('plans','plans',(a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
    sub('evalProcess','proc',(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));
    sub('evalPeriod','period');
    sub('staff','staff',(a,b)=>(a.classCode||'').localeCompare(b.classCode||'','vi',{numeric:true})||(a.name||'').localeCompare(b.name||'','vi'));
    {let first=true;unsubs.push(db.doc('settings/catalog').onSnapshot(d=>{S.catalog=d.exists?d.data():null;if(first){first=false;done()}else render()},()=>{if(first){first=false;done()}}))}
    sub('schoolPlanFiles','spFiles',(a,b)=>(b.createdDate||'').localeCompare(a.createdDate||'')||(b.createdAt||'').localeCompare(a.createdAt||''));
    sub('yccd','yccd');
    sub('yccdMeta','yccdMeta');
    sub('topicSets','topicSets');
    sub('classGoals','classGoals');
    sub('topicPlans','topicPlans');
    sub('weekPlans','weekPlans');
    {let first=true;unsubs.push(db.doc('settings/ai').onSnapshot(d=>{S.aiCfg=d.exists?d.data():null;if(first){first=false;done()}else render()},()=>{if(first){first=false;done()}}))}
    sub('classPlanLog','planLog',(a,b)=>(b.at||'').localeCompare(a.at||''));
    sub('departments','depts',(a,b)=>(a.order??99)-(b.order??99)||(a.name||'').localeCompare(b.name||'','vi'));
  });
}

let lastKey='';

  const key=S.view+'|'+(S.arg?.id||S.arg?.level||S.arg||'')+(S.view==='school'?'|'+(S.sp?.edit||''):'');

  </section>

function readForm(L){
  const v=id=>document.getElementById(id)?.value??'';
  const data={};
  for(const [k] of L.fields){
    if(k==='DOMAINS')DOMAINS.forEach(([dk])=>data['dm_'+dk]=v('f_dm_'+dk));
    else if(k==='GRID'){data.grid={};WEEK_ROWS.forEach((r,ri)=>WEEK_COLS.forEach((c,ci)=>{const x=v(`g_${ri}_${ci}`);if(x)data.grid[ri+'_'+ci]=x}))}
    else if(k==='LINHVUC')data.linh_vuc=v('f_linh_vuc');
    else data[k]=v('f_'+k);
  }
  return{year:v('h_year')||S.year,classId:v('h_cls'),ageGroup:v('h_age'),period:v('h_period'),parentId:v('h_parent'),title:v('h_title').trim(),data};
}
function autoTitle(L,f){
  const cn=f.classId?clsName(f.classId):'';
  switch(L.k){
    case'truong':return`Kế hoạch nhà trường ${f.year}`;
    case'namhoc':return`KHGD năm học ${f.year} – ${f.ageGroup||''}`;
    case'lop':return`KHGD lớp ${cn} ${f.year}`;
    case'thang':return`Kế hoạch tháng ${f.period?+f.period.slice(5):''} – ${cn}${f.data.chu_de?' – '+f.data.chu_de.split('\n')[0]:''}`;
    case'tuan':return`Tuần từ ${fmtD(f.period)} – ${cn}${f.data.chu_de?' – '+f.data.chu_de.split('\n')[0]:''}`;
    case'ngay':return`${(f.data.ten_hd||'Giáo án').split('\n')[0]} – ${cn} – ${fmtD(f.period)}`;
  }
}
async function savePlan(status){
  const a=S.arg;const p=a.id?S.plans.find(x=>x.id===a.id):null;const pl=p||a.draft;const L=LV[pl.level];
  const f=readForm(L);
  if(L.cls&&!f.classId){toast('Hãy chọn lớp');return}
  const doc={level:L.k,...f,title:f.title||autoTitle(L,f),status,...stamp()};
  if(status==='cho')doc.reviewNote='';
  await guard(async()=>{
    if(p){if(p.authorId)doc.authorId=p.authorId;await S.db.doc('plans/'+p.id).update(doc)}
    else{doc.createdAt=doc.updatedAt;const ref=await S.db.collection('plans').add(doc);S.arg={id:ref.id,saving:true};lastKey=''}
  },status==='cho'?'Đã gửi duyệt':'Đã lưu nháp');
  render();
}

async function readStuFile(file){
  if(!window.XLSX){toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng');return}
  const c=S.classes.find(x=>x.id===S.stuCls);if(!c)return;
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const norm=t=>String(t??'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
  const pick=wb.SheetNames.find(n=>n.trim().toUpperCase()===String(c.code||'').toUpperCase())||wb.SheetNames.find(n=>{const g=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});return g.some(r=>r.some(x=>norm(x)==='mã định danh'))})||wb.SheetNames[0];
  const grid=XLSX.utils.sheet_to_json(wb.Sheets[pick],{header:1,raw:true,defval:''});
  const hi=grid.findIndex(r=>r.some(x=>norm(x)==='tên')||r.some(x=>norm(x)==='mã định danh'));
  if(hi<0){toast('Không tìm thấy dòng tiêu đề (Họ đệm, Tên, Mã định danh…)');return}
  const H=grid[hi].map(norm);const ix=(...ns)=>H.findIndex(h=>ns.some(n=>h===n||h.includes(n)));
  const col={last:ix('họ đệm','họ và đệm'),first:H.findIndex(h=>h==='tên'),full:ix('họ tên','họ và tên'),sid:ix('mã định danh','định danh'),dob:ix('ngày sinh'),st:ix('thái'),note:ix('ghi chú'),from:ix('từ ngày'),to:ix('đến ngày')};
  const today=new Date().toISOString().slice(0,10);
  const rows=[];const seen=new Set();
  grid.slice(hi+1).forEach((r,i)=>{
    const g=k=>col[k]>=0?r[col[k]]:'';
    let last=String(g('last')).trim(),first=String(g('first')).trim();
    if(!first&&col.full>=0){const sp=splitName(g('full'));last=sp.last;first=sp.first}
    if(/^\d+$/.test(first)&&/^\d*$/.test(last))return; // dòng đánh số cột 1,2,3…
    if(!first&&!last)return;
    let sid=g('sid');sid=typeof sid==='number'?String(sid).padStart(12,'0'):String(sid).trim();
    const stRaw=norm(g('st'));const status=stRaw.includes('nghỉ')?'Tạm nghỉ':'Đang học';
    const row={line:hi+i+2,lastName:last,firstName:first,studentId:sid,dob:toISO(g('dob')),status,note:String(g('note')||'').trim(),fromDate:toISO(g('from')),toDate:toISO(g('to'))};
    if(!first)Object.assign(row,{kind:'error',err:'Thiếu tên'});
    else if(sid&&seen.has(sid))Object.assign(row,{kind:'error',err:'Trùng mã định danh trong file'});
    else{
      const ex=sid?S.children.find(k=>k.studentId===sid):S.children.find(k=>k.classId===c.id&&(k.name||'').toLowerCase()===`${last} ${first}`.trim().toLowerCase()&&(!row.dob||k.dob===row.dob));
      row.exId=ex?.id;row.kind=!ex?'new':ex.classId!==c.id?'move':'update';if(ex&&ex.classId!==c.id)row.from=clsName(ex.classId);
      if(row.dob&&row.dob>today)row.warn='Ngày sinh sau hôm nay';
      else if(!row.dob)row.warn='Thiếu ngày sinh';
    }
    if(sid)seen.add(sid);rows.push(row);
  });
  S.stuImport={file:file.name+(wb.SheetNames.length>1?` – sheet ${pick}`:''),rows};lastKey='';render();
}
async function confirmStuImport(){
  const c=S.classes.find(x=>x.id===S.stuCls);const ok=S.stuImport.rows.filter(r=>r.kind!=='error');
  await guard(async()=>{for(let i=0;i<ok.length;i+=400){const b=S.db.batch();for(const r of ok.slice(i,i+400)){const d={classId:c.id,lastName:r.lastName,firstName:r.firstName,name:`${r.lastName} ${r.firstName}`.trim(),studentId:r.studentId,dob:r.dob,status:r.status,note:r.note,fromDate:r.fromDate,toDate:r.toDate,updatedAt:new Date().toISOString()};b.set(r.exId?S.db.doc('children/'+r.exId):S.db.collection('children').doc(),d,{merge:true})}await b.commit()}},`Đã nhập ${ok.length} học sinh`);
  S.stuImport=null;lastKey='';render();
}
async function saveStu(){
  const v=id=>(document.getElementById(id)?.value||'').trim();
  const ed=S.stuEdit!=='new'?S.children.find(k=>k.id===S.stuEdit):null;
  const last=v('kLast'),first=v('kFirst'),sid=v('kSid');
  if(!first){toast('Nhập tên học sinh');return}
  if(sid&&S.children.some(k=>k.studentId===sid&&k.id!==ed?.id)){toast('Mã định danh này đã có ở học sinh khác');return}
  const d={classId:ed?v('kClass')||ed.classId:S.stuCls,lastName:last,firstName:first,name:`${last} ${first}`.trim(),studentId:sid,dob:v('kDob'),status:v('kStatus')||'Đang học',note:v('kNote'),fromDate:v('kFrom'),toDate:v('kTo'),updatedAt:new Date().toISOString()};
  await guard(()=>ed?S.db.doc('children/'+ed.id).set(d,{merge:true}):S.db.collection('children').add(d),ed?'Đã lưu':'Đã thêm học sinh');
  S.stuEdit=null;lastKey='';render();
}

const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
async function spStoreFile(f){
  const b64=await readB64(f);const n=Math.ceil(b64.length/SP_CHUNK)||1;const key=S.db.collection('fileChunks').doc().id;
  for(let i=0;i<n;i++){S.sp.busy=`Đang tải lên ${Math.round(i*100/n)}%`;const el=$('[data-act=spSave]');if(el)el.textContent=S.sp.busy;
    await S.db.doc(`fileChunks/${key}_${i}`).set({fileKey:key,i,data:b64.slice(i*SP_CHUNK,(i+1)*SP_CHUNK)})}
  return{fileKey:key,chunks:n,fileName:f.name,size:f.size,mime:f.type||''};
}
async function spDropFile(key,n){for(let i=0;i<(n||1);i++)await S.db.doc(`fileChunks/${key}_${i}`).delete()}

  S.sp.busy='Đang lưu';const el=$('[data-act=spSave]');if(el){el.textContent=S.sp.busy;el.disabled=true}
  const K=spKind(),KN=SPK[K],age=spAge(KN);if(KN.cls&&!canCls(spCls())){toast('Chỉ giáo viên lớp này hoặc Ban giám hiệu được lưu');S.sp.busy=null;render();return}const P=f&&(KN.ages||KN.topics)&&S.sp.parsed?.items?.length?S.sp.parsed:null;
  if(P&&P.age&&P.age!==age){const t=KN.ages.find(a=>a[0]===P.age);toast(t?`File này là ${t[1]}. Hãy chuyển sang tab ${t[1]} để lưu.`:'Độ tuổi trong file khác với tab đang chọn');return}
  await guard(async()=>{
    if(f)Object.assign(d,await spStoreFile(f));
    let id=ed?.id;
    if(ed){await S.db.doc('schoolPlanFiles/'+ed.id).set(d,{merge:true});if(f&&ed.fileKey)await spDropFile(ed.fileKey,ed.chunks)}
    else id=(await S.db.collection('schoolPlanFiles').add({...d,kind:K,...(KN.ages?{age}:{}),...(KN.cls?{cls:spCls()}:{}),createdAt:d.updatedAt,createdBy:S.meId||''})).id;
    if(P){const el=$('[data-act=spSave]');if(el)el.textContent='Đang cập nhật dữ liệu từ file';if(KN.topics)await applyTopics(P,{id,...d});else await applyYccd(K,age,P,{id,...d})}
  },P?(KN.topics?`Đã lưu file và nạp ${P.items.length} chủ đề`:`Đã lưu file và nạp ${P.items.length} mục tiêu`):ed?'Đã lưu':'Đã thêm');
  S.sp.busy=null;S.sp.edit=null;S.sp.parsed=null;lastKey='';render();

async function spBlob(x){
  const parts=[];for(let i=0;i<(x.chunks||1);i++){const d=await S.db.doc(`fileChunks/${x.fileKey}_${i}`).get();if(!d.exists)throw new Error('missing chunk');parts.push(d.data().data)}
  const bin=atob(parts.join(''));const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type:x.mime||'application/octet-stream'});
}
async function ycLoad(id){
  const x=S.spFiles.find(y=>y.id===id);if(!x?.fileKey)return;toast('Đang đọc file…');
  try{if(x.kind==='namhoc'){const p=await parseTopics(await spBlob(x));if(!p.items.length){toast('Không tìm thấy phần Dự kiến chủ đề trong file này');return}await applyTopics(p,x);toast(`Đã nạp ${p.items.length} chủ đề lớn từ file này`);return}
    const p=await parseYccd(await spBlob(x));if(!p.items.length){toast('Không tìm thấy bảng YCCĐ trong file này');return}
    const n=await applyYccd(x.kind,x.age,p,x);toast(`Đã nạp ${p.items.length} mục tiêu từ file này${n?`, ẩn ${n} mã không còn trong file`:''}`)}
  catch(e){console.warn(e);toast(e?.code==='permission-denied'?'Tài khoản của bạn không có quyền làm việc này':'Không đọc được file này')}
}
async function spDownload(id){
  const x=S.spFiles.find(y=>y.id===id);if(!x?.fileKey)return;toast('Đang tải file…');
  try{const url=URL.createObjectURL(await spBlob(x));const a=document.createElement('a');a.href=url;a.download=x.fileName||'ke-hoach';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){console.warn(e);toast('Chưa tải được file, thử lại sau')}
}

/* ---------- KHGD lớp: mục tiêu gắn chủ đề (sheet CHU DE) ---------- */
const GDOM=[['TC','Thể chất',/TH[EỂ]\s*CH[AẤ]T/i],['NN','Ngôn ngữ',/NG[OÔ]N\s*NG[UỮ]/i],['NT','Nhận thức',/NH[AẬ]N\s*TH[UỨ]C/i],['TX','TC – XH',/TCXH|T[IÌ]NH\s*C[AẢ]M/i],['NgT','Nghệ thuật',/NGH[EỆ]\s*THU[AẬ]T|(^|\s)N\.?\s*THU[AẬ]T/i]];
const clsLabel=code=>{const c=S.classes.find(x=>(x.code||x.id)===code);return c?c.name:code};
const AGEKEY={'Nhà trẻ 24–36 tháng':'24-36','Mẫu giáo bé 3–4 tuổi':'3-4','Mẫu giáo nhỡ 4–5 tuổi':'4-5','Mẫu giáo lớn 5–6 tuổi':'5-6'};
async function parseGoalsXlsx(file){
  if(!window.XLSX)throw new Error('no xlsx');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sn=wb.SheetNames.find(n=>n.replace(/\s/g,'').toUpperCase()==='CHUDE');if(!sn)return{err:'Không thấy sheet CHUDE (hoặc CHU DE) trong file này.'};
  const g=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  const str=v=>String(v??'').replace(/\s+/g,' ').trim();
  const iso=v=>{if(typeof v==='number'&&v>20000){const d=XLSX.SSF.parse_date_code(v);return`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
    const m=str(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return'';const Y=m[3].length===2?'20'+m[3]:m[3];return`${Y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};
  let year='',applies='';const notes=[];
  const hi=g.findIndex((r,i)=>i<20&&/^Tuần$/i.test(str(r[0])));if(hi<0)return{err:'Không thấy dòng tiêu đề (cột A ghi “Tuần”) trong sheet CHUDE.'};
  for(const r of g.slice(0,hi)){const a=str(r[0]);
    const ym=a.match(/Năm học:?\s*(\d{4})\s*[-–]\s*(\d{4})/i);if(ym)year=ym[1]+'-'+ym[2];
    const km=a.match(/^Khối\s*:?\s*(.+)$/i);if(km)applies=km[1];
    const b=str(r[1]).replace(/\s*\d{4}\s*[-–]\s*\d{4}$/,'');if(/^(Ngày|Nghỉ)/i.test(b)&&r[2]!==''){const v=r[2];notes.push(b+': '+(typeof v==='number'?fmtD(iso(v)):str(v)))}}
  const H=g[hi].map(str);const col={};GDOM.forEach(([k,,re])=>{col[k]=H.findIndex(h=>re.test(h))});
  const nCol=H.findIndex(h=>/SỐ\s*MT/i.test(h)),tCol=H.findIndex(h=>/Giáo viên|Phụ trách/i.test(h));
  const age=ageKey(applies);
  const topics=[],events=[],bad=[];
  for(const r of g.slice(hi+1,60)){
    const wk=str(r[0]),name=str(r[1]),fr=iso(r[2]),to=iso(r[3])||fr,own=tCol>=0?str(r[tCol]):'';
    if(!name)continue;const t=topics[topics.length-1];
    if(/^\d+$/.test(wk)&&t){const goals={};let n=0;
      for(const [k] of GDOM){const raw=col[k]>=0?str(r[col[k]]):'';const codes=raw.split(/[;,\s]+/).map(x=>x.trim()).filter(Boolean);
        codes.forEach(c=>{if(!/^[A-Za-zĐđ]+\d+\.\d+$/.test(c))bad.push(`Tuần ${wk}: “${c}”`)});goals[k]=codes;n+=codes.length}
      t.subs.push({id:t.id+'.'+(t.subs.length+1),week:+wk,name,from:fr,to,...(own?{owner:own}:{}),goals,n,nFile:nCol>=0?+r[nCol]||0:n});continue}
    if(!fr){topics.push({id:'t'+(topics.length+1),no:topics.length+1,name:name.replace(/^\d+\s*\.\s*/,''),owner:own,from:'',to:'',weeks:0,subs:[]});continue}
    const ev=/^NGH[IỈ]\s*T[EẾ]T/i.test(name)?'Nghỉ Tết Nguyên đán':name;const last=events[events.length-1];
    if(last&&last.name===ev&&last.after===topics.length)last.to=to;else events.push({name:ev,from:fr,to,after:topics.length,...(own?{owner:own}:{})});
  }
  const tp=topics.filter(t=>t.subs.length);
  if(!tp.length)return{err:'Không đọc được tuần nào từ sheet CHUDE.'};
  tp.forEach((t,i)=>{t.no=i+1;t.id='t'+(i+1);t.subs.forEach((x,j)=>x.id=t.id+'.'+(j+1));t.from=t.subs[0].from;t.to=t.subs.reduce((a,x)=>x.to>a?x.to:a,'');t.weeks=new Set(t.subs.map(x=>x.week)).size});
  const subs=tp.flatMap(t=>t.subs);
  return{year,applies,age,progNote:notes.join('; '),topics:tp,events,bad,weekCount:new Set(subs.map(x=>x.week)).size,goalCount:subs.reduce((a,x)=>a+x.n,0)};
}
async function loadGoalsXlsx(file,cls){
  if(!canCls(cls)){toast('Chỉ giáo viên lớp này hoặc Ban giám hiệu được nạp');return}
  const p=await parseGoalsXlsx(file);if(p.err){toast(p.err);return}
  const c=S.classes.find(x=>(x.code||x.id)===cls);const year=p.year||S.year;
  const age=p.age||AGEKEY[c?.ageGroup]||'';
  const doc=JSON.parse(JSON.stringify({year,cls,className:c?.name||cls,age,applies:p.applies,progNote:p.progNote,topics:p.topics,events:p.events,weekCount:p.weekCount,goalCount:p.goalCount,bad:p.bad.slice(0,50),fileName:file.name,updatedAt:new Date().toISOString(),updatedBy:S.meId||''}));
  await guard(()=>S.db.doc(`classGoals/${year}_${cls}`).set(doc),`Đã nạp ${p.weekCount} tuần, ${p.goalCount} lượt mục tiêu cho lớp ${c?.name||cls}`+(year!==S.year?` (năm học ${year})`:''));
}
function vGoals(cls,ro){
  const G=S.classGoals.find(x=>x.id===`${S.year}_${cls}`);const sp=S.sp;
  const up=ro?'':`<label class="btn sm ${G?'':'pri'}" style="cursor:pointer">${G?'Nạp lại Excel mục tiêu':'Nạp Excel mục tiêu'}<input type="file" accept=".xlsx,.xls" data-gxl="${esc(cls)}" hidden></label>`;
  if(!G)return`<section class="sheet stack"><h3 style="margin:0">Mục tiêu gắn chủ đề – ${esc(clsLabel(cls))}</h3><p class="muted small" style="margin:0">Chưa có. Chọn file Excel KHGD của lớp, app đọc sheet CHUDE (từ dòng tiêu đề “Tuần” đến dòng 60, cột A – K): chủ đề, tuần, thời gian và mã mục tiêu theo 5 lĩnh vực.</p>${up?`<div class="row">${up}</div>`:''}</section>`;
  const Y=S.yccd.filter(x=>x.age===G.age&&x.active!==false);const ymap=Object.fromEntries(Y.map(x=>[x.code,x]));
  const used=new Set(G.topics.flatMap(t=>t.subs.flatMap(s=>GDOM.flatMap(([k])=>s.goals?.[k]||[]))));
  const unknown=Y.length?[...used].filter(c=>!ymap[c]):[];const unused=Y.filter(x=>!used.has(x.code)).map(x=>x.code);
  const td=today();const inR=(a,b)=>a&&b&&a<=td&&td<=b;
  const chip=c=>{const y=ymap[c];return`<span class="pill" style="margin:1px;${Y.length&&!y?'background:var(--rose-soft,#fde2e4);color:var(--rose)':''}" title="${esc(y?(y.mt||y.yccd||''):(Y.length?'Mã này không có trong bảng phân giải YCCĐ '+G.age:''))}">${esc(c)}</span>`};
  const evRow=e=>`<tr style="background:var(--sun-soft)"><td></td><td colspan="${4+GDOM.length+1}"><b>${esc(e.name)}</b> <span class="small">${fmtD(e.from)}${e.to&&e.to!==e.from?' – '+fmtD(e.to):''}</span>${e.owner?` <span class="small muted">· ${esc(e.owner)}</span>`:''}</td></tr>`;
  let rows='';
  G.topics.forEach((t,i)=>{

const ageKey=t=>{const m=String(t||'').match(/(\d+)\s*[–-]\s*(\d+)/);return m?m[1]+'-'+m[2]:''};

async function parseYccd(file){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());const f=zip.file('word/document.xml');if(!f)throw new Error('not docx');
  const doc=new DOMParser().parseFromString(await f.async('string'),'application/xml');
  const NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const kids=(el,n)=>[...el.childNodes].filter(c=>c.localName===n);
  const ptxt=p=>[...p.getElementsByTagNameNS(NS,'t')].map(t=>t.textContent).join('').trim();
  const ctxt=tc=>[...tc.getElementsByTagNameNS(NS,'p')].map(ptxt).filter(Boolean).join('\n');
  const body=doc.getElementsByTagNameNS(NS,'body')[0];
  let dom=null,domName='',ageText='',head=null;const items=[],doms=[],dup=[];const seen=new Set();
  for(const el of body.childNodes){
    if(el.localName==='p'){const t=ptxt(el);
      const m=t.match(/^(I|II|III|IV|V|VI|VII)\.\s*(.+)$/);if(m){dom=m[1];domName=niceDom(m[2]);doms.push([dom,domName]);continue}
      const a=t.match(/ĐỘ TUỔI\s*(.+)$/i);if(a&&!ageText)ageText=a[1].trim();
    }else if(el.localName==='tbl'&&dom){
      let prev=[],map=null;
      for(const tr of kids(el,'tr')){
        const row=[];let g=0;
        for(const tc of kids(tr,'tc')){const pr=kids(tc,'tcPr')[0];const gs=pr&&kids(pr,'gridSpan')[0];const span=+(gs?.getAttributeNS(NS,'val')||1);
          const vm=pr&&kids(pr,'vMerge')[0];const cont=vm&&(vm.getAttributeNS(NS,'val')||'continue')!=='restart';
          const v=cont?(prev[g]||''):ctxt(tc);for(let k=0;k<span;k++)row[g+k]=v;g+=span}
        prev=row;
        if(!map&&row.some(c=>/Mã\s*YCC/i.test(c))){map={code:row.findIndex(c=>/^Mã/i.test(c)),y:row.findIndex(c=>/^Yêu cầu/i.test(c)),m:row.findIndex(c=>/^Mục tiêu/i.test(c))};if(!head)head={y:row[map.y]||'Yêu cầu cần đạt',m:row[map.m]||'Mục tiêu giáo dục'};continue}
        if(!map||map.code<0)continue;
        const code=(row[map.code]||'').replace(/\s+/g,'');if(!/^[A-Za-zĐđ]+\d+\.\d+/.test(code))continue;
        if(seen.has(code)){dup.push(code);continue}seen.add(code);
        const comp=map.code>=2?row[map.code-1]||'':'';const cm=comp.match(/^([A-Za-zĐđ]+\d+)\.\s*([\s\S]*)$/);
        items.push({domain:dom,domainName:domName,competency:map.code>=2?row[0]||'':'',componentCode:cm?cm[1]:'',component:cm?cm[2].trim():comp,code,yccd:map.y>=0?row[map.y]||'':'',mt:map.m>=0?row[map.m]||'':'',order:items.length+1});
      }
    }
  }
  return{ageText,age:ageKey(ageText),head,items,doms,dup};
}

const TB={nt:'Nhà trẻ',mg:'Mẫu giáo'};
const niceName=s=>{if(s!==s.toUpperCase())return s;const l=s.toLowerCase();return l.charAt(0).toUpperCase()+l.slice(1).replace(/\bmn\b/g,'MN').replace(/bác hồ/g,'Bác Hồ').replace(/\bvn\b/g,'VN').replace(/tết/g,'Tết').replace(/việt nam/g,'Việt Nam').replace(/&/g,' & ').replace(/\s+/g,' ')};
async function parseTopics(file){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());const f=zip.file('word/document.xml');if(!f)throw new Error('not docx');
  const doc=new DOMParser().parseFromString(await f.async('string'),'application/xml');
  const NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const kids=(el,n)=>[...el.childNodes].filter(c=>c.localName===n);
  const ptxt=p=>[...p.getElementsByTagNameNS(NS,'t')].map(t=>t.textContent).join('').trim();
  const clines=tc=>[...tc.getElementsByTagNameNS(NS,'p')].map(ptxt).filter(Boolean);
  const body=doc.getElementsByTagNameNS(NS,'body')[0];
  let year='',progNote='',cur=null;const blocks=[];
  const y0=()=>+(year.split('-')[0])||+(S.year.split('-')[0]);
  const dm=(d,m,yy)=>{const Y=yy?+yy:(+m>=8?y0():y0()+1);return`${Y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
  const range=s=>{const r=[...String(s).matchAll(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/g)].map(m=>dm(m[1],m[2],m[3]));return{from:r[0]||'',to:r[1]||r[0]||''}};
  for(const el of body.childNodes){

      const ym=t.match(/^Năm học:?\s*(\d{4})\s*[-–]\s*(\d{4})/i);if(ym&&!year){year=ym[1]+'-'+ym[2];continue}
      if(/^Thời gian thực hiện chương trình/i.test(t)){progNote=t;continue}
      const bm=t.match(/^\d+(\.\d+)?\.?\s*Đối với\s+(.+)$/i);if(bm){cur={block:/nhà trẻ/i.test(bm[2])?'nt':/mẫu giáo/i.test(bm[2])?'mg':'b'+blocks.length,label:'',applies:'',topics:[],events:[],totalWeeks:0};cur.label=TB[cur.block]||bm[2];continue}
      const am=t.match(/^\(\s*Áp dụng cho\s+(.+?)\s*\)$/i);if(am&&cur){cur.applies=am[1].replace(/\s+/g,' ');continue}
    }else if(el.localName==='tbl'&&cur){
      let map=null;
      for(const tr of kids(el,'tr')){
        const row=[];let g=0;
        for(const tc of kids(tr,'tc')){const pr=kids(tc,'tcPr')[0];const gs=pr&&kids(pr,'gridSpan')[0];const span=+(gs?.getAttributeNS(NS,'val')||1);const v=clines(tc);for(let k=0;k<span;k++)row[g+k]=k?null:v;g+=span}
        const T=i=>(row[i]||[]).join('\n');
        if(!map){const fi=re=>row.findIndex(c=>c&&re.test(c.join(' ')));
          if(row.some(c=>c&&/Tên chủ đề/i.test(c.join(' '))))map={no:fi(/^Stt/i),name:fi(/Tên chủ đề/i),sub:fi(/nhánh/i),wk:fi(/Số tuần/i),time:fi(/Thời gian/i)};
          else if(row.some(c=>c&&/^TUẦN$/i.test(c.join(' ').trim()))&&row.some(c=>c&&/Từ ngày/i.test(c.join(' '))))map={flat:true,wk:fi(/^TUẦN$/i),name:fi(/CHỦ ĐỀ/i),from:fi(/Từ ngày/i),to:fi(/Đến ngày/i)};
          continue}
        if(map.flat){
          const wk=T(map.wk).trim(),name=T(map.name).replace(/\s+/g,' ').trim(),fr=range(T(map.from)).from,to=range(T(map.to)).from;
          if(!name&&!fr)continue;
          const t=cur.topics[cur.topics.length-1];
          if(/^\d+$/.test(wk)&&t){const par=t.subs.length&&t.subs[t.subs.length-1].week===+wk;const cm=name.match(/\(\s*(Khối[^)]*|Lớp[^)]*)\)\s*$/i);
            t.subs.push({id:t.id+'.'+(t.subs.length+1),week:+wk,name:cm?name.slice(0,cm.index).trim():name,from:fr,to:to||fr,classes:cm?cm[1]:'',...(par?{parallel:true}:{})});continue}
          if(!fr){const k=cur.block+(cur.topics.length+1);cur.topics.push({id:k,no:cur.topics.length+1,name:name.replace(/\s+/g,' ').trim(),weeks:0,from:'',to:'',note:'',subs:[]});continue}
          const ev=/^NGH[IỈ]\s*T[EẾ]T/i.test(name)?'Nghỉ Tết Nguyên đán':niceName(name);const last=cur.events[cur.events.length-1];
          if(last&&last.name===ev&&last.after===cur.topics.length)last.to=to||fr;else cur.events.push({name:ev,from:fr,to:to||fr,after:cur.topics.length});
          continue}
        const no=T(map.no).trim();
        if(/^\d+$/.test(no)){
          const tr2=range(T(map.time));const note=(T(map.time).match(/\(([^)]*)\)/)||[])[1]||'';
          const subs=[];
          for(let line of row[map.sub]||[]){line=line.trim();
            if(/^\(/.test(line)&&!/^-/.test(line)){const inner=line.replace(/^\(|\)$/g,'').trim();subs.push({name:inner,isBreak:true,...range(inner)});continue}
            line=line.replace(/^[-–•]\s*/,'');const m=line.match(/\(\s*(\d{1,2}\/\d{1,2})\s*[-–]\s*(\d{1,2}\/\d{1,2})\s*\)/);
            if(m){const r=range(m[1]+' '+m[2]);const after=line.slice(m.index+m[0].length).replace(/^\s*[-–]\s*/,'').trim();subs.push({name:line.slice(0,m.index).trim(),...r,classes:after})}

        }else{
          const label=(row.find((c,i)=>c&&c.length&&i!==map.time)||[]).join(' ').trim();
          if(/Tổng số tuần/i.test(label)){cur.totalWeeks=parseInt(T(map.wk))||0;continue}
          if(label)cur.events.push({name:label,...range(T(map.time)),after:cur.topics.length});
        }
      }
      if(map?.flat){cur.topics=cur.topics.filter(t=>t.subs.length);cur.topics.forEach((t,i)=>{t.no=i+1;t.from=t.subs[0].from;t.to=t.subs.reduce((a,x)=>x.to>a?x.to:a,'');t.weeks=new Set(t.subs.map(x=>x.week)).size});const ws=cur.topics.flatMap(t=>t.subs.map(x=>x.week));cur.totalWeeks=new Set(ws).size;cur.maxWeek=Math.max(...ws)}
      if(cur.topics.length){cur.subCount=cur.topics.reduce((a,t)=>a+t.subs.filter(s=>!s.isBreak).length,0);blocks.push(cur)}cur=null;
    }
  }

}
async function parseTopicsXlsx(file,block){
  if(!window.XLSX)throw new Error('no xlsx');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sn=wb.SheetNames.find(n=>n.replace(/\s/g,'').toUpperCase()==='CHUDE');if(!sn)return{err:'Không thấy sheet CHUDE (hoặc CHU DE) trong file này.'};
  const g=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  const str=v=>String(v??'').replace(/\s+/g,' ').trim();
  const iso=v=>{if(typeof v==='number'&&v>20000){const d=XLSX.SSF.parse_date_code(v);return`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
    const m=str(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return'';const Y=m[3].length===2?'20'+m[3]:m[3];return`${Y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};
  let year='',applies='';const notes=[];
  for(const r of g.slice(0,10)){const a=str(r[0]);
    const ym=a.match(/Năm học:?\s*(\d{4})\s*[-–]\s*(\d{4})/i);if(ym)year=ym[1]+'-'+ym[2];
    const km=a.match(/^Khối\s*:?\s*(.+)$/i);if(km)applies=km[1];
    if(/^Tuần$/i.test(a))break;
    const b=str(r[1]).replace(/\s*\d{4}\s*[-–]\s*\d{4}$/,'');if(/^(Ngày|Nghỉ)/i.test(b)&&r[2]!==''){const v=r[2];notes.push(b+': '+(typeof v==='number'?fmtD(iso(v)):str(v)))}}
  const cur={block,label:TB[block],applies,topics:[],events:[],totalWeeks:0};
  for(const r of g.slice(10,60)){
    const wk=str(r[0]),name=str(r[1]),fr=iso(r[2]),to=iso(r[3])||fr,own=str(r[4]);
    if(!name||/^Tuần$/i.test(wk))continue;
    const t=cur.topics[cur.topics.length-1];
    if(/^\d+$/.test(wk)&&t){const par=t.subs.length&&t.subs[t.subs.length-1].week===+wk;
      t.subs.push({id:t.id+'.'+(t.subs.length+1),week:+wk,name,from:fr,to,classes:'',...(own?{owner:own}:{}),...(par?{parallel:true}:{})});continue}
    if(!fr){const k=block+(cur.topics.length+1);cur.topics.push({id:k,no:cur.topics.length+1,name:name.replace(/^\d+\s*\.\s*/,''),owner:own,weeks:0,from:'',to:'',note:'',subs:[]});continue}
    const ev=/^NGH[IỈ]\s*T[EẾ]T/i.test(name)?'Nghỉ Tết Nguyên đán':name;const last=cur.events[cur.events.length-1];
    if(last&&last.name===ev&&last.after===cur.topics.length)last.to=to;else cur.events.push({name:ev,from:fr,to,after:cur.topics.length});
  }
  cur.topics=cur.topics.filter(t=>t.subs.length);
  if(!cur.topics.length)return{err:'Không đọc được chủ đề nào từ sheet CHUDE (dòng 11 – 60).'};
  cur.topics.forEach((t,i)=>{t.no=i+1;t.from=t.subs[0].from;t.to=t.subs.reduce((a,x)=>x.to>a?x.to:a,'');t.weeks=new Set(t.subs.map(x=>x.week)).size});
  const ws=cur.topics.flatMap(t=>t.subs.map(x=>x.week));cur.totalWeeks=new Set(ws).size;cur.maxWeek=Math.max(...ws);
  cur.subCount=cur.topics.reduce((a,t)=>a+t.subs.length,0);
  return{year,progNote:notes.join('; '),blocks:[cur]};
}

const classCodes=()=>{const fromList=S.classes.map(c=>c.code).filter(Boolean);if(fromList.length)return fromList;return S.catalog?.classCodes?.length?S.catalog.classCodes:DEFAULT_CLASSCODES};

function normPosition(p){const t=String(p||'').trim().replace(/\s+/g,' ');if(!t)return'';const hit=positions().find(x=>x.toLowerCase()===t.toLowerCase());return hit||t.charAt(0).toUpperCase()+t.slice(1)}

const toISO=v=>{if(!v)return'';if(v instanceof Date&&!isNaN(v))return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;const m=String(v).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;const m2=String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:''};
async function readStaffFile(file){
  if(!window.XLSX){toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng');return}
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames.find(n=>n.trim().toUpperCase()==='GV')||wb.SheetNames[0]];
  const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const norm=t=>String(t||'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
  const hi=grid.findIndex(r=>r.some(c=>norm(c)==='email'));
  if(hi<0){toast('Không tìm thấy dòng tiêu đề có cột Email');return}
  const H=grid[hi].map(norm);
  const col=(...names)=>H.findIndex(h=>names.some(n=>h===n||h.includes(n)));
  const c={code:col('mã nhân viên','mã nv'),cls:col('mã lớp'),name:col('tên nhân viên','họ và tên','họ tên'),email:col('email'),dob:col('ngày sinh'),pos:col('chức vụ')};
  const seen=new Set();const rows=[];
  grid.slice(hi+1).forEach((r,i)=>{
    const g=k=>c[k]>=0?r[c[k]]:'';
    const name=String(g('name')).trim(),email=String(g('email')).trim().toLowerCase();
    if(!name&&!email)return;
    const row={line:hi+i+2,code:String(g('code')).trim(),classCode:String(g('cls')).trim().toUpperCase(),name,email,dob:toISO(g('dob')),position:normPosition(g('pos'))};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))Object.assign(row,{kind:'error',err:'Email không hợp lệ'});
    else if(!name)Object.assign(row,{kind:'error',err:'Thiếu họ tên'});
    else if(seen.has(email))Object.assign(row,{kind:'error',err:'Trùng email trong file'});
    else row.kind=S.staff.some(x=>x.id===email)?'update':'new';
    seen.add(email);rows.push(row);
  });
  S.importPreview={file:file.name,rows};lastKey='';render();
}
async function confirmImport(){
  const ok=S.importPreview.rows.filter(r=>r.kind!=='error');
  const newCodes=[...new Set(ok.map(r=>r.classCode).filter(Boolean))].filter(v=>!classCodes().includes(v));
  const newPos=[...new Set(ok.map(r=>r.position).filter(Boolean))].filter(v=>!positions().includes(v));
  await guard(async()=>{
    for(let i=0;i<ok.length;i+=400){const b=S.db.batch();for(const r of ok.slice(i,i+400)){const ex=S.staff.find(x=>x.id===r.email);b.set(S.db.doc('staff/'+r.email),{code:r.code,classCode:r.classCode,name:r.name,email:r.email,dob:r.dob,position:r.position,status:ex?.status||'active',deptId:ex?.deptId||'',updatedAt:new Date().toISOString()},{merge:true})}await b.commit()}
    if(newCodes.length||newPos.length||!S.catalog)await S.db.doc('settings/catalog').set({classCodes:[...classCodes(),...newCodes],positions:[...positions(),...newPos]},{merge:true});
  },`Đã nhập ${ok.length} người`);
  S.importPreview=null;lastKey='';render();
}
async function saveStaff(){
  const v=id=>document.getElementById(id).value.trim();
  const email=v('sEmail').toLowerCase(),name=v('sName');
  if(!name){toast('Nhập họ tên');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Email chưa đúng');return}
  const ed=S.staffEdit!=='new'?S.staff.find(x=>x.id===S.staffEdit):null;
  if((!ed||ed.id!==email)&&S.staff.some(x=>x.id===email)){toast('Email này đã có trong danh sách');return}
  const doc={code:v('sCode'),name,email,dob:v('sDob'),classCode:v('sClass'),position:v('sPos'),deptId:v('sDept'),status:ed?.status||'active',updatedAt:new Date().toISOString()};
  await guard(async()=>{
    if(ed&&ed.id!==email){const b=S.db.batch();b.set(S.db.doc('staff/'+email),doc);b.delete(S.db.doc('staff/'+ed.id));await b.commit()}
    else await S.db.doc('staff/'+email).set(doc,{merge:true});
  },ed?'Đã lưu':'Đã thêm');
  S.staffEdit=null;lastKey='';render();
}

  if(!window.XLSX){toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng');return}
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sn=wb.SheetNames.find(n=>n.trim().toUpperCase()==='DSLOP')||wb.SheetNames.find(n=>n.trim().toUpperCase()!=='GV')||wb.SheetNames[0];
  const grid=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
  const norm=t=>String(t||'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
  const hi=grid.findIndex(r=>r.some(c=>norm(c)==='mã lớp'));
  if(hi<0){toast('Không tìm thấy dòng tiêu đề có cột Mã lớp');return}
  const H=grid[hi].map(norm);const ix=n=>H.indexOf(n);
  const c={code:ix('mã lớp'),name:ix('tên lớp'),block:ix('khối')};
  const seen=new Set();const rows=[];
  grid.slice(hi+1).forEach((r,i)=>{
    const code=String(r[c.code]||'').trim().toUpperCase(),name=String(c.name>=0?r[c.name]:'').trim(),rawB=c.block>=0?r[c.block]:'';
    if(!code&&!name)return;
    const row={line:hi+i+2,code,name,block:normBlock(rawB)||String(rawB).trim()};
    if(!code)Object.assign(row,{kind:'error',err:'Thiếu mã lớp'});
    else if(!/^[A-Za-z0-9_\-]+$/.test(code))Object.assign(row,{kind:'error',err:'Mã lớp chỉ dùng chữ, số'});
    else if(!name)Object.assign(row,{kind:'error',err:'Thiếu tên lớp'});
    else if(!normBlock(rawB))Object.assign(row,{kind:'error',err:'Khối phải là Văn phòng, Nhà trẻ hoặc Mẫu giáo'});
    else if(seen.has(code))Object.assign(row,{kind:'error',err:'Trùng mã lớp trong file'});
    else row.kind=S.classes.some(x=>x.id===code)?'update':'new';
    seen.add(code);rows.push(row);
  });
  S.clsImport={file:file.name,rows};lastKey='';render();
}

async function exportPlan(id){
  const p=S.plans.find(x=>x.id===id);if(!p)return;const L=LV[p.level];const d=p.data||{};
  const para=t=>esc(t||'').replace(/\n/g,'<br>');
  let body=`<h1 style="text-align:center">${esc(p.title)}</h1><p><b>Năm học:</b> ${esc(p.year)}${p.classId?` &nbsp; <b>Lớp:</b> ${esc(clsName(p.classId))}`:''}${p.ageGroup?` &nbsp; <b>Độ tuổi:</b> ${esc(p.ageGroup)}`:''}</p>`;
  for(const [k,label] of L.fields){
    if(k==='DOMAINS')body+=`<h2>${esc(label)}</h2>`+DOMAINS.map(([dk,dl])=>`<h3>${dl}</h3><p>${para(d['dm_'+dk])}</p>`).join('');
    else if(k==='GRID')body+=`<h2>${esc(label)}</h2><table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%"><tr><th>Hoạt động</th>${WEEK_COLS.map(c=>`<th>${c}</th>`).join('')}</tr>${WEEK_ROWS.map((r,ri)=>`<tr><td><b>${r}</b></td>${WEEK_COLS.map((c,ci)=>`<td>${para(d.grid?.[ri+'_'+ci])}</td>`).join('')}</tr>`).join('')}</table>`;
    else if(k==='LINHVUC')body+=`<p><b>${esc(label)}:</b> ${esc(Object.fromEntries(DOMAINS)[d.linh_vuc]||'')}</p>`;
    else body+=`<h2>${esc(label)}</h2><p>${para(d[k])}</p>`;
  }
  const html=`<html><head><meta charset="utf-8"><style>body{font-family:"Times New Roman";font-size:13pt}h1{font-size:16pt}h2{font-size:14pt}h3{font-size:13pt}</style></head><body>${body}</body></html>`;

  const name=(p.title||'ke-hoach').replace(/[\\/:*?"<>|]/g,'-').slice(0,80);
  const url=URL.createObjectURL(new Blob(['\ufeff'+html],{type:'application/msword'}));const link=document.createElement('a');link.href=url;link.download=name+'.doc';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

    const id=S.deptEdit;await guard(()=>id?S.db.doc('departments/'+id).update(doc):S.db.collection('departments').add({...doc,createdAt:doc.updatedAt}),id?'Đã lưu':'Đã thêm phòng ban');
    S.deptEdit=null;lastKey='';render();return}
  if(ds.act==='cancelDept'){S.deptEdit=null;lastKey='';render();return}
  if(ds.editdept){S.deptEdit=ds.editdept;lastKey='';render();window.scrollTo(0,0);return}
  if(ds.deldept){if(!armConfirm('d'+ds.deldept))return;await guard(()=>S.db.doc('departments/'+ds.deldept).delete(),'Đã xóa phòng ban');return}
  if(ds.act==='seedDepts'){await guard(async()=>{let i=1;for(const [name,type,desc] of DEPT_SAMPLE)await S.db.collection('departments').add({name,type,desc,headId:'',deputyId:'',order:i++,createdAt:new Date().toISOString()})},'Đã tạo danh sách gợi ý');return}
  if(ds.ustat){const [id,st]=ds.ustat.split('|');await guard(()=>S.db.doc('users/'+id).update({status:st}),st==='active'?'Đã duyệt':'Đã khóa');return}
  if(ds.act==='addProc'){const childId=$('#pChild').value,note=$('#pNote').value.trim();if(!childId||!note){toast('Chọn trẻ và ghi nhận xét');return}
    await guard(()=>S.db.collection('evalProcess').add({classId:S.evCls,childId,date:$('#pDate').value||today(),level:$('#pLevel').value,domains:[...S.procDomains],note,createdAt:new Date().toISOString(),...stamp()}),'Đã lưu nhận xét');
    $('#pNote').value='';S.procDomains=[];render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='ycQ'){S.sp.yq=e.target.value;render();return}if(e.target.id==='spQ'){S.sp.flt={...(S.sp.flt||{st:''}),q:e.target.value};render();return}if(e.target.id==='stuQ'){S.stuFlt={...(S.stuFlt||{st:''}),q:e.target.value};render();return}if(e.target.id==='sfQ'){S.staffFlt={...(S.staffFlt||{cc:'',pos:'',st:''}),q:e.target.value};render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches?.('label[for]'))document.getElementById(e.target.getAttribute('for'))?.click()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='selYear'){S.year=t.value;savePrefs();render()}
  else if(t.id==='spFile'&&SPK[spKind()].ages){const f=t.files[0];const KN=SPK[spKind()],age=spAge(KN),lab=KN.ages.find(a=>a[0]===age)[1];S.sp.parsed=null;const box=$('#spParse');if(!f){if(box)box.innerHTML='';return}
    parseYccd(f).then(p=>{S.sp.parsed=p.items.length?p:{err:'Không tìm thấy bảng YCCĐ (cột “Mã YCCĐ – Mã MT”) trong file này. File vẫn được lưu nhưng bảng không được cập nhật.'}}).catch(e=>{console.warn(e);S.sp.parsed={err:'Không đọc được file Word này. Hãy dùng file .docx.'}}).then(()=>{const b=$('#spParse');if(b)b.innerHTML=yccdSummary(S.sp.parsed,age,lab)})}
  else if(t.id==='spFile'&&SPK[spKind()].topics){const f=t.files[0];S.sp.parsed=null;const box=$('#spParse');if(!f){if(box)box.innerHTML='';return}
    parseTopics(f).then(p=>{S.sp.parsed=p.items.length?p:{err:'Không tìm thấy phần Dự kiến chủ đề (bảng có cột “Tên chủ đề”) trong file này. File vẫn được lưu nhưng chủ đề không được cập nhật.'}}).catch(e=>{console.warn(e);S.sp.parsed={err:'Không đọc được file Word này. Hãy dùng file .docx.'}}).then(()=>{const b=$('#spParse');if(b)b.innerHTML=topicSummary(S.sp.parsed)})}
  else if(['ktCls','ktTopic','ktSub'].includes(t.id)){const k={ktCls:'cls',ktTopic:'t',ktSub:'s'}[t.id];S.kt={...S.kt,[k]:t.value,...(k==='cls'?{t:'',s:''}:k==='t'?{s:''}:{}),draft:null};lastKey='';render()}
  else if(['kcCls','kcTopic','kcSub'].includes(t.id)){const k={kcCls:'cls',kcTopic:'t',kcSub:'s'}[t.id];S.kc={...S.kc,[k]:t.value,...(k==='cls'?{t:'',s:''}:k==='t'?{s:''}:{}),draft:null};lastKey='';render()}
  else if(t.dataset.gxl){const f=t.files[0],c=t.dataset.gxl;t.value='';if(f)loadGoalsXlsx(f,c).catch(e=>{console.warn(e);toast('Không đọc được file Excel này')})}
  else if(t.dataset.tpxl){const f=t.files[0],b=t.dataset.tpxl;t.value='';if(f)loadTopicsXlsx(f,b).catch(e=>{console.warn(e);toast('Không đọc được file Excel này')})}
  else if(t.id==='ycDom'){S.sp.ydom=t.value;render()}
  else if(t.id==='spSt'){S.sp.flt={...(S.sp.flt||{q:''}),st:t.value};render()}
  else if(t.id==='stuFile'){const f=t.files[0];t.value='';if(f)readStuFile(f).catch(e=>{console.warn(e);toast('Không đọc được file này')})}
  else if(t.id==='stuCls'){S.stuCls=t.value;S.stuEdit=null;S.stuImport=null;S.stuFlt={q:'',st:''};lastKey='';render()}
  else if(t.id==='stuSt'){S.stuFlt={...(S.stuFlt||{q:''}),st:t.value};render()}
  else if(t.id==='clsFile'){const f=t.files[0];t.value='';if(f)readClassFile(f).catch(e=>{console.warn(e);toast('Không đọc được file này')})}
  else if(t.id==='clsFlt'){S.clsFlt=t.value;render()}
  else if(t.id==='xlsFile'){const f=t.files[0];t.value='';if(f)readStaffFile(f).catch(e=>{console.warn(e);toast('Không đọc được file này')})}
  else if(['sfCC','sfPos','sfSt'].includes(t.id)){S.staffFlt={...(S.staffFlt||{q:''}),cc:$('#sfCC').value,pos:$('#sfPos').value,st:$('#sfSt').value};render()}
  else if(t.dataset.urole){guard(()=>S.db.doc('users/'+t.dataset.urole).update({role:t.value}),'Đã đổi vai trò')}
  else if(t.id==='fltCls'){S.flt.cls=t.value;render()}
  else if(t.id==='fltSt'){S.flt.st=t.value;render()}
  else if(['evClsP','evClsD','evClsS'].includes(t.id)){S.evCls=t.value;S.procChild='';savePrefs();lastKey='';render()}
  else if(t.id==='evKy'){S.evKy=t.value;lastKey='';render()}
  else if(t.id==='pFilter'){S.procChild=t.value;render()}
  else if(t.dataset.pnote){saveEvalNote(t.dataset.pnote,t.value.trim())}
  else if(t.id==='h_cls'&&S.view==='edit'){/* refresh parent choices for the class */
    const a=S.arg;if(!a.id){const f=readForm(LV[a.draft.level]);Object.assign(a.draft,f)}else{}render()}
});
boot();
</script>
</body>
