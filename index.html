<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hệ sinh thái RoseKids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: a garden-notebook app. Left rail of modules (top tabs on phones), working sheet on the right. */
:root{
  --bg:#fbf7f6; --sheet:#ffffff; --ink:#2b1f22; --muted:#76656a; --line:#ecdfe0;
  --rose:#b23a5b; --rose-soft:#f8e3e9; --leaf:#3f7a52; --leaf-soft:#e3f1e6;
  --sun:#a86a12; --sun-soft:#fbefd9; --sky:#2f6a8f; --sky-soft:#e1eef6;
  --display:"Lora",Georgia,"Times New Roman",serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1517; --sheet:#251c1f; --ink:#f3e9eb; --muted:#b7a3a8; --line:#3a2d31;
  --rose:#ec7d9a; --rose-soft:#43232d; --leaf:#80c595; --leaf-soft:#20352a;
  --sun:#e3b066; --sun-soft:#3d2e17; --sky:#82bde0; --sky-soft:#1b2f3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1517; --sheet:#251c1f; --ink:#f3e9eb; --muted:#b7a3a8; --line:#3a2d31;
  --rose:#ec7d9a; --rose-soft:#43232d; --leaf:#80c595; --leaf-soft:#20352a;
  --sun:#e3b066; --sun-soft:#3d2e17; --sky:#82bde0; --sky-soft:#1b2f3c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.5rem} h3{font-size:1.1rem}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--sheet)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.15rem;display:block}
.brand small{color:var(--muted);font-size:.78rem}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup>span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px 4px}
.nav{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;font-size:.92rem}
.nav:hover{background:var(--rose-soft)}
.nav:focus-visible{outline:2px solid var(--rose)}
.nav.on{background:var(--rose);color:#fff}
.nav em{font-style:normal;font-size:.75rem;opacity:.75;font-variant-numeric:tabular-nums}
.main{padding-block:22px 60px;padding-inline:clamp(16px,3vw,40px);min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:22px}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
select,input[type=text],input[type=date],input[type=month],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.5}
select:focus,input:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:-1px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 14px;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--rose)}
.btn:focus-visible{outline:2px solid var(--rose)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.warn{color:var(--rose)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-nhap{background:var(--line);color:var(--muted)}
.st-cho{background:var(--sun-soft);color:var(--sun)}
.st-duyet{background:var(--leaf-soft);color:var(--leaf)}
.st-sua{background:var(--rose-soft);color:var(--rose)}
.banner{border-radius:10px;padding:12px 16px;background:var(--sun-soft);color:var(--ink);font-size:.9rem;margin-bottom:16px}
/* hierarchy stem */
.stem{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.stem button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 4px;position:relative}
.stem button:focus-visible{outline:2px solid var(--rose);border-radius:8px}
.stem .bud{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);font-family:var(--display);font-weight:700;font-size:1.1rem;z-index:1;border:2px solid var(--sheet)}
.stem button:hover .bud{background:var(--rose);color:#fff}
.stem .lbl{font-size:.8rem;line-height:1.3}
.stem::before{content:"";position:absolute;left:8%;right:8%;top:29px;height:2px;background:var(--leaf);opacity:.5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.stat b{font-family:var(--display);font-size:1.6rem;display:block;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.item{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:hover{background:var(--rose-soft)}
.item:focus-visible{outline:2px solid var(--rose)}
.item .t{font-weight:600}
.item .m{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.86rem;font-weight:500;min-width:0}
label.f>span.h{font-weight:400;color:var(--muted);font-size:.78rem}
.domain{border-left:3px solid var(--leaf);padding-left:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--rose-soft);font-weight:600;font-size:.8rem}
td textarea{min-height:70px;border:none;padding:4px;background:transparent}
.wk{min-width:760px}
.wk td:first-child{font-weight:600;width:130px;background:var(--bg)}
.ev td.c{text-align:center;width:88px}
.tog{all:unset;cursor:pointer;display:inline-block;min-width:68px;padding:3px 6px;border-radius:6px;font-size:.78rem;font-weight:600;background:var(--line);color:var(--muted)}
.tog.dat{background:var(--leaf-soft);color:var(--leaf)}
.tog.chua{background:var(--rose-soft);color:var(--rose)}
.tog:focus-visible{outline:2px solid var(--rose)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.8rem}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chip:focus-visible{outline:2px solid var(--rose)}
.note{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.88rem;z-index:9}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem}
.crumbs button{all:unset;cursor:pointer;color:var(--rose);text-decoration:underline;text-underline-offset:3px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:14px 16px;gap:10px}
  .navs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .navgroup{flex-direction:row;gap:6px}
  .navgroup>span{display:none}
  .nav{white-space:nowrap;border:1px solid var(--line)}
  .stem{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
  .stem::before{display:none}
}
@media (prefers-reduced-motion:no-preference){.nav,.btn,.item{transition:background .15s,border-color .15s}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="17" r="11" fill="var(--rose-soft)"/><path d="M20 9c5 0 8 3.5 8 7.5S24 23 20 23s-8-2.5-8-6.5S15 9 20 9z" fill="var(--rose)"/><path d="M20 12c2.5 0 4 1.8 4 4s-2 3.5-4 3.5-4-1.5-4-3.5 1.5-4 4-4z" fill="var(--sheet)" opacity=".5"/><path d="M20 23v13M20 30c-3-3-6-3-8-2 2 2 5 3 8 2zm0-2c3-3 6-3 8-2-2 2-5 3-8 2z" stroke="var(--leaf)" stroke-width="2" fill="var(--leaf)" stroke-linecap="round"/></svg>
      <div><b>RoseKids</b><small>Hệ sinh thái hoa hồng</small></div>
    </div>
    <nav class="navs" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="who" id="who"></div>
    </div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ==== MÃ KẾT NỐI FIREBASE CỦA TRƯỜNG ==== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCgcRFdbPglRpKgcHeXBt-fYFIGBQhQo6k",
  authDomain: "rosekids-32f0c.firebaseapp.com",
  projectId: "rosekids-32f0c",
  storageBucket: "rosekids-32f0c.firebasestorage.app",
  messagingSenderId: "722548770821",
  appId: "1:722548770821:web:54f2083be038c62583346c"
};
/* Email quản trị (Ban giám hiệu), luôn có toàn quyền */
const ADMIN_EMAILS = ['mamnonhoahong2018@gmail.com'];
/* ======================================== */
const YEAR_NOW=(()=>{const d=new Date();const y=d.getFullYear();return d.getMonth()>=7?`${y}-${y+1}`:`${y-1}-${y}`})();
const YEARS=(()=>{const a=+YEAR_NOW.slice(0,4);return[`${a-1}-${a}`,YEAR_NOW,`${a+1}-${a+2}`]})();
const AGES=['Nhà trẻ 24–36 tháng','Mẫu giáo bé 3–4 tuổi','Mẫu giáo nhỡ 4–5 tuổi','Mẫu giáo lớn 5–6 tuổi'];
const DOMAINS=[['the_chat','Phát triển thể chất'],['nhan_thuc','Phát triển nhận thức'],['ngon_ngu','Phát triển ngôn ngữ'],['tc_xh','Phát triển tình cảm và kỹ năng xã hội'],['tham_my','Phát triển thẩm mỹ']];
const ROLES={bgh:'Ban giám hiệu',tct:'Tổ chuyên môn',gv:'Giáo viên lớp'};
const STATUS={nhap:['Nháp','st-nhap'],cho:['Chờ duyệt','st-cho'],duyet:['Đã duyệt','st-duyet'],sua:['Cần sửa','st-sua']};
const WEEK_ROWS=['Đón trẻ – Trò chuyện','Thể dục sáng','Hoạt động học','Hoạt động ngoài trời','Hoạt động góc','Hoạt động chiều','Nêu gương – Trả trẻ'];
const WEEK_COLS=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6'];
const PERIODS=[['T9','Tháng 9'],['T10','Tháng 10'],['T11','Tháng 11'],['T12','Tháng 12'],['T1','Tháng 1'],['T2','Tháng 2'],['T3','Tháng 3'],['T4','Tháng 4'],['T5','Tháng 5'],['HK1','Cuối học kỳ I'],['CN','Cuối năm học']];
const LEVELS=[
 {k:'truong',short:'Nhà trường',name:'Kế hoạch nhà trường',parent:null,cls:false,approve:['bgh'],
  fields:[['tinh_hinh','Đặc điểm tình hình','Thuận lợi, khó khăn, số lớp, số trẻ, đội ngũ'],['muc_tieu','Mục tiêu năm học'],['nhiem_vu','Nhiệm vụ trọng tâm'],['chi_tieu','Chỉ tiêu','Tỷ lệ chuyên cần, bé ngoan, trẻ suy dinh dưỡng…'],['giai_phap','Biện pháp, giải pháp'],['lich','Lịch công tác theo tháng']]},
 {k:'namhoc',short:'KHGD năm học',name:'Kế hoạch giáo dục năm học',parent:'truong',cls:false,age:true,approve:['bgh'],
  fields:[['DOMAINS','Mục tiêu giáo dục theo lĩnh vực'],['noi_dung','Nội dung giáo dục'],['chu_de','Dự kiến chủ đề cả năm','Tên chủ đề, thời gian thực hiện']]},
 {k:'lop',short:'KHGD lớp',name:'Kế hoạch giáo dục lớp',parent:'namhoc',cls:true,approve:['bgh','tct'],
  fields:[['dac_diem','Đặc điểm lớp','Sĩ số, tình hình trẻ, cơ sở vật chất'],['DOMAINS','Mục tiêu của lớp theo lĩnh vực'],['chu_de','Chủ đề và số tuần thực hiện']]},
 {k:'thang',short:'Kế hoạch tháng',name:'Kế hoạch tháng',parent:'lop',cls:true,approve:['bgh','tct'],
  fields:[['chu_de','Chủ đề tháng'],['muc_tieu','Mục tiêu tháng','Ghi số thứ tự mục tiêu lấy từ KHGD lớp'],['noi_dung','Nội dung'],['hoat_dong','Hoạt động và chuẩn bị'],['su_kien','Ngày lễ, sự kiện trong tháng']]},
 {k:'tuan',short:'Kế hoạch tuần',name:'Kế hoạch tuần',parent:'thang',cls:true,approve:['bgh','tct'],
  fields:[['chu_de','Chủ đề nhánh'],['GRID','Lịch hoạt động trong tuần'],['ghi_chu','Ghi chú']]},
 {k:'ngay',short:'Giáo án ngày',name:'Giáo án hoạt động ngày',parent:'tuan',cls:true,approve:['bgh','tct'],
  fields:[['ten_hd','Tên hoạt động'],['LINHVUC','Lĩnh vực'],['doi_tuong','Số trẻ, thời gian, địa điểm'],['md_kt','Mục đích – Kiến thức'],['md_kn','Mục đích – Kỹ năng'],['md_td','Mục đích – Thái độ'],['chuan_bi','Chuẩn bị','Đồ dùng của cô, của trẻ'],['tien_hanh','Tiến hành','Hoạt động 1: Gây hứng thú · Hoạt động 2 · Hoạt động 3 · Kết thúc'],['danh_gia','Đánh giá trẻ cuối ngày','Sức khỏe, cảm xúc, hành vi; kiến thức, kỹ năng của trẻ']]},
];
const LV=Object.fromEntries(LEVELS.map(l=>[l.k,l]));
const childLevel=k=>LEVELS.find(l=>l.parent===k);

const S={db:null,auth:null,fbUser:null,me:null,users:[],meId:null,names:{},ready:false,classes:[],children:[],plans:[],proc:[],period:[],
  role:'gv',year:YEAR_NOW,view:'home',arg:null,flt:{cls:'',st:''},evCls:'',evKy:'T10',procChild:'',procDomains:[],confirm:null};
try{const p=JSON.parse(localStorage.getItem('rk_prefs')||'{}');Object.assign(S,{year:p.year||YEAR_NOW,evCls:p.evCls||''})}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('rk_prefs',JSON.stringify({year:S.year,evCls:S.evCls}))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return dd?`${dd}/${m}/${y}`:`${m}/${y}`};
const today=()=>new Date().toISOString().slice(0,10);
const clsName=id=>S.classes.find(c=>c.id===id)?.name||'—';
const BLOCKS=['Văn phòng','Nhà trẻ','Mẫu giáo'];
const tClasses=()=>S.classes.filter(c=>c.block!=='Văn phòng');
const nameOf=id=>S.names[id]||'Một thành viên';
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2200)}
const pill=st=>{const [l,c]=STATUS[st]||STATUS.nhap;return`<span class="pill ${c}">${l}</span>`};

/* ---------- data (Firebase) ---------- */
let unsubs=[];
function boot(){
  render();
  if(!window.firebase||!FIREBASE_CONFIG.apiKey){S.ready=true;S.setupMissing=true;render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth();S.auth=auth;
  auth.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f());unsubs=[];
    S.fbUser=u;S.meId=u?.uid||null;S.db=null;S.ready=false;S.me=null;S.role='gv';S.names={};for(const k of ['users','classes','children','plans','proc','period','depts','staff'])S[k]=[];S.catalog=null;
    if(!u){S.ready=true;render();return}
    const db=firebase.firestore();
    const isAdmin=ADMIN_EMAILS.includes((u.email||'').toLowerCase());
    const meRef=db.doc('users/'+u.uid);
    const email=(u.email||'').toLowerCase();
    const staffRef=db.doc('staff/'+email);
    const compute=(me,st)=>{
      if(isAdmin)return{...me,...(st||{}),role:'bgh',status:'active'};
      if(st)return{...me,...st,role:roleOfPosition(st.position),status:st.status==='khoa'?'khoa':'active'};
      return{...me,role:me.role,status:me.status};
    };
    try{
      let snap=await meRef.get();
      if(!snap.exists){await meRef.set({email:u.email||'',name:u.displayName||u.email||'',role:'gv',status:'cho',classIds:[],createdAt:new Date().toISOString()});snap=await meRef.get()}
      let st=null;try{const ss=await staffRef.get();if(ss.exists)st=ss.data()}catch(e){}
      S.myStaff=st;S.me=compute(snap.data(),st);
    }catch(e){console.warn(e);S.me={status:'loi'}}
    S.role=S.me.role||'gv';
    let lastMe=null;
    const recheck=()=>{if(!lastMe)return;const n=compute(lastMe,S.myStaff);if(n.status!==S.me.status||n.role!==S.me.role){location.reload();return}S.me=n;render()};
    unsubs.push(meRef.onSnapshot(d=>{if(!d.exists)return;lastMe=d.data();recheck()}));
    unsubs.push(staffRef.onSnapshot(d=>{S.myStaff=d.exists?d.data():null;recheck()},()=>{}));
    if(S.me.status!=='active'){S.ready=true;render();return}
    S.db=db;
    let pending=9;const done=()=>{if(--pending<=0){S.ready=true}render()};
    const sub=(col,key,sort)=>{let first=true;unsubs.push(db.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));if(sort)S[key].sort(sort);if(key==='users'||key==='staff')buildNames();if(first){first=false;done()}else render()},err=>{console.warn(col,err);if(first){first=false;done()}}))};
    sub('users','users',(a,b)=>(a.name||'').localeCompare(b.name||'','vi'));
    sub('classes','classes',(a,b)=>(a.order??999)-(b.order??999)||(a.name||'').localeCompare(b.name||'','vi',{numeric:true}));
    sub('children','children',(a,b)=>(a.name||'').localeCompare(b.name||'','vi'));
    sub('plans','plans',(a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
    sub('evalProcess','proc',(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));
    sub('evalPeriod','period');
    sub('staff','staff',(a,b)=>(a.classCode||'').localeCompare(b.classCode||'','vi',{numeric:true})||(a.name||'').localeCompare(b.name||'','vi'));
    {let first=true;unsubs.push(db.doc('settings/catalog').onSnapshot(d=>{S.catalog=d.exists?d.data():null;if(first){first=false;done()}else render()},()=>{if(first){first=false;done()}}))}
    sub('departments','depts',(a,b)=>(a.order??99)-(b.order??99)||(a.name||'').localeCompare(b.name||'','vi'));
  });
}
function signIn(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});S.auth.signInWithPopup(p).catch(e=>{console.warn(e);if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast(e.code==='auth/unauthorized-domain'?'Trang web này chưa được thêm vào Firebase':'Chưa đăng nhập được, thử lại')})}
const stamp=()=>({updatedAt:new Date().toISOString(),...(S.meId?{authorId:S.meId}:{})});
async function guard(fn,msg){if(!S.db){toast('Cần đăng nhập để lưu');return}try{await fn();if(msg)toast(msg)}catch(e){console.warn(e);toast(e?.code==='permission-denied'?'Tài khoản của bạn không có quyền làm việc này':'Chưa lưu được, kiểm tra mạng rồi thử lại')}}

/* ---------- render ---------- */
let lastKey='';
function render(){
  const key=S.view+'|'+(S.arg?.id||S.arg?.level||S.arg||'');
  const keep={};let focus=null;
  if(key===lastKey){document.querySelectorAll('#view [id]').forEach(el=>{if('value' in el&&el.type!=='button')keep[el.id]=el.value});focus=document.activeElement?.id}
  lastKey=key;
  renderNav();renderWho();
  $('#banner').innerHTML='';
  const gate=vGate();if(gate){$('#view').innerHTML=gate;return}
  const v={home:vHome,plans:vPlans,edit:vEdit,proc:vProc,period:vPeriod,setup:vSetup,members:vMembers,depts:vDepts,staff:vStaff,classes:vClasses}[S.view]||vHome;
  $('#view').innerHTML=S.ready?v():`<div class="empty">Đang tải dữ liệu của trường…</div>`;
  for(const [id,val] of Object.entries(keep)){const el=document.getElementById(id);if(el&&'value' in el)el.value=val}
  if(focus){const el=document.getElementById(focus);el?.focus?.()}
}
function renderNav(){
  if(!S.db){$('#nav').innerHTML='';return}
  const n=(view,label,cnt,arg)=>`<button class="nav ${S.view===view&&(arg==null||S.arg===arg||S.arg?.level===arg)?'on':''}" data-go="${view}" ${arg?`data-arg="${arg}"`:''}>${label}${cnt!=null?`<em>${cnt}</em>`:''}</button>`;
  const cnt=k=>S.plans.filter(p=>p.level===k&&p.year===S.year).length;
  $('#nav').innerHTML=`<div class="navgroup"><span>Tổng quan</span>${n('home','Trang chủ')}</div>

  <div class="navgroup"><span>Thiết lập</span>${n('setup','Lớp và trẻ',tClasses().length)}${S.role==='bgh'?n('members','Thành viên',S.users.filter(u=>u.status==='cho').length||null):''}</div>
  ${S.role==='bgh'?`<div class="navgroup"><span>Quản trị</span>${n('depts','Phòng ban',S.depts.length)}${n('classes','Danh sách lớp',S.classes.length)}${n('staff','Giáo viên, nhân viên',S.staff.length)}`:''}</div>`;
}
function renderWho(){
    $('#who').innerHTML=`<label class="row small">Năm học <select id="selYear">${YEARS.map(y=>`<option ${y===S.year?'selected':''}>${y}</option>`).join('')}</select></label>
  ${S.fbUser?`<span>${esc(S.fbUser.displayName||S.fbUser.email)} · <b style="color:var(--ink)">${esc(ROLES[S.role]||'')}</b></span><button class="btn sm" data-act="signOut">Đăng xuất</button>`:''}`;
}

function planList(arr){

/* ---------- editor ---------- */
function vEdit(){
  const a=S.arg; const p=a.id?S.plans.find(x=>x.id===a.id):null;

  const parent=pl.parentId?S.plans.find(x=>x.id===pl.parentId):null;
  const chain=[];let cur=parent;while(cur){chain.unshift(cur);cur=cur.parentId?S.plans.find(x=>x.id===cur.parentId):null}
  const kids=p?S.plans.filter(x=>x.parentId===p.id):[];
  const CL=childLevel(L.k);
  const area=(k,label,hint)=>`<label class="f">${esc(label)}${hint?`<span class="h">${esc(hint)}</span>`:''}<textarea id="f_${k}" ${dis}>${esc(d[k])}</textarea></label>`;

    if(k==='DOMAINS')return`<div class="stack"><h3>${esc(label)}</h3>${DOMAINS.map(([dk,dl])=>`<div class="domain">${area('dm_'+dk,dl)}</div>`).join('')}</div>`;
    if(k==='GRID')return`<div class="stack"><h3>${esc(label)}</h3><div class="tablewrap"><table class="wk"><thead><tr><th>Hoạt động</th>${WEEK_COLS.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${WEEK_ROWS.map((r,ri)=>`<tr><td>${r}</td>${WEEK_COLS.map((c,ci)=>`<td><textarea id="g_${ri}_${ci}" ${dis} aria-label="${r} ${c}">${esc(d.grid?.[ri+'_'+ci])}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
    if(k==='LINHVUC')return`<label class="f">${esc(label)}<select id="f_linh_vuc" ${dis}><option value="">Chọn lĩnh vực</option>${DOMAINS.map(([dk,dl])=>`<option value="${dk}" ${d.linh_vuc===dk?'selected':''}>${dl}</option>`).join('')}</select></label>`;
    return area(k,label,hint);
  }).join('');
  const per=L.k==='thang'?`<label class="f">Tháng<input type="month" id="h_period" value="${esc(pl.period||'')}" ${dis}></label>`
    :L.k==='tuan'?`<label class="f">Tuần bắt đầu từ ngày<input type="date" id="h_period" value="${esc(pl.period||'')}" ${dis}></label>`
    :L.k==='ngay'?`<label class="f">Ngày dạy<input type="date" id="h_period" value="${esc(pl.period||today())}" ${dis}></label>`:'';
  const appr=canApprove(pl);
  const c=S.confirm==='del'+(p?.id||'');
  return`<div class="stack">
  <div class="crumbs"><button data-go="plans" data-arg="${L.k}">${L.name}</button>${chain.length?' · Thuộc: '+chain.map(x=>`<button data-open="${x.id}">${esc(x.title)}</button>`).join(' › '):''}</div>
  <div class="row" style="justify-content:space-between"><h2>${p?esc(p.title||L.name):'Tạo '+L.name.toLowerCase()}</h2>${p?pill(p.status):''}</div>
  ${p?.reviewNote?`<div class="banner"><b>Góp ý khi duyệt:</b> ${esc(p.reviewNote)}${p.reviewerId?` <span class="muted">(${esc(nameOf(p.reviewerId))})</span>`:''}</div>`:''}
  ${locked?`<div class="banner">Kế hoạch đã được duyệt nên đang khóa. Ban giám hiệu có thể mở lại để chỉnh sửa.</div>`:''}
  <section class="sheet stack">
    <div class="grid2">
      <label class="f">Tên kế hoạch<span class="h">Để trống để tự đặt tên</span><input type="text" id="h_title" value="${esc(pl.title||'')}" ${dis}></label>
      <label class="f">Năm học<select id="h_year" ${dis}>${YEARS.map(y=>`<option ${y===(pl.year||S.year)?'selected':''}>${y}</option>`).join('')}</select></label>
      ${L.age?`<label class="f">Độ tuổi<select id="h_age" ${dis}>${AGES.map(x=>`<option ${x===pl.ageGroup?'selected':''}>${x}</option>`).join('')}</select></label>`:''}
      ${L.cls?`<label class="f">Lớp<select id="h_cls" ${dis}><option value="">Chọn lớp</option>${tClasses().map(c=>`<option value="${c.id}" ${c.id===pl.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`:''}
      ${per}
      ${L.parent?`<label class="f">Căn cứ ${LV[L.parent].name.toLowerCase()}<select id="h_parent" ${dis}><option value="">Chưa gắn</option>${parents.map(x=>`<option value="${x.id}" ${x.id===pl.parentId?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label>`:''}

      ${p&&p.status==='duyet'&&S.role==='bgh'?`<button class="btn" data-review="nhap">Mở lại để sửa</button>`:''}

  </section>

  </div>`;
}
function readForm(L){
  const v=id=>document.getElementById(id)?.value??'';
  const data={};
  for(const [k] of L.fields){
    if(k==='DOMAINS')DOMAINS.forEach(([dk])=>data['dm_'+dk]=v('f_dm_'+dk));
    else if(k==='GRID'){data.grid={};WEEK_ROWS.forEach((r,ri)=>WEEK_COLS.forEach((c,ci)=>{const x=v(`g_${ri}_${ci}`);if(x)data.grid[ri+'_'+ci]=x}))}
    else if(k==='LINHVUC')data.linh_vuc=v('f_linh_vuc');
    else data[k]=v('f_'+k);
  }
  return{year:v('h_year')||S.year,classId:v('h_cls'),ageGroup:v('h_age'),period:v('h_period'),parentId:v('h_parent'),title:v('h_title').trim(),data};
}
function autoTitle(L,f){
  const cn=f.classId?clsName(f.classId):'';
  switch(L.k){
    case'truong':return`Kế hoạch nhà trường ${f.year}`;
    case'namhoc':return`KHGD năm học ${f.year} – ${f.ageGroup||''}`;
    case'lop':return`KHGD lớp ${cn} ${f.year}`;
    case'thang':return`Kế hoạch tháng ${f.period?+f.period.slice(5):''} – ${cn}${f.data.chu_de?' – '+f.data.chu_de.split('\n')[0]:''}`;
    case'tuan':return`Tuần từ ${fmtD(f.period)} – ${cn}${f.data.chu_de?' – '+f.data.chu_de.split('\n')[0]:''}`;
    case'ngay':return`${(f.data.ten_hd||'Giáo án').split('\n')[0]} – ${cn} – ${fmtD(f.period)}`;
  }
}
async function savePlan(status){
  const a=S.arg;const p=a.id?S.plans.find(x=>x.id===a.id):null;const pl=p||a.draft;const L=LV[pl.level];
  const f=readForm(L);
  if(L.cls&&!f.classId){toast('Hãy chọn lớp');return}
  const doc={level:L.k,...f,title:f.title||autoTitle(L,f),status,...stamp()};
  if(status==='cho')doc.reviewNote='';
  await guard(async()=>{
    if(p){if(p.authorId)doc.authorId=p.authorId;await S.db.doc('plans/'+p.id).update(doc)}
    else{doc.createdAt=doc.updatedAt;const ref=await S.db.collection('plans').add(doc);S.arg={id:ref.id,saving:true};lastKey=''}
  },status==='cho'?'Đã gửi duyệt':'Đã lưu nháp');
  render();
}

    ${notes.length?`<div>${notes.slice(0,80).map(n=>`<div class="note"><div class="row" style="justify-content:space-between"><b>${esc(kname(n.childId))}</b><span class="small muted">${fmtD(n.date)}${n.authorId?' · '+esc(nameOf(n.authorId)):''}</span></div>

      <div style="white-space:pre-wrap">${esc(n.note)}</div>
      <div><button class="btn sm warn" data-delproc="${n.id}">${S.confirm==='p'+n.id?'Bấm lần nữa để xóa':'Xóa'}</button></div></div>`).join('')}</div>`:`<div class="empty">Chưa có nhận xét nào.</div>`}
  </section>`}
  </div>`;
}

/* ---------- periodic evaluation ---------- */
const perId=(cid,ky,kid)=>`${cid}_${S.year}_${ky}_${kid}`;
function vPeriod(){
  const kids=S.children.filter(c=>c.classId===S.evCls);
  const rec=kid=>S.period.find(r=>r.id===perId(S.evCls,S.evKy,kid))||{};
  const sum=DOMAINS.map(([k])=>{const done=kids.map(rec).filter(r=>r[k]);const ok=done.filter(r=>r[k]==='dat').length;return{done:done.length,ok}});
  return`<div class="stack">

const toISO=v=>{if(!v)return'';if(v instanceof Date&&!isNaN(v))return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;const m=String(v).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;const m2=String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:''};
async function readStaffFile(file){
  if(!window.XLSX){toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng');return}
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames.find(n=>n.trim().toUpperCase()==='GV')||wb.SheetNames[0]];
  const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const norm=t=>String(t||'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
  const hi=grid.findIndex(r=>r.some(c=>norm(c)==='email'));
  if(hi<0){toast('Không tìm thấy dòng tiêu đề có cột Email');return}
  const H=grid[hi].map(norm);
  const col=(...names)=>H.findIndex(h=>names.some(n=>h===n||h.includes(n)));
  const c={code:col('mã nhân viên','mã nv'),cls:col('mã lớp'),name:col('tên nhân viên','họ và tên','họ tên'),email:col('email'),dob:col('ngày sinh'),pos:col('chức vụ')};
  const seen=new Set();const rows=[];
  grid.slice(hi+1).forEach((r,i)=>{
    const g=k=>c[k]>=0?r[c[k]]:'';
    const name=String(g('name')).trim(),email=String(g('email')).trim().toLowerCase();
    if(!name&&!email)return;
    const row={line:hi+i+2,code:String(g('code')).trim(),classCode:String(g('cls')).trim().toUpperCase(),name,email,dob:toISO(g('dob')),position:normPosition(g('pos'))};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))Object.assign(row,{kind:'error',err:'Email không hợp lệ'});
    else if(!name)Object.assign(row,{kind:'error',err:'Thiếu họ tên'});
    else if(seen.has(email))Object.assign(row,{kind:'error',err:'Trùng email trong file'});
    else row.kind=S.staff.some(x=>x.id===email)?'update':'new';
    seen.add(email);rows.push(row);
  });
  S.importPreview={file:file.name,rows};lastKey='';render();
}
async function confirmImport(){
  const ok=S.importPreview.rows.filter(r=>r.kind!=='error');
  const newCodes=[...new Set(ok.map(r=>r.classCode).filter(Boolean))].filter(v=>!classCodes().includes(v));
  const newPos=[...new Set(ok.map(r=>r.position).filter(Boolean))].filter(v=>!positions().includes(v));
  await guard(async()=>{
    for(let i=0;i<ok.length;i+=400){const b=S.db.batch();for(const r of ok.slice(i,i+400)){const ex=S.staff.find(x=>x.id===r.email);b.set(S.db.doc('staff/'+r.email),{code:r.code,classCode:r.classCode,name:r.name,email:r.email,dob:r.dob,position:r.position,status:ex?.status||'active',deptId:ex?.deptId||'',updatedAt:new Date().toISOString()},{merge:true})}await b.commit()}
    if(newCodes.length||newPos.length||!S.catalog)await S.db.doc('settings/catalog').set({classCodes:[...classCodes(),...newCodes],positions:[...positions(),...newPos]},{merge:true});
  },`Đã nhập ${ok.length} người`);
  S.importPreview=null;lastKey='';render();
}
async function saveStaff(){
  const v=id=>document.getElementById(id).value.trim();
  const email=v('sEmail').toLowerCase(),name=v('sName');
  if(!name){toast('Nhập họ tên');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Email chưa đúng');return}

function normBlock(v){const t=String(v||'').normalize('NFC').trim().toLowerCase();return BLOCKS.find(b=>b.toLowerCase()===t)||''}
const blockAge=b=>b==='Nhà trẻ'?AGES[0]:'';
async function readClassFile(file){
  if(!window.XLSX){toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng');return}
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sn=wb.SheetNames.find(n=>n.trim().toUpperCase()==='DSLOP')||wb.SheetNames.find(n=>n.trim().toUpperCase()!=='GV')||wb.SheetNames[0];
  const grid=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
  const norm=t=>String(t||'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
  const hi=grid.findIndex(r=>r.some(c=>norm(c)==='mã lớp'));
  if(hi<0){toast('Không tìm thấy dòng tiêu đề có cột Mã lớp');return}
  const H=grid[hi].map(norm);const ix=n=>H.indexOf(n);
  const c={code:ix('mã lớp'),name:ix('tên lớp'),block:ix('khối')};
  const seen=new Set();const rows=[];
  grid.slice(hi+1).forEach((r,i)=>{
    const code=String(r[c.code]||'').trim().toUpperCase(),name=String(c.name>=0?r[c.name]:'').trim(),rawB=c.block>=0?r[c.block]:'';
    if(!code&&!name)return;
    const row={line:hi+i+2,code,name,block:normBlock(rawB)||String(rawB).trim()};
    if(!code)Object.assign(row,{kind:'error',err:'Thiếu mã lớp'});
    else if(!/^[A-Za-z0-9_\-]+$/.test(code))Object.assign(row,{kind:'error',err:'Mã lớp chỉ dùng chữ, số'});
    else if(!name)Object.assign(row,{kind:'error',err:'Thiếu tên lớp'});
    else if(!normBlock(rawB))Object.assign(row,{kind:'error',err:'Khối phải là Văn phòng, Nhà trẻ hoặc Mẫu giáo'});
    else if(seen.has(code))Object.assign(row,{kind:'error',err:'Trùng mã lớp trong file'});
    else row.kind=S.classes.some(x=>x.id===code)?'update':'new';
    seen.add(code);rows.push(row);
  });
  S.clsImport={file:file.name,rows};lastKey='';render();
}
async function confirmClsImport(){
  const ok=S.clsImport.rows.filter(r=>r.kind!=='error');
  await guard(async()=>{const b=S.db.batch();ok.forEach((r,i)=>{const ex=S.classes.find(x=>x.id===r.code);b.set(S.db.doc('classes/'+r.code),{code:r.code,name:r.name,block:r.block,ageGroup:ex?.ageGroup||blockAge(r.block),order:ex?.order??(i+1),updatedAt:new Date().toISOString()},{merge:true})});await b.commit()},`Đã nhập ${ok.length} lớp`);
  S.clsImport=null;lastKey='';render();
}

async function exportPlan(id){
  const p=S.plans.find(x=>x.id===id);if(!p)return;const L=LV[p.level];const d=p.data||{};
  const para=t=>esc(t||'').replace(/\n/g,'<br>');
  let body=`<h1 style="text-align:center">${esc(p.title)}</h1><p><b>Năm học:</b> ${esc(p.year)}${p.classId?` &nbsp; <b>Lớp:</b> ${esc(clsName(p.classId))}`:''}${p.ageGroup?` &nbsp; <b>Độ tuổi:</b> ${esc(p.ageGroup)}`:''}</p>`;
  for(const [k,label] of L.fields){
    if(k==='DOMAINS')body+=`<h2>${esc(label)}</h2>`+DOMAINS.map(([dk,dl])=>`<h3>${dl}</h3><p>${para(d['dm_'+dk])}</p>`).join('');
    else if(k==='GRID')body+=`<h2>${esc(label)}</h2><table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%"><tr><th>Hoạt động</th>${WEEK_COLS.map(c=>`<th>${c}</th>`).join('')}</tr>${WEEK_ROWS.map((r,ri)=>`<tr><td><b>${r}</b></td>${WEEK_COLS.map((c,ci)=>`<td>${para(d.grid?.[ri+'_'+ci])}</td>`).join('')}</tr>`).join('')}</table>`;
    else if(k==='LINHVUC')body+=`<p><b>${esc(label)}:</b> ${esc(Object.fromEntries(DOMAINS)[d.linh_vuc]||'')}</p>`;
    else body+=`<h2>${esc(label)}</h2><p>${para(d[k])}</p>`;
  }
  const html=`<html><head><meta charset="utf-8"><style>body{font-family:"Times New Roman";font-size:13pt}h1{font-size:16pt}h2{font-size:14pt}h3{font-size:13pt}</style></head><body>${body}</body></html>`;

  const name=(p.title||'ke-hoach').replace(/[\\/:*?"<>|]/g,'-').slice(0,80);
  const url=URL.createObjectURL(new Blob(['\ufeff'+html],{type:'application/msword'}));const link=document.createElement('a');link.href=url;link.download=name+'.doc';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function go(view,arg){S.view=view;S.arg=arg??null;S.confirm=null;render();window.scrollTo(0,0)}
function armConfirm(key){if(S.confirm===key){S.confirm=null;return true}S.confirm=key;render();setTimeout(()=>{if(S.confirm===key){S.confirm=null;render()}},4000);return false}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if(ds.go){const lv=ds.arg;if(ds.go==='plans')S.flt={cls:'',st:''};go(ds.go,lv||null);return}
  if(ds.open){go('edit',{id:ds.open});return}
  if(ds.new){go('edit',{level:ds.new,draft:{level:ds.new,year:S.year,status:'nhap',data:{}}});return}
  if(ds.child){const p=S.plans.find(x=>x.id===ds.child);const CL=childLevel(p.level);go('edit',{level:CL.k,draft:{level:CL.k,year:p.year,classId:p.classId||'',parentId:p.id,status:'nhap',data:{}}});return}
  if(ds.save){savePlan(ds.save);return}
  if(ds.review){const p=S.plans.find(x=>x.id===S.arg.id);const note=$('#h_review')?.value||'';
    await guard(()=>S.db.doc('plans/'+p.id).update({status:ds.review,reviewNote:ds.review==='nhap'?'':note,reviewerId:S.meId||'',reviewedAt:new Date().toISOString()}),{duyet:'Đã duyệt',sua:'Đã gửi yêu cầu sửa',nhap:'Đã mở lại'}[ds.review]);return}
  if(ds.export){exportPlan(ds.export);return}
  if(ds.del){if(!armConfirm('del'+ds.del))return;const L=S.plans.find(x=>x.id===ds.del)?.level;await guard(()=>S.db.doc('plans/'+ds.del).delete(),'Đã xóa');go('plans',L);return}
  if(ds.dom){const i=S.procDomains.indexOf(ds.dom);i<0?S.procDomains.push(ds.dom):S.procDomains.splice(i,1);b.classList.toggle('on');return}
  if(ds.tog){const [k,d]=ds.tog.split('|');toggleEval(k,d);return}
  if(ds.delproc){if(!armConfirm('p'+ds.delproc))return;await guard(()=>S.db.doc('evalProcess/'+ds.delproc).delete(),'Đã xóa');return}
  if(ds.delcls){if(!armConfirm('c'+ds.delcls))return;await guard(()=>S.db.doc('classes/'+ds.delcls).delete(),'Đã xóa lớp');return}
  if(ds.delkid){if(!armConfirm('k'+ds.delkid))return;await guard(()=>S.db.doc('children/'+ds.delkid).delete(),'Đã xóa');return}
  if(ds.act==='signIn'){signIn();return}
  if(ds.act==='signOut'){S.auth.signOut();go('home');return}
  if(ds.act==='newCls'){S.clsEdit='new';lastKey='';render();document.getElementById('clsForm')?.scrollIntoView({block:'start'});return}
  if(ds.editcls){S.clsEdit=ds.editcls;lastKey='';render();document.getElementById('clsForm')?.scrollIntoView({block:'start'});return}
  if(ds.act==='cancelCls'){S.clsEdit=null;lastKey='';render();return}
  if(ds.act==='saveCls'){saveCls();return}
  if(ds.act==='confirmClsImport'){confirmClsImport();return}
  if(ds.act==='cancelClsImport'){S.clsImport=null;lastKey='';render();return}
  if(ds.act==='newStaff'){S.staffEdit='new';lastKey='';render();document.getElementById('staffForm')?.scrollIntoView({block:'start'});return}
  if(ds.editstaff){S.staffEdit=ds.editstaff;lastKey='';render();document.getElementById('staffForm')?.scrollIntoView({block:'start'});return}
  if(ds.act==='cancelStaff'){S.staffEdit=null;lastKey='';render();return}
  if(ds.act==='saveStaff'){saveStaff();return}
  if(ds.lockstaff){const x=S.staff.find(y=>y.id===ds.lockstaff);const ns=x.status==='khoa'?'active':'khoa';if(ADMIN_EMAILS.includes(x.id)&&ns==='khoa'){toast('Không khóa tài khoản quản trị');return}await guard(()=>S.db.doc('staff/'+x.id).update({status:ns}),ns==='khoa'?'Đã khóa':'Đã mở khóa');return}
  if(ds.delstaff){if(!armConfirm('s'+ds.delstaff))return;await guard(()=>S.db.doc('staff/'+ds.delstaff).delete(),'Đã xóa khỏi danh sách');return}
  if(ds.act==='confirmImport'){confirmImport();return}
  if(ds.act==='cancelImport'){S.importPreview=null;lastKey='';render();return}
  if(ds.catadd){const k=ds.catadd;const val=(document.getElementById('cat_'+k).value||'').trim();if(!val)return;const list=k==='positions'?positions():classCodes();if(list.includes(val)){toast('Đã có trong danh mục');return}await guard(()=>S.db.doc('settings/catalog').set({classCodes:classCodes(),positions:positions(),[k]:[...list,val]},{merge:true}),'Đã thêm');return}
  if(ds.catdel){const [k,val]=ds.catdel.split('|');const list=(k==='positions'?positions():classCodes()).filter(x=>x!==val);await guard(()=>S.db.doc('settings/catalog').set({classCodes:classCodes(),positions:positions(),[k]:list},{merge:true}),'Đã bỏ');return}
  if(ds.act==='saveDept'){const name=$('#dName').value.trim();if(!name){toast('Nhập tên phòng ban');return}
    const o=parseInt($('#dOrder').value,10);
    const doc={name,type:$('#dType').value,headId:$('#dHead').value,deputyId:$('#dDeputy').value,desc:$('#dDesc').value.trim(),order:isNaN(o)?99:o,updatedAt:new Date().toISOString()};
    const id=S.deptEdit;await guard(()=>id?S.db.doc('departments/'+id).update(doc):S.db.collection('departments').add({...doc,createdAt:doc.updatedAt}),id?'Đã lưu':'Đã thêm phòng ban');
    S.deptEdit=null;lastKey='';render();return}
  if(ds.act==='cancelDept'){S.deptEdit=null;lastKey='';render();return}
  if(ds.editdept){S.deptEdit=ds.editdept;lastKey='';render();window.scrollTo(0,0);return}
  if(ds.deldept){if(!armConfirm('d'+ds.deldept))return;await guard(()=>S.db.doc('departments/'+ds.deldept).delete(),'Đã xóa phòng ban');return}
  if(ds.act==='seedDepts'){await guard(async()=>{let i=1;for(const [name,type,desc] of DEPT_SAMPLE)await S.db.collection('departments').add({name,type,desc,headId:'',deputyId:'',order:i++,createdAt:new Date().toISOString()})},'Đã tạo danh sách gợi ý');return}
  if(ds.ustat){const [id,st]=ds.ustat.split('|');await guard(()=>S.db.doc('users/'+id).update({status:st}),st==='active'?'Đã duyệt':'Đã khóa');return}
  if(ds.act==='addKids'){const lines=$('#kList').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length){toast('Nhập ít nhất một tên');return}
    await guard(async()=>{for(const ln of lines){const [name,dob,gender]=ln.split(/\t|,|;/).map(s=>(s||'').trim());await S.db.collection('children').add({name,dob:dob||'',gender:gender||'',classId:S.evCls,...stamp()})}},`Đã thêm ${lines.length} trẻ`);$('#kList').value='';return}
  if(ds.act==='addProc'){const childId=$('#pChild').value,note=$('#pNote').value.trim();if(!childId||!note){toast('Chọn trẻ và ghi nhận xét');return}
    await guard(()=>S.db.collection('evalProcess').add({classId:S.evCls,childId,date:$('#pDate').value||today(),level:$('#pLevel').value,domains:[...S.procDomains],note,createdAt:new Date().toISOString(),...stamp()}),'Đã lưu nhận xét');
    $('#pNote').value='';S.procDomains=[];render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='sfQ'){S.staffFlt={...(S.staffFlt||{cc:'',pos:'',st:''}),q:e.target.value};render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches?.('label[for]'))document.getElementById(e.target.getAttribute('for'))?.click()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='selYear'){S.year=t.value;savePrefs();render()}
  else if(t.id==='clsFile'){const f=t.files[0];t.value='';if(f)readClassFile(f).catch(e=>{console.warn(e);toast('Không đọc được file này')})}
  else if(t.id==='clsFlt'){S.clsFlt=t.value;render()}
  else if(t.id==='xlsFile'){const f=t.files[0];t.value='';if(f)readStaffFile(f).catch(e=>{console.warn(e);toast('Không đọc được file này')})}
  else if(['sfCC','sfPos','sfSt'].includes(t.id)){S.staffFlt={...(S.staffFlt||{q:''}),cc:$('#sfCC').value,pos:$('#sfPos').value,st:$('#sfSt').value};render()}
  else if(t.dataset.urole){guard(()=>S.db.doc('users/'+t.dataset.urole).update({role:t.value}),'Đã đổi vai trò')}
  else if(t.id==='fltCls'){S.flt.cls=t.value;render()}
  else if(t.id==='fltSt'){S.flt.st=t.value;render()}
  else if(['evClsP','evClsD','evClsS'].includes(t.id)){S.evCls=t.value;S.procChild='';savePrefs();lastKey='';render()}
  else if(t.id==='evKy'){S.evKy=t.value;lastKey='';render()}
  else if(t.id==='pFilter'){S.procChild=t.value;render()}
  else if(t.dataset.pnote){saveEvalNote(t.dataset.pnote,t.value.trim())}
  else if(t.id==='h_cls'&&S.view==='edit'){/* refresh parent choices for the class */
    const a=S.arg;if(!a.id){const f=readForm(LV[a.draft.level]);Object.assign(a.draft,f)}else{}render()}
});
boot();
</script>
</body>
</html>
