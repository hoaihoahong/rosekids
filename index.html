<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hệ sinh thái RoseKids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Dancing+Script:wght@700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: a garden-notebook app. Left rail of modules (top tabs on phones), working sheet on the right. */
:root{
  --bg:#fbf7f6; --sheet:#ffffff; --ink:#2b1f22; --muted:#76656a; --line:#ecdfe0;
  --rose:#b23a5b; --rose-soft:#f8e3e9; --leaf:#3f7a52; --leaf-soft:#e3f1e6;
  --sun:#a86a12; --sun-soft:#fbefd9; --sky:#2f6a8f; --sky-soft:#e1eef6;
  --display:"Lora",Georgia,"Times New Roman",serif;
  --body:"RK So","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1517; --sheet:#251c1f; --ink:#f3e9eb; --muted:#b7a3a8; --line:#3a2d31;
  --rose:#ec7d9a; --rose-soft:#43232d; --leaf:#80c595; --leaf-soft:#20352a;
  --sun:#e3b066; --sun-soft:#3d2e17; --sky:#82bde0; --sky-soft:#1b2f3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1517; --sheet:#251c1f; --ink:#f3e9eb; --muted:#b7a3a8; --line:#3a2d31;
  --rose:#ec7d9a; --rose-soft:#43232d; --leaf:#80c595; --leaf-soft:#20352a;
  --sun:#e3b066; --sun-soft:#3d2e17; --sky:#82bde0; --sky-soft:#1b2f3c; color-scheme:dark}
*{box-sizing:border-box}
/* Chữ số lấy từ phông hệ thống có số rộng đều (Be Vietnam Pro của Google Fonts không có số rộng đều), để ngày tháng thẳng cột. */
@font-face{font-family:"RK So";font-weight:100 500;src:local("Segoe UI"),local("SegoeUI"),local("Arial"),local("ArialMT"),local("Roboto"),local("Helvetica");size-adjust:106%;unicode-range:U+0030-0039}
@font-face{font-family:"RK So";font-weight:600 900;src:local("Segoe UI Semibold"),local("SegoeUI-Semibold"),local("Arial Bold"),local("Arial-BoldMT"),local("Roboto Bold"),local("Roboto-Bold"),local("Helvetica Bold");size-adjust:106%;unicode-range:U+0030-0039}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.5rem} h3{font-size:1.1rem}
.app{display:grid;grid-template-columns:400px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--sheet)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.4rem;display:block;color:var(--rose)}
.brand small{color:var(--muted);font-size:.85rem;font-weight:500}
.navs{display:flex;flex-direction:column;gap:16px}
.navgroup{display:flex;flex-direction:column;gap:3px}
.navgroup>span{display:flex;align-items:center;gap:8px;font-size:10.5pt;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--rose);padding:4px 10px 7px;margin-bottom:3px;border-bottom:2px solid var(--rose-soft)}
.navgroup>span::before{content:"";width:5px;height:15px;border-radius:3px;background:var(--rose);flex:none}
.nav{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;font-size:12.5pt;font-weight:600;color:var(--ink);border-left:3px solid transparent}
.nav:hover{background:var(--rose-soft);border-left-color:var(--rose)}
.nav:focus-visible{outline:2px solid var(--rose)}
.nav.on{background:var(--rose);color:#fff;border-left-color:var(--rose);box-shadow:0 2px 8px rgba(178,58,91,.28)}
.nav em{font-style:normal;font-size:10pt;font-weight:700;font-variant-numeric:tabular-nums;background:var(--rose-soft);color:var(--rose);border-radius:999px;padding:1px 9px;min-width:12px;text-align:center}
.nav.on em{background:rgba(255,255,255,.25);color:#fff}
.main{padding-block:22px 60px;padding-inline:clamp(16px,3vw,40px);min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:22px}
.who{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,var(--rose-soft),var(--sky-soft));border:1px solid var(--line)}
.who:empty{display:none}
.who-me{display:flex;flex-direction:column;line-height:1.3}
.who-me b{color:var(--rose);font-size:1.05rem}
.who-me span{color:var(--sky);font-weight:600;font-size:.9rem}
.who-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.who-yr{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--leaf);font-size:.9rem}
.who-yr select{font-weight:700;color:var(--leaf);border:2px solid var(--leaf);padding:4px 8px}
.btn.who-out{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;padding:6px 14px}
.btn.who-out:hover{background:#9c2f4e;border-color:#9c2f4e}
select,input[type=text],input[type=date],input[type=month],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.5}
select:focus,input:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:-1px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 14px;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--rose)}
.btn:focus-visible{outline:2px solid var(--rose)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.warn{color:var(--rose)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* Bộ màu nút chuẩn của cả hệ thống: app tự tô theo chức năng ghi trên nút (xem btnTint). */
:root{--b-save:#2e7d4f;--b-ai:#6a45b0;--b-out:#1f6aa5;--b-edit:#a8620a;--b-undo:#6b6266;--b-del:#c0392b}
.btn.b-save,.btn.b-ai,.btn.b-out,.btn.b-edit,.btn.b-undo,.btn.b-del{color:#fff;font-weight:600}
.btn.b-save{background:var(--b-save);border-color:var(--b-save)}
.btn.b-ai{background:var(--b-ai);border-color:var(--b-ai)}
.btn.b-out{background:var(--b-out);border-color:var(--b-out)}
.btn.b-edit{background:var(--b-edit);border-color:var(--b-edit)}
.btn.b-undo{background:var(--b-undo);border-color:var(--b-undo)}
.btn.b-del{background:var(--b-del);border-color:var(--b-del)}
.btn.b-save:hover,.btn.b-ai:hover,.btn.b-out:hover,.btn.b-edit:hover,.btn.b-undo:hover,.btn.b-del:hover{filter:brightness(1.12);border-color:transparent}
dialog.ask{border:1px solid var(--line);border-radius:14px;width:420px;box-sizing:border-box;background:var(--sheet);color:var(--ink);padding:20px 22px;max-width:min(420px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.18)}
dialog.ask::backdrop{background:rgba(0,0,0,.35)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-nhap{background:var(--line);color:var(--muted)}
.st-cho{background:var(--sun-soft);color:var(--sun)}
.st-duyet{background:var(--leaf-soft);color:var(--leaf)}
.st-sua{background:var(--rose-soft);color:var(--rose)}
.banner{border-radius:10px;padding:12px 16px;background:var(--sun-soft);color:var(--ink);font-size:.9rem;margin-bottom:16px}
/* hierarchy stem */
.stem{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.stem button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 4px;position:relative}
.stem button:focus-visible{outline:2px solid var(--rose);border-radius:8px}
.stem .bud{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);font-family:var(--display);font-weight:700;font-size:1.1rem;z-index:1;border:2px solid var(--sheet)}
.stem button:hover .bud{background:var(--rose);color:#fff}
.stem .lbl{font-size:.8rem;line-height:1.3}
.stem::before{content:"";position:absolute;left:8%;right:8%;top:29px;height:2px;background:var(--leaf);opacity:.5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.stat b{font-family:var(--display);font-size:1.6rem;display:block;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.item{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:hover{background:var(--rose-soft)}
.item:focus-visible{outline:2px solid var(--rose)}
.item .t{font-weight:600}
.item .m{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.86rem;font-weight:500;min-width:0}
label.f>span.h{font-weight:400;color:var(--muted);font-size:.78rem}
.domain{border-left:3px solid var(--leaf);padding-left:12px}
.ktgrid th,.ktgrid td{border-right:2px solid #8a6b74;border-bottom:1px solid #b9a3aa}
.ktgrid thead th{font-size:1rem}
.ktgrid tbody th{font-size:.98rem}
.mtc{border-bottom:1px dotted currentColor;cursor:help}
#tipbox{position:fixed;z-index:9999;max-width:420px;background:#fff59d;color:#000;border:1px solid #c9b400;border-radius:8px;padding:8px 10px;font-size:.9rem;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.rs-t tr.rs-g td{background:var(--leaf-soft)}
.rs-box{display:inline-block;width:22px;height:22px;padding:0;border:1.5px solid var(--muted);border-radius:5px;vertical-align:middle;background:transparent;position:relative}
button.rs-box{cursor:pointer}button.rs-box:hover{border-color:var(--ink)}
.rs-box.on{border-color:transparent}.rs-box.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;line-height:1}
.rs-box.rs-l0.on{background:#3f9a5c}.rs-box.rs-l1.on{background:#d08a1e}.rs-box.rs-l2.on{background:#d6336c}
.rs-wrap{max-height:calc(100vh - 160px);overflow:auto}
.rs-tot{font-weight:700;color:var(--rose);margin-top:4px;line-height:1.3}
.rs-q{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rs-opts{display:flex;gap:6px;flex-wrap:wrap}
.rs-opt{border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.rs-opt:hover{border-color:var(--muted)}
.rs-opt.on{color:#fff;border-color:transparent}.rs-opt.rs-l0.on{background:#3f9a5c}.rs-opt.rs-l1.on{background:#d08a1e}.rs-opt.rs-l2.on{background:#d6336c}
.rs-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.rs-bar i{display:block;height:100%;background:var(--leaf)}
.rs-wrap thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
.rs-wrap tfoot td{position:sticky;bottom:0;background:var(--sheet);box-shadow:0 -1px 0 var(--line)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--rose-soft);font-weight:600;font-size:.8rem}
td textarea{min-height:70px;border:none;padding:4px;background:transparent}
/* Mọi trang: chữ cỡ 13pt cho dễ đọc (tiêu đề to hơn) */
.kt-page,.kt-page *{font-size:13pt!important}
.kt-page .phead,.kt-page .phead *{font-size:15pt!important}
.kt-page h2{font-size:19pt!important}.kt-page h3.kt-title,.kt-page h3.kt-title *{font-size:18pt!important}.kt-page h3.kt-title .pill{font-size:11pt!important}.kt-page .stat b{font-size:22pt!important}.kt-page .stem .bud{font-size:15pt!important}.kt-page .tog.mini{font-size:18pt!important}.kt-page .tog.mini.cg{font-size:14pt!important}.kt-page h3,.kt-page h3 *{font-size:15pt!important}
.gaed input[type=text],.gaed textarea{font-family:inherit;font-size:.95rem;font-weight:400;line-height:1.5}
.wk{min-width:760px}
.wk td:first-child{font-weight:600;width:130px;background:var(--bg)}
.ev td.c{text-align:center;width:88px}
.tog{all:unset;cursor:pointer;display:inline-block;min-width:68px;padding:3px 6px;border-radius:6px;font-size:.78rem;font-weight:600;background:var(--line);color:var(--muted)}
.tog.dat{background:var(--ev-ok,#3aa76d);color:var(--ev-ok-ink,#fff)}
.tog.chua{background:var(--ev-no,#e0337a);color:var(--ev-no-ink,#fff)}
.tog.cg{background:var(--ev-cg,#ffc933);color:var(--ev-cg-ink,#2b1d00)}
.tog:focus-visible{outline:2px solid var(--rose)}
.tog.mini{min-width:34px;padding:6px 8px;text-align:center;font-size:1.3rem;line-height:1;font-weight:800;border-radius:8px}
.tog.mini.dat{background:var(--ev-ok,#3aa76d);color:var(--ev-ok-ink,#fff)}
.tog.mini.chua{background:var(--ev-no,#e0337a);color:var(--ev-no-ink,#fff)}
.tog.mini.cg{background:var(--ev-cg,#ffc933);color:var(--ev-cg-ink,#2b1d00);font-size:1rem}
.evmt.big .tog.mini.cg{font-size:1.1rem}
.evmt.big .tog.mini{min-width:42px;padding:8px 10px;font-size:1.5rem}
.evmt thead th{background:#ffe27a;color:#3a2a00}
/* cố định 2 dòng tiêu đề (Lĩnh vực, Mã MT) khi cuộn danh sách trẻ */
.evwrap{max-height:calc(100vh - 90px);overflow:auto}
.evmt thead tr:first-child th{position:sticky;top:0;z-index:3;height:34px;white-space:nowrap}
.evmt thead tr:nth-child(2) th{position:sticky;top:34px;z-index:3}
.evmt td.evname{font-size:1rem;font-weight:500}
.evmt td.c,.evmt th.c{width:auto;text-align:center;padding:4px 3px}
.evmt td:nth-child(2){position:sticky;left:0;background:var(--sheet);z-index:1;min-width:160px}
.evmt td:first-child,.evmt th:first-child{width:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.8rem}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chip:focus-visible{outline:2px solid var(--rose)}
.note{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.88rem;z-index:9}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem}
.crumbs button{all:unset;cursor:pointer;color:var(--rose);text-decoration:underline;text-underline-offset:3px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:14px 16px;gap:10px}
  .navs{display:flex;flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:4px}
  .navgroup{flex-direction:row;gap:6px}
  .navgroup>span{display:none}
  .nav{white-space:nowrap;border:1px solid var(--line)}
  .stem{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
  .stem::before{display:none}
}
/* Trang chủ: nền là vòng tròn chương trình GDMN, dòng chữ uốn lượn ở trên */
:root{--grape:#7a3fa8;--grape-soft:#efe4f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grape:#c49be6;--grape-soft:#33243f}}
:root[data-theme="dark"]{--grape:#c49be6;--grape-soft:#33243f}
.home{gap:22px}
.hm-hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);align-items:center;
  background:radial-gradient(circle at 76% 58%,#fff 0,#fff 36%,rgba(255,255,255,0) 60%),linear-gradient(120deg,#fff6f8 0%,#fdf3e7 55%,#f3ecfb 100%);box-shadow:0 10px 30px rgba(122,63,168,.10)}
.hm-hero::after{display:none;content:"";position:absolute;right:0;top:118px;bottom:8px;width:54%;background:var(--wheel) center/contain no-repeat;mix-blend-mode:multiply;pointer-events:none}
.hm-title{position:absolute;left:0;right:0;top:16px;height:130px;z-index:2;pointer-events:none}
.hm-title svg{width:100%;height:100%;overflow:visible}
.hm-title text,.hm-title textPath{font-family:"Dancing Script","Lora",cursive;font-weight:700;font-size:62px!important;letter-spacing:.3px;fill:url(#hmGrad);paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;filter:drop-shadow(0 3px 4px rgba(122,63,168,.25))}
.hm-hi{position:relative;z-index:1;max-width:760px;padding:150px 10px 30px clamp(20px,4vw,44px);display:flex;flex-direction:column;gap:12px}
.hm-day{font-size:.85rem!important;font-weight:600;color:var(--grape);text-transform:uppercase;letter-spacing:.06em}
.kt-page .hm-hi h2{font-size:26pt!important;color:#2b1f22}
.hm-hi p{margin:0;color:#76656a;font-style:italic}
.hm-topics{display:flex;flex-direction:column;gap:8px}
.hm-topic{background:rgba(255,255,255,.85);border:1px solid #f0dbe2;border-left:5px solid var(--rose);border-radius:12px;padding:9px 14px;display:flex;flex-direction:column;color:#2b1f22}
.hm-topic small{color:#76656a;font-size:.8rem!important}
.hm-topic span{color:#3f7a52;font-weight:500}
.btn.hm-ghost{background:rgba(255,255,255,.8);color:#2b1f22}
.db-home{display:flex;flex-direction:column;gap:8px;margin-top:-10px;margin-bottom:-50px}
.db-leg-all{gap:2px 14px;margin-top:-6px}
.kt-page .db-leg-all span{font-size:9pt!important}
.db-top{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.db-banner{margin:0;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(178,58,91,.14);line-height:0;align-self:start}
.db-banner img{width:100%;height:auto;display:block}
.db-today{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;line-height:1.2;padding:9px 20px;border-radius:999px;background:var(--rose);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(178,58,91,.35)}
.db-today:hover{background:#9c2f4e}.db-today:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.db-today svg{width:20px;height:20px}
.db-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.kt-page .db-head h2{font-size:16pt!important}
.db-grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.db-card{display:flex;flex-direction:column;gap:4px;padding:10px 14px}
.kt-page .db-card h3{font-size:12.5pt!important}
.db-ht{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.db-rows{display:flex;flex-direction:column}

const lazyData={},lazyOn={};let lazyMiss=null,lazyQuiet=false;
const lazyCol=key=>LAZY[key][0];

function lazyLoad(col){
  if(!S.db||lazyOn[col])return;
  lazyOn[col]='wait';const keys=Object.keys(LAZY).filter(k=>LAZY[k][0]===col);const db=S.db;
  unsubs.push(db.collection(col).onSnapshot(snap=>{
    if(S.db!==db)return;

    if(col==='weekPlans'){lazyData.ktRuns=Object.fromEntries(docs.map(d=>[d.id,d.aiRuns||0]));docs=docs.filter(d=>d.plan)}

  },err=>{console.warn(col,err);lazyOn[col]='ok';render()}));

      // Ghi lần đăng nhập gần nhất: chỉ khi người dùng vừa bấm Đăng nhập (mở lại trang thì không ghi).

    }catch(e){console.warn(e);S.me={status:'loi'}}

    unsubs.push(meRef.onSnapshot(d=>{if(!d.exists)return;lastMe=d.data();recheck()}));
    unsubs.push(staffRef.onSnapshot(d=>{S.myStaff=d.exists?d.data():null;recheck()},()=>{}));
    if(S.me.status!=='active'){S.ready=true;render();return}
    S.db=db;
    let pending=5;const done=()=>{if(--pending<=0){S.ready=true}render()};
    const sub=(col,key,sort)=>{let first=true;unsubs.push(db.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));if(sort)S[key].sort(sort);if(key==='users'||key==='staff')buildNames();if(first){first=false;done()}else render()},err=>{console.warn(col,err);if(first){first=false;done()}}))};
    sub('users','users',(a,b)=>(a.name||'').localeCompare(b.name||'','vi'));
    sub('classes','classes',(a,b)=>(a.order??999)-(b.order??999)||(a.name||'').localeCompare(b.name||'','vi',{numeric:true}));
    sub('staff','staff',(a,b)=>(a.classCode||'').localeCompare(b.classCode||'','vi',{numeric:true})||(a.name||'').localeCompare(b.name||'','vi'));
    {let first=true;unsubs.push(db.doc('settings/catalog').onSnapshot(d=>{S.catalog=d.exists?d.data():null;if(first){first=false;done()}else render()},()=>{if(first){first=false;done()}}))}
    // Bảng tham số hệ thống (settings/params), ví dụ aiKhTuanMax: số lần AI soạn tối đa cho mỗi kế hoạch tuần (0 hoặc trống: không giới hạn).
    unsubs.push(db.doc('settings/params').onSnapshot(d=>{S.params=d.exists?d.data():{};prmApply();render()},()=>{}));

    {const got={};S.rsnl=null;for(const x of RSNL)unsubs.push(db.doc('settings/rsnl_'+x.k).onSnapshot(d=>{got[x.k]=d.exists?d.data():null;if(RSNL.every(y=>y.k in got))S.rsnl={...got};render()},()=>{got[x.k]=null;if(RSNL.every(y=>y.k in got))S.rsnl={...got};render()}))}
    {let first=true;unsubs.push(db.doc('settings/ai').onSnapshot(d=>{S.aiCfg=d.exists?d.data():null;if(first){first=false;done()}else render()},()=>{if(first){first=false;done()}}))}
  });
}

    const codes=new Set(cls.map(c=>c.code||c.id));
    // Hoạt động lấy nguyên văn từ kế hoạch tuần của lớp đúng ngày AI chọn; AI chỉ chọn lớp, ngày, loại hoạt động.
    const rows=(out.plan?.rows||[]).map(x=>{const cl=codes.has(x.cls)?x.cls:(cls.find(c=>c.name===x.cls)?.code||x.cls||'');const date=dkDate(x.date);
      const a=days[cl]?.find(d=>d.date===date)?.acts.find(a=>a.k===x.kind);return{cls:cl,date,act:a?`${a.label}: ${a.text}`:String(x.activity||'').trim()}}).filter(x=>x.act);
    rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.cls).localeCompare(String(b.cls)));
    const bad=rows.filter(r=>!days[r.cls]?.some(d=>d.date===r.date)).length;
    const miss=req.noKt.length?`Lớp chưa có kế hoạch tuần trong chủ đề nên chưa lập: ${req.noKt.join(', ')}.`:'';
    st.draft={id:docId,rows,note:[out.plan?.note||'',bad?`Có ${bad} dòng không trùng ngày nào trong kế hoạch tuần của lớp, cô xem lại các dòng ghi chữ đỏ.`:'',miss].filter(Boolean).join(' '),ai:{model:out.model||'',at:new Date().toISOString()}};
    aiLog(req,out);toast('AI đã lập xong bản nháp, cô xem và sửa rồi bấm Ghi'+aiCost(out));
  }catch(e){console.warn(e);st.err='Không kết nối được máy chủ AI ('+(e.message||e)+'). Cô kiểm tra mạng rồi thử lại.';toast('Chưa kết nối được máy chủ AI')}
  finally{st.busy=false;lastKey='';render()}
}
async function dkSave(){

  const rows=d.rows.map(r=>({cls:r.cls||'',date:r.date||'',act:(r.act||'').trim()})).filter(r=>r.cls||r.date||r.act);

/* ---------- Rà soát năng lực thực hiện chương trình GDMN mới ----------
   Bảng kiểm PL1 (cán bộ quản lý) và PL2 (giáo viên tự đánh giá), lưu ở settings/rsnl_pl1, settings/rsnl_pl2:
   {title, levels:[3 mức], groups:[{id,name,items:[{id,text}]}]}. STT tự đánh theo vị trí (Nhóm 1 → 1.1, 1.2…).
   Ban giám hiệu nạp từ Excel và sửa từng tiêu chí; mọi người xem. Mỗi nhóm, tiêu chí có id cố định để phiếu rà soát sau này ghi theo id. */
const RSNL=[{k:'pl1',name:'PL1 – Cán bộ quản lý',pl:'PHỤ LỤC 1'},{k:'pl2',name:'PL2 – Giáo viên',pl:'PHỤ LỤC 2'}];
const RSNL_LV=['Đã thực hiện','Đang thực hiện – Còn hạn chế','Cần BS-Chưa thực hiện'];
// Tên mức hiển thị: “Cần bổ sung – Chưa thực hiện” rút gọn thành “Cần BS-Chưa thực hiện”.
const rsLv=l=>String(l).replace(/^\s*Cần bổ sung\s*[–-]?\s*Chưa thực hiện\s*$/i,'Cần BS-Chưa thực hiện');
const rsPct=(a,b)=>b?(Math.round(a/b*1000)/10).toLocaleString('vi-VN')+'%':'0%';
const RS_ST=['Đã thực hiện','Đang thực hiện','Chưa thực hiện'];
// PL1 do cán bộ quản lý (Ban giám hiệu) tự rà soát; PL2 mọi giáo viên, nhân viên đều tích được.
const rsCanFill=k=>k==='pl1'?canReview():!!S.meId;
// Phiếu của chính mình: rsnlAns/{năm}_{pl}_{uid} = {year,pl,uid,name,answers:{idTiêuChí:0|1|2}}. Nghe riêng tài liệu này (giáo viên không đọc được phiếu người khác).
const rsSubs={};
function rsMine(k){
  const id=`${S.year}_${k}_${S.meId}`;const db=S.db;if(!db||!S.meId)return null;
  if(rsSubs[id]?.db!==db){rsSubs[id]={db,data:null};unsubs.push(db.doc('rsnlAns/'+id).onSnapshot(d=>{if(S.db!==db)return;rsSubs[id].data=d.exists?d.data():null;render()},e=>console.warn('rsnlAns',e)))}
  return rsSubs[id].data;
}
const rsWho=()=>({uid:S.meId,name:S.myStaff?.name||S.fbUser?.displayName||S.fbUser?.email||'',cls:S.myStaff?.classCode||''});
async function rsAns(k,itemId,lv){
  if(!rsCanFill(k)){toast('Phụ lục này dành cho cán bộ quản lý');return}
  const id=`${S.year}_${k}_${S.meId}`;const cur=rsMine(k)?.answers?.[itemId];
  const val=cur===lv?firebase.firestore.FieldValue.delete():lv;
  await guard(()=>S.db.doc('rsnlAns/'+id).set({year:S.year,pl:k,...rsWho(),answers:{[itemId]:val},updatedAt:new Date().toISOString()},{merge:true}));
}
// Gửi phiếu: đánh dấu đã hoàn thành (cần tích đủ mọi tiêu chí). Sau khi gửi vẫn sửa được; BGH thấy giờ gửi gần nhất.
async function rsSubmit(k){
  const F=S.rsnl?.[k];const A=rsMine(k)?.answers||{};const all=(F?.groups||[]).flatMap(g=>g.items);const miss=all.filter(it=>A[it.id]==null).length;
  if(miss){toast(`Cô còn ${miss} tiêu chí chưa đánh giá`);S.rsp={...S.rsp,only:true};render();return}
  await guard(()=>S.db.doc(`rsnlAns/${S.year}_${k}_${S.meId}`).set({...rsWho(),submittedAt:new Date().toISOString()},{merge:true}),'Đã gửi phiếu tự đánh giá');
}
const rsId=()=>Math.random().toString(36).slice(2,9);
const rsKind=()=>RSNL.find(x=>x.k===S.arg)||RSNL[0];
const rsNum=n=>{const m=String(n).match(/^\s*Nhóm\s*(\d+)\s*[.:–-]?\s*/i);return m?m[0]:''};
// Đọc một trang tính: dòng tiêu đề có ô “Tiêu chí…”, các cột sau là các mức; dòng “Nhóm …” mở nhóm mới, dòng khác là tiêu chí.
function rsParseSheet(g){
  const hr=g.findIndex(r=>r.some(c=>/ti[êe]u ch[íi]/i.test(String(c))));if(hr<0)return null;
  const tc=g[hr].findIndex(c=>/ti[êe]u ch[íi]/i.test(String(c)));
  const lc=g[hr].map((c,i)=>i).filter(i=>i>tc&&String(g[hr][i]).trim());
  const levels=lc.map(i=>String(g[hr][i]).trim().replace(/\s*\n\s*/g,' – '));
  const title=g.slice(0,hr).flat().map(c=>String(c).trim()).filter(Boolean).find(t=>!/^ph[ụu] l[ụu]c/i.test(t))||'';
  const groups=[];
  for(const r of g.slice(hr+1)){
    const t=String(r[tc]??'').trim();if(!t||/^t[ổo]ng h[ợo]p/i.test(t))continue;
    if(/^nhóm\s*\d+/i.test(t)){groups.push({id:rsId(),name:t.slice(rsNum(t).length).trim()||t,items:[]});continue}
    if(!groups.length)groups.push({id:rsId(),name:'',items:[]});
    // x: cột mức có đánh dấu (x, ✓…) ở dòng tiêu chí, -1 nếu chưa đánh dấu; dùng ghi vào phiếu của người nạp.
    groups[groups.length-1].items.push({id:rsId(),text:t,x:lc.findIndex(i=>String(r[i]??'').trim())});
  }
  return groups.length?{title,levels:levels.length?levels.map(rsLv):RSNL_LV,groups}:null;
}
// Nhận diện trang nào là PL1, trang nào là PL2 (theo tên trang hoặc dòng “PHỤ LỤC 1/2”, “CÁN BỘ QUẢN LÝ”, “GV”).
async function rsReadFile(file){
  if(!window.XLSX)throw new Error('no xlsx');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const out={};
  for(const sn of wb.SheetNames){
    const g=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
    const p=rsParseSheet(g);if(!p)continue;
    const head=(sn+' '+g.slice(0,4).flat().join(' ')).toUpperCase();
    const k=/PL\s*1\b|PHỤ LỤC 1\b|QUẢN LÝ/.test(head)?'pl1':/PL\s*2\b|PHỤ LỤC 2\b|\bGV\b|GIÁO VIÊN/.test(head)?'pl2':null;
    if(k&&!out[k])out[k]={...p,sheet:sn};else if(!k&&!out._)out._={...p,sheet:sn};
  }
  if(out._){const k=rsKind().k;if(!out[k])out[k]=out._;delete out._}
  return out;
}
async function rsUpload(file){
  const got=await rsReadFile(file);const ks=RSNL.filter(x=>got[x.k]);
  if(!ks.length){toast('Không tìm thấy bảng tiêu chí (dòng tiêu đề có ô “Tiêu chí…”) trong file này');return}
  const cnt=x=>{const p=got[x.k];return`${x.name}: ${p.groups.length} nhóm, ${p.groups.reduce((a,g)=>a+g.items.length,0)} tiêu chí`};
  const had=ks.filter(x=>S.rsnl?.[x.k]?.groups?.length);
  if(!await askYes(`Đọc được ${ks.map(cnt).join('; ')}.${had.length?` Bộ tiêu chí ${had.map(x=>x.k.toUpperCase()).join(', ')} đang có sẽ được thay bằng bản trong file.`:''} ${ks.some(x=>got[x.k].groups.some(g=>g.items.some(it=>it.x>=0)))?`Các dấu x trong file sẽ ghi vào phiếu rà soát năm học ${S.year} của cô (thay phần đã tích trước đó). `:''}Cô nạp vào app không?`,'Nạp'))return;
  const now=new Date().toISOString();const nx={};
  const jobs=ks.flatMap(x=>{const p=got[x.k];const old=S.rsnl?.[x.k]?.groups||[];const ans={};
    // Giữ id cũ theo vị trí (nhóm, tiêu chí) để phiếu đã tích của mọi người vẫn khớp sau khi nạp lại.
    const groups=p.groups.map((g,gi)=>({id:old[gi]?.id||g.id,name:g.name,items:g.items.map((it,ii)=>{const id=old[gi]?.items?.[ii]?.id||it.id;if(it.x>=0)ans[id]=it.x;return{id,text:it.text}})}));
    nx[x.k]=Object.keys(ans).length;
    const w=[S.db.doc('settings/rsnl_'+x.k).set({title:p.title,levels:p.levels,groups,fileName:file.name,sheet:p.sheet,updatedAt:now,updatedBy:S.meId||''})];
    if(nx[x.k])w.push(S.db.doc(`rsnlAns/${S.year}_${x.k}_${S.meId}`).set({year:S.year,pl:x.k,uid:S.meId,name:S.myStaff?.name||S.fbUser?.displayName||S.fbUser?.email||'',answers:ans,updatedAt:now}));
    return w});
  await guard(()=>Promise.all(jobs),`Đã nạp ${ks.map(x=>x.k.toUpperCase()+(nx[x.k]?` (${nx[x.k]} tiêu chí đã đánh dấu)`:'')).join(', ')}`);
  S.rs=null;lastKey='';render();
}
function rsSync(){
  const d=S.rs?.draft;if(!d)return;const v=id=>document.getElementById(id)?.value;
  d.title=v('rsTitle')??d.title;d.levels=d.levels.map((l,i)=>v('rsL'+i)??l);
  d.groups.forEach((g,gi)=>{g.name=v(`rsG${gi}`)??g.name;g.items.forEach((it,ii)=>{it.text=v(`rsI${gi}_${ii}`)??it.text})});
}
function vRsnl(){
  if(S.arg==='phieu')return vRsPhieu();
  const K=rsKind();const doc=S.rsnl?.[K.k];const st=S.rs=S.rs?.k===K.k?S.rs:{k:K.k,draft:null};const d=st.draft;const ro=!canReview();
  const up=ro?'':`<label class="btn sm ${doc?'':'pri'}" style="cursor:pointer">${doc?'Nạp lại file Excel':'Nạp file Excel'}<input type="file" accept=".xlsx,.xls" id="rsFile" hidden></label>`;
  const head=`<div><h2>Rà soát năng lực: ${esc(K.name)}</h2><p class="small muted" style="margin:.3em 0 0">Bảng kiểm tự rà soát năng lực thực hiện chương trình GDMN mới. ${ro?'':'File Excel có thể chứa cả PL1 và PL2 (mỗi phụ lục một trang tính), app tự nhận diện.'}</p></div>`;

  const F=d||doc;const n=F.groups.reduce((a,g)=>a+g.items.length,0);const lv=F.levels?.length?(d?F.levels:F.levels.map(rsLv)):RSNL_LV;
  if(!d){
    // Phiếu tự rà soát: mỗi người một phiếu mỗi năm học. Ban giám hiệu mặc định xem Tổng hợp tất cả phiếu, hoặc chọn xem phiếu từng người (chỉ xem).
    const can=rsCanFill(K.k);const lead=canReview();

    const A=agg?{}:(mine?rsMine(K.k):others.find(x=>x.uid===who))?.answers||{};const edit=mine&&can;
    const all=F.groups.flatMap(g=>g.items);

    const C={};if(agg)for(const it of all)C[it.id]=lv.map((_,i)=>sheets.filter(x=>x.answers?.[it.id]===i).length);
    const ns=sheets.length;
    const cnt=agg?lv.map((_,i)=>all.reduce((a,it)=>a+C[it.id][i],0)):lv.map((_,i)=>all.filter(it=>A[it.id]===i).length);
    const den=agg?ns*n:n;const none=den-cnt.reduce((a,b)=>a+b,0);
    const fg=st.fg??'',fs=st.fs??'';

    const cell=(it,i,l)=>agg?(C[it.id][i]?`<b>${C[it.id][i]}</b> <span class="small muted">(${rsPct(C[it.id][i],ns)})</span>`:'<span class="muted">–</span>')

    const rows=F.groups.map((g,gi)=>{if(fg!==''&&+fg!==gi)return'';const its=g.items.map((it,ii)=>({it,ii})).filter(x=>okS(x.it));if(!its.length)return'';

      +its.map(({it,ii})=>`<tr><td style="text-align:center">${gi+1}.${ii+1}</td><td>${esc(it.text)}</td>${lv.map((l,i)=>`<td style="text-align:center">${cell(it,i,l)}</td>`).join('')}</tr>`).join('')}).join('');
    const opt=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`;
    const sc=x=>{const a=x.answers||{};return lv.map((_,i)=>all.filter(it=>a[it.id]===i).length)};
    const list=agg?`<h3 style="margin:.4em 0 0">Danh sách phiếu (${ns})</h3>${ns?`<div class="tablewrap"><table><thead><tr><th style="width:44px">STT</th><th style="min-width:170px">Họ tên</th><th style="width:80px">Lớp</th>${lv.map(l=>`<th style="width:110px;text-align:center">${esc(l)}</th>`).join('')}<th style="width:90px;text-align:center">Chưa chọn</th><th style="width:150px">Trạng thái</th><th style="width:60px"></th></tr></thead><tbody>
      ${sheets.map((x,j)=>{const c=sc(x);const m=n-c.reduce((a,b)=>a+b,0);return`<tr><td style="text-align:center">${j+1}</td><td>${esc(x.name||nameOf(x.uid))}</td><td>${esc(x.cls||'')}</td>${c.map(v=>`<td style="text-align:center">${v} <span class="small muted">(${rsPct(v,n)})</span></td>`).join('')}<td style="text-align:center">${m||''}</td><td>${x.submittedAt?`<span class="pill st-duyet">Đã gửi</span> <span class="small muted">${fmtD(x.submittedAt.slice(0,10))}</span>`:'<span class="pill st-cho">Đang làm</span>'}</td><td><button class="btn sm" data-rswho="${esc(x.uid)}">Xem</button></td></tr>`}).join('')}
      </tbody></table></div>`:'<div class="empty">Chưa có ai làm phiếu năm học này.</div>'}`:'';

        <label class="f">Nhóm tiêu chí<select id="rsFg">${opt('','Tất cả nhóm',fg)}${F.groups.map((g,gi)=>opt(gi,`Nhóm ${gi+1}. ${g.name}`,fg)).join('')}</select></label>
        <label class="f">Trạng thái<select id="rsFs">${opt('','Tất cả trạng thái',fs)}${RS_ST.map((l,i)=>opt(i,l,fs)).join('')}${opt('x','Chưa chọn',fs)}</select></label>

      ${mine&&!can?`<p class="small muted" style="margin:0">Phụ lục này dành cho cán bộ quản lý tự rà soát, cô xem các tiêu chí.</p>`:''}

      <div class="tablewrap rs-wrap"><table class="rs-t"><thead><tr><th style="width:56px">STT</th><th>Tiêu chí tự rà soát${none>0?`<div class="small muted" style="font-weight:400">Chưa chọn: ${none}/${den}</div>`:''}</th>${lv.map((l,i)=>`<th style="width:130px;text-align:center">${esc(l)}<div class="rs-tot">${cnt[i]}/${den}<br>${rsPct(cnt[i],den)}</div></th>`).join('')}</tr></thead>
        <tbody>${rows||`<tr><td colspan="${lv.length+2}" class="muted" style="text-align:center">Không có tiêu chí nào khớp bộ lọc.</td></tr>`}</tbody></table></div>
      ${list}

  }
  const rows=d.groups.map((g,gi)=>`<tr class="rs-g"><td style="text-align:center"><b>${gi+1}</b></td><td><input id="rsG${gi}" value="${esc(g.name)}" placeholder="Tên nhóm ${gi+1}" style="width:100%;font-weight:600"></td>
      <td style="white-space:nowrap"><button class="btn sm" data-rsmv="g|${gi}|-1" ${gi?'':'disabled'} title="Lên">↑</button><button class="btn sm" data-rsmv="g|${gi}|1" ${gi<d.groups.length-1?'':'disabled'} title="Xuống">↓</button><button class="btn sm" data-rsdel="g|${gi}" title="Xoá nhóm">✕</button></td></tr>`
    +g.items.map((it,ii)=>`<tr><td style="text-align:center">${gi+1}.${ii+1}</td><td><textarea id="rsI${gi}_${ii}" rows="2" style="width:100%">${esc(it.text)}</textarea></td>
      <td style="white-space:nowrap"><button class="btn sm" data-rsmv="i|${gi}|${ii}|-1" ${ii?'':'disabled'} title="Lên">↑</button><button class="btn sm" data-rsmv="i|${gi}|${ii}|1" ${ii<g.items.length-1?'':'disabled'} title="Xuống">↓</button><button class="btn sm" data-rsdel="i|${gi}|${ii}" title="Xoá tiêu chí">✕</button></td></tr>`).join('')
    +`<tr><td></td><td colspan="2"><button class="btn sm" data-rsadd="${gi}">+ Thêm tiêu chí vào nhóm ${gi+1}</button></td></tr>`).join('');
  return`<div class="stack">${head}<section class="sheet stack">
    <label class="f">Tên bảng kiểm<input id="rsTitle" value="${esc(d.title||'')}"></label>
    <div class="grid2" style="grid-template-columns:repeat(${lv.length},1fr)">${lv.map((l,i)=>`<label class="f">Mức ${i+1}<input id="rsL${i}" value="${esc(l)}"></label>`).join('')}</div>

    <div class="row"><button class="btn" data-act="rsAddG">+ Thêm nhóm</button><button class="btn pri" data-act="rsSave">Ghi</button><button class="btn" data-act="rsCancel">Huỷ thay đổi</button></div>
  </section></div>`;
}

  const me=rsMine('pl2');const A=me?.answers||{};const lv=(F.levels?.length?F.levels:RSNL_LV).map(rsLv);const all=F.groups.flatMap(g=>g.items);const n=all.length;
  const done=all.filter(it=>A[it.id]!=null).length;const st=S.rsp=S.rsp||{};const only=!!st.only;
  const cnt=lv.map((_,i)=>all.filter(it=>A[it.id]===i).length);const cls=S.classes.find(c=>(c.code||c.id)===S.myStaff?.classCode);
  const grp=F.groups.map((g,gi)=>{const its=g.items.map((it,ii)=>({it,ii})).filter(x=>!only||A[x.it.id]==null);if(!its.length)return'';

      ${its.map(({it,ii})=>`<div class="rs-q ${A[it.id]==null?'':'ok'}"><div><b>${gi+1}.${ii+1}</b> ${esc(it.text)}</div><div class="rs-opts" role="group" aria-label="Mức ${gi+1}.${ii+1}">${lv.map((l,i)=>`<button class="rs-opt rs-l${i} ${A[it.id]===i?'on':''}" data-rsans="pl2|${esc(it.id)}|${i}" aria-pressed="${A[it.id]===i}">${esc(l)}</button>`).join('')}</div></div>`).join('')}
    </section>`}).join('');
  return`<div class="stack">${head}
  <section class="sheet stack">
    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><div class="small muted">Họ tên</div><b>${esc(rsWho().name)}</b></div><div><div class="small muted">Lớp</div><b>${esc(cls?.name||S.myStaff?.classCode||'')}</b></div><div><div class="small muted">Trạng thái</div>${me?.submittedAt?`<span class="pill st-duyet">Đã gửi ${fmtD(me.submittedAt.slice(0,10))}</span>`:'<span class="pill st-nhap">Chưa gửi</span>'}</div></div>
    <div><div class="row" style="justify-content:space-between"><span>Đã đánh giá <b>${done}/${n}</b> tiêu chí</span><span class="small muted">${lv.map((l,i)=>`${esc(l)}: ${cnt[i]} (${rsPct(cnt[i],n)})`).join(' · ')}</span></div><div class="rs-bar"><i style="width:${n?done/n*100:0}%"></i></div></div>
    <div class="row"><button class="btn sm ${only?'pri':''}" data-act="rsOnly">${only?'Đang xem tiêu chí chưa đánh giá':'Chỉ xem tiêu chí chưa đánh giá'}</button><span class="small muted">Cô chọn một mức cho mỗi tiêu chí, bấm lại để bỏ chọn. App tự lưu.</span></div>
  </section>
  ${grp||'<section class="sheet"><div class="empty">Cô đã đánh giá đủ các tiêu chí.</div></section>'}
  <section class="sheet row" style="justify-content:space-between"><span>${done<n?`Còn ${n-done} tiêu chí chưa đánh giá.`:'Cô đã đánh giá đủ, bấm Gửi phiếu để Ban giám hiệu tổng hợp.'}</span><button class="btn pri" data-act="rsSubmit">${me?.submittedAt?'Gửi lại phiếu':'Gửi phiếu'}</button></section>
  </div>`;
}
async function rsSave(){
  rsSync();const K=rsKind();const d=S.rs?.draft;if(!d)return;
  const groups=d.groups.map(g=>({id:g.id,name:g.name.trim(),items:g.items.map(it=>({id:it.id,text:it.text.trim()})).filter(it=>it.text)})).filter(g=>g.name||g.items.length);
  if(groups.some(g=>!g.name)){toast('Mỗi nhóm cần có tên');return}
  if(!groups.some(g=>g.items.length)){toast('Bảng kiểm cần ít nhất một tiêu chí');return}
  const levels=d.levels.map(l=>l.trim());if(levels.some(l=>!l)){toast('Cô ghi đủ tên các mức');return}
  await guard(async()=>{await S.db.doc('settings/rsnl_'+K.k).set({title:d.title.trim(),levels,groups,updatedAt:new Date().toISOString(),updatedBy:S.meId||''},{merge:true});S.rs.draft=null},'Đã ghi bộ tiêu chí '+K.k.toUpperCase());
  lastKey='';render();
}
function rsAct(ds){
  const K=rsKind();const st=S.rs;
  if(ds.act==='rsEdit'||ds.act==='rsNew'){const doc=S.rsnl?.[K.k];st.draft=doc?JSON.parse(JSON.stringify({title:doc.title||'',levels:doc.levels?.length?doc.levels:RSNL_LV,groups:doc.groups||[]})):{title:'',levels:[...RSNL_LV],groups:[{id:rsId(),name:'',items:[{id:rsId(),text:''}]}]}}
  else if(ds.act==='rsCancel'){st.draft=null;toast('Đã huỷ thay đổi chưa ghi')}
  else{rsSync();const G=st.draft.groups;
    if(ds.act==='rsAddG')G.push({id:rsId(),name:'',items:[{id:rsId(),text:''}]});
    else if(ds.rsadd!=null)G[+ds.rsadd].items.push({id:rsId(),text:''});
    else if(ds.rsdel){const [t,a,b]=ds.rsdel.split('|');if(t==='g')G.splice(+a,1);else G[+a].items.splice(+b,1)}
    else if(ds.rsmv){const p=ds.rsmv.split('|');const L=p[0]==='g'?G:G[+p[1]].items;const i=+(p[0]==='g'?p[1]:p[2]),j=i+ +p[p.length-1];if(j>=0&&j<L.length)[L[i],L[j]]=[L[j],L[i]]}}
  lastKey='';render();
}

let lastKey='';
// Tô màu nút theo chức năng (Ghi xanh lá, AI soạn tím, Kết xuất xanh dương, Sửa cam, Huỷ xám, Xoá đỏ) cho mọi màn hình.
const BTN_TINT=[['b-undo',/^(bam lan nua de huy|huy|bo qua|quay lai|tro lai)/],['b-del',/xoa|^khong duyet/],['b-ai',/^ai\b/],['b-out',/ket xuat|^xuat|^tai (?!len)|^in\b/],['b-edit',/^(sua|xem|chinh|mo lai de sua|yeu cau sua)/],['b-save',/^(ghi|luu|xong|them|tao|nap|tai len|gui|cap nhat|duyet|dong y|soan)/]];
const BTN_CLS=BTN_TINT.map(([c])=>c);
function btnTint(root=document){root.querySelectorAll('.btn:not(.hm-ghost)').forEach(b=>{
  const t=b.textContent.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/^[^a-z]+/,'').trim();if(b.dataset.tint===t)return;b.dataset.tint=t;
  const m=BTN_TINT.find(([,re])=>re.test(t));b.classList.remove(...BTN_CLS);if(m)b.classList.add(m[0]);})}
new MutationObserver(()=>btnTint()).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
function render(){

  lastKey=key;

  $('#view').innerHTML=html;

  if(focus){const el=document.getElementById(focus);el?.focus?.()}
}

const DB_ST={duyet:['Đã duyệt','#2e9e44'],capnhat:['Đang cập nhật','#f2b705'],cho:['Chờ duyệt','#f2b705'],khong:['Không duyệt','#e0262b'],nhap:['Nháp','#9fd3f5'],chua:['Chưa có','#ecdfe0'],rs0:['Đã thực hiện','#2e9e44'],rs1:['Đang thực hiện','#f2b705'],rs2:['Chưa thực hiện','#e0262b'],rsx:['Chưa chọn','#ecdfe0'],miss:['Chưa làm','#5fb4ea'],fut:['Chưa đến tuần','#f1e8ea']};
// Một thanh xếp chồng theo trạng thái; max: độ dài chung để các dòng so được với nhau.
function dbBar(cnt,max,keys,lab){
  const tot=keys.reduce((a,k)=>a+(cnt[k]||0),0);if(!tot)return`<div class="db-bar db-none"><span>Chưa có</span></div>`;
  return`<div class="db-bar" style="--w:${Math.max(6,tot/max*100)}%"><div>${keys.filter(k=>cnt[k]).map(k=>`<i style="flex:${cnt[k]};background:${DB_ST[k][1]}" title="${DB_ST[k][0]}: ${cnt[k]}"></i>`).join('')}</div><b>${lab??tot}</b></div>`;
}

// Trục tuần của một khối (nt, mg) lấy từ chủ đề năm học: n tuần (ít nhất 35) và tuần hiện tại.
function dbWeeks(b){
  const set=S.topicSets.find(x=>x.id===`${S.year}_${b}`);const td=today();
  const subs=(set?.topics||[]).flatMap(t=>(t.subs||[]).filter(x=>!x.isBreak&&+x.week>0));
  const info={};for(const x of subs)info[+x.week]=x;
  const n=Math.max(35,...Object.keys(info).map(Number));
  const on=subs.find(x=>x.from&&x.from<=td&&td<=x.to);
  const cur=on?+on.week:Math.max(0,...subs.filter(x=>x.to&&x.to<td).map(x=>+x.week));
  return{n,cur,info};
}
// Gộp trạng thái các giáo án trong tuần: có bản không duyệt → không duyệt; còn chờ → chờ duyệt; còn lại đã duyệt.

function dbStrip(W,stOf,what){
  let made=0;const cells=Array.from({length:W.n},(_,i)=>{const w=i+1;const st=stOf(w);if(st)made++;
    const k=st||(w<=W.cur?'miss':'fut');const sb=W.info[w];
    return`<i class="db-c ${w===W.cur?'now':''}" style="background:${DB_ST[k][1]}" title="Tuần ${w}${sb?': '+esc(sb.name):''} · ${what}: ${DB_ST[k][0]}"></i>`}).join('');
  return{html:`<div class="db-strip" style="--n:${W.n}">${cells}</div>`,made};
}
function dbAxis(W){
  const t=[1,5,10,15,20,25,30,35].filter(x=>x<=W.n);

}
// Khung theo tuần: Nhà trẻ và Mẫu giáo riêng; mỗi lớp một (hoặc nhiều) dải 35 ô.

    return`<div class="db-blk"><div class="db-wr db-ax"><span class="db-bh" title="Đang ở tuần ${W.cur}/${W.n}"><b>${TB[b]}</b><small>Tuần ${W.cur||'–'}/${W.n}</small><span class="db-gauge"><i style="width:${W.cur/W.n*100}%"></i></span></span><span class="db-ls ${many?'':'one'}"><span class="db-ln">${many?'<small></small>':''}${dbAxis(W)}<span class="db-wn"></span></span></span></div>${rows}</div>`}).join('');
  return`<section class="sheet db-card"><h3>${title}</h3>${blocks||'<div class="empty">Chưa có lớp nào thuộc khối Nhà trẻ, Mẫu giáo.</div>'}</section>`;

function readForm(L){
  const v=id=>document.getElementById(id)?.value??'';
  const data={};
  for(const [k] of L.fields){
    if(k==='DOMAINS')DOMAINS.forEach(([dk])=>data['dm_'+dk]=v('f_dm_'+dk));
    else if(k==='GRID'){data.grid={};WEEK_ROWS.forEach((r,ri)=>WEEK_COLS.forEach((c,ci)=>{const x=v(`g_${ri}_${ci}`);if(x)data.grid[ri+'_'+ci]=x}))}
    else if(k==='LINHVUC')data.linh_vuc=v('f_linh_vuc');
    else data[k]=v('f_'+k);
  }
  return{year:v('h_year')||S.year,classId:v('h_cls'),ageGroup:v('h_age'),period:v('h_period'),parentId:v('h_parent'),title:v('h_title').trim(),data};
}
function autoTitle(L,f){
  const cn=f.classId?clsName(f.classId):'';
  switch(L.k){
    case'truong':return`Kế hoạch nhà trường ${f.year}`;
    case'namhoc':return`KHGD năm học ${f.year} – ${f.ageGroup||''}`;
    case'lop':return`KHGD lớp ${cn} ${f.year}`;
    case'thang':return`Kế hoạch tháng ${f.period?+f.period.slice(5):''} – ${cn}${f.data.chu_de?' – '+f.data.chu_de.split('\n')[0]:''}`;
    case'tuan':return`Tuần từ ${fmtD(f.period)} – ${cn}${f.data.chu_de?' – '+f.data.chu_de.split('\n')[0]:''}`;
    case'ngay':return`${(f.data.ten_hd||'Giáo án').split('\n')[0]} – ${cn} – ${fmtD(f.period)}`;
  }
}
async function savePlan(status){
  const a=S.arg;const p=a.id?S.plans.find(x=>x.id===a.id):null;const pl=p||a.draft;const L=LV[pl.level];
  const f=readForm(L);
  if(L.cls&&!f.classId){toast('Hãy chọn lớp');return}

  },status==='cho'?'Đã gửi duyệt':'Đã lưu nháp');
  render();
}

 ['hieuTruong','Họ tên Hiệu trưởng','Đặng Thị Thu Hoài','Dành cho chữ ký Hiệu trưởng trên các mẫu in'],

const EVL={ok:'Đạt',cg:'Cần cố gắng',no:'Chưa đạt'};

function prmApply(){
  const P=S.params||{};
  SP_MAX=Math.max(1,parseFloat(P.fileMaxMB)||10)*1048576;
  KT_DAYS=KT_DAYS_ALL.slice(0,String(P.soNgayHoc)==='5'?5:6);
  const on=kyOn();PERIODS=PERIODS_ALL.filter(([k])=>on.includes(k));if(!PERIODS.length)PERIODS=PERIODS_ALL;if(!PERIODS.some(([k])=>k===S.evKy))S.evKy=PERIODS[0][0];
  const c=(k,i)=>{const v=String(P.mucDanhGia?.[k]?.[i]??'').trim();return v||EVL_DEF[k][i]};
  for(const k of ['ok','cg','no'])EVL[k]=c(k,0);
  EV_OK=/^#[0-9a-f]{6}$/i.test(c('ok',1))?c('ok',1):EVL_DEF.ok[1];EV_CG=/^#[0-9a-f]{6}$/i.test(c('cg',1))?c('cg',1):EVL_DEF.cg[1];EV_NO=/^#[0-9a-f]{6}$/i.test(c('no',1))?c('no',1):EVL_DEF.no[1];
  // Màu các ô +, CG, − trong bảng đánh giá; chữ tự chọn trắng hoặc đậm để dễ đọc trên nền màu.
  const ink=h=>{const n=parseInt(h.slice(1),16),l=(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255;return l>0.62?'#2b1d00':'#fff'};
  const st=document.documentElement.style;[['ok',EV_OK],['cg',EV_CG],['no',EV_NO]].forEach(([k,v])=>{st.setProperty('--ev-'+k,v);st.setProperty('--ev-'+k+'-ink',ink(v))});
}
// Số lần AI soạn tối đa theo lớp (settings/params.aiMax[mã lớp][loại]); dòng _all là mặc định cho mọi lớp. Trống hoặc 0 là không giới hạn.
const AIQ=[['khnam','KH năm'],['khcd','KH chủ đề'],['khtuan','KH tuần'],['hoc','GA HĐ học'],['nt','GA HĐ vui chơi ngoài trời'],['goc','GA HĐ chơi trong lớp'],['chieu','GA HĐ chiều']];
const aiMax=(code,k)=>{const m=S.params?.aiMax||{};const v=[m[code]?.[k],m._all?.[k],k==='khtuan'?S.params?.aiKhTuanMax:''].find(x=>String(x??'').trim()!=='');return Math.max(0,parseInt(v,10)||0)};

const prm=k=>String(S.params?.[k]??'').trim()||(PRM.find(x=>x[0]===k)?.[2]??'');
const EVD=[['TC','Thể chất'],['NT','Nhận thức'],['NN','Ngôn ngữ'],['TX','TCXH'],['NgT','Nghệ thuật']];

// Đánh giá theo chủ đề: mục tiêu lấy đúng như KH tuần (ktGoals) của các nhánh trong chủ đề.
function evCtx(){
  const c=S.classes.find(x=>x.id===S.evCls);if(!c)return{};const code=c.code||c.id;
  const G=S.classGoals.find(x=>x.id===`${S.year}_${code}`);if(!G?.topics?.length)return{c,code};
  const td=today();const TS=G.topics.filter(t=>t.from&&t.from<=td);// chỉ chủ đề đã bắt đầu
  if(!TS.length)return{c,code,G,TS};const T=TS.find(t=>t.id===S.evT)||TS.find(t=>td<=t.to)||TS[TS.length-1];
  const Sb=T.subs.find(x=>x.id===S.evS)||null;const m=new Map();
  (Sb?[Sb]:T.subs).forEach(s=>ktGoals(G,s,code).forEach(g=>{if(!m.has(g.code))m.set(g.code,g)}));
  const goals=[...m.values()].sort((a,b)=>(EVO[a.dom]??9)-(EVO[b.dom]??9)||a.code.localeCompare(b.code,'en',{numeric:true}));
  return{c,code,G,TS,T,Sb,goals,ky:'CD_'+T.id};
}

function evChart(doms,av){const BW=620,W=900,H=250,T=28,B=40,ch=H-T-B,base=T+ch,gw=BW/doms.length,bw=Math.min(30,gw/4.2);

  const ro=(base-6)/2,sw=34,R=ro-sw/2,cx=BW+(W-BW)/2,cy=base-ro,C=2*Math.PI*R;let off=0;
  const seg=(v,col,lab)=>{if(!v)return'';const L=C*v/100,o=off;off+=L;return`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-o}" transform="rotate(-90 ${cx} ${cy})"><title>Trung bình 5 lĩnh vực – ${lab}: ${v}%</title></circle>`};
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W*1.15}px;height:auto" role="img" aria-label="Tỷ lệ Đạt, Cần cố gắng, Chưa đạt theo 5 lĩnh vực và trung bình">
   ${[0,50,100].map(v=>`<line x1="0" x2="${v?BW:W}" y1="${base-ch*v/100}" y2="${base-ch*v/100}" stroke="currentColor" opacity="${v?.12:.35}"/>`).join('')}

async function readStuFile(file){
  if(!window.XLSX){toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng');return}
  const c=S.classes.find(x=>x.id===S.stuCls);if(!c)return;
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const norm=t=>String(t??'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
  const pick=wb.SheetNames.find(n=>n.trim().toUpperCase()===String(c.code||'').toUpperCase())||wb.SheetNames.find(n=>{const g=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});return g.some(r=>r.some(x=>norm(x)==='mã định danh'))})||wb.SheetNames[0];
  const grid=XLSX.utils.sheet_to_json(wb.Sheets[pick],{header:1,raw:true,defval:''});
  const hi=grid.findIndex(r=>r.some(x=>norm(x)==='tên')||r.some(x=>norm(x)==='mã định danh'));
  if(hi<0){toast('Không tìm thấy dòng tiêu đề (Họ đệm, Tên, Mã định danh…)');return}
  const H=grid[hi].map(norm);const ix=(...ns)=>H.findIndex(h=>ns.some(n=>h===n||h.includes(n)));
  const col={last:ix('họ đệm','họ và đệm'),first:H.findIndex(h=>h==='tên'),full:ix('họ tên','họ và tên'),sid:ix('mã định danh','định danh'),dob:ix('ngày sinh'),st:ix('thái'),note:ix('ghi chú'),from:ix('từ ngày'),to:ix('đến ngày')};
  const today=new Date().toISOString().slice(0,10);
  const rows=[];const seen=new Set();
  grid.slice(hi+1).forEach((r,i)=>{
    const g=k=>col[k]>=0?r[col[k]]:'';
    let last=String(g('last')).trim(),first=String(g('first')).trim();
    if(!first&&col.full>=0){const sp=splitName(g('full'));last=sp.last;first=sp.first}
    if(/^\d+$/.test(first)&&/^\d*$/.test(last))return; // dòng đánh số cột 1,2,3…
    if(!first&&!last)return;
    let sid=g('sid');sid=typeof sid==='number'?String(sid).padStart(12,'0'):String(sid).trim();
    const stRaw=norm(g('st'));const status=stRaw.includes('nghỉ')?'Tạm nghỉ':'Đang học';
    const row={line:hi+i+2,lastName:last,firstName:first,studentId:sid,dob:toISO(g('dob')),status,note:String(g('note')||'').trim(),fromDate:toISO(g('from')),toDate:toISO(g('to'))};
    if(!first)Object.assign(row,{kind:'error',err:'Thiếu tên'});
    else if(sid&&seen.has(sid))Object.assign(row,{kind:'error',err:'Trùng mã định danh trong file'});
    else{
      const ex=sid?S.children.find(k=>k.studentId===sid):S.children.find(k=>k.classId===c.id&&(k.name||'').toLowerCase()===`${last} ${first}`.trim().toLowerCase()&&(!row.dob||k.dob===row.dob));
      row.exId=ex?.id;row.kind=!ex?'new':ex.classId!==c.id?'move':'update';if(ex&&ex.classId!==c.id)row.from=clsName(ex.classId);
      if(row.dob&&row.dob>today)row.warn='Ngày sinh sau hôm nay';
      else if(!row.dob)row.warn='Thiếu ngày sinh';
    }
    if(sid)seen.add(sid);rows.push(row);
  });
  S.stuImport={file:file.name+(wb.SheetNames.length>1?` – sheet ${pick}`:''),rows};lastKey='';render();
}

const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
// Cất file vào Firestore thành nhiều mảnh (fileChunks/{key}_{i}); prog(%) báo tiến độ.
async function storeChunks(f,prog){
  const b64=await readB64(f);const n=Math.ceil(b64.length/SP_CHUNK)||1;const key=S.db.collection('fileChunks').doc().id;
  for(let i=0;i<n;i++){prog?.(Math.round(i*100/n));await S.db.doc(`fileChunks/${key}_${i}`).set({fileKey:key,i,data:b64.slice(i*SP_CHUNK,(i+1)*SP_CHUNK)})}
  return{fileKey:key,chunks:n,fileName:f.name,size:f.size,mime:f.type||''};
}
const spStoreFile=f=>storeChunks(f,p=>{S.sp.busy=`Đang tải lên ${p}%`;const el=$('[data-act=spSave]');if(el)el.textContent=S.sp.busy});
async function spDropFile(key,n){for(let i=0;i<(n||1);i++)await S.db.doc(`fileChunks/${key}_${i}`).delete()}
async function spSave(){
  const v=id=>($('#'+id)?.value||'').trim();const ed=S.sp.edit!=='new'?S.spFiles.find(x=>x.id===S.sp.edit):null;
  const title=v('spTitle');if(!title){toast('Nhập tên');return}
  const f=$('#spFile')?.files?.[0];
  if(!ed&&!f){toast('Chọn file đính kèm');return}
  if(f&&f.size>SP_MAX){toast(`File lớn hơn ${SP_MAX/1048576} MB, hãy lưu PDF hoặc nén ảnh rồi thử lại`);return}
  const d={title,createdDate:v('spCreated'),approvedDate:v('spApproved'),effectiveDate:v('spEffective'),version:v('spVersion'),status:v('spStatus')||'nhap',updatedAt:new Date().toISOString(),updatedBy:S.meId||''};
  S.sp.busy='Đang lưu';const el=$('[data-act=spSave]');if(el){el.textContent=S.sp.busy;el.disabled=true}
  const K=spKind(),KN=SPK[K],age=spAge(KN);if(KN.cls&&!canCls(spCls())){toast('Chỉ giáo viên lớp này hoặc Ban giám hiệu được lưu');S.sp.busy=null;render();return}const P=f&&(KN.ages||KN.topics)&&S.sp.parsed?.items?.length?S.sp.parsed:null;
  if(P&&P.age&&P.age!==age){const t=KN.ages.find(a=>a[0]===P.age);toast(t?`File này là ${t[1]}. Hãy chuyển sang tab ${t[1]} để lưu.`:'Độ tuổi trong file khác với tab đang chọn');return}
  await guard(async()=>{
    if(f)Object.assign(d,await spStoreFile(f));
    let id=ed?.id;
    if(ed){await S.db.doc('schoolPlanFiles/'+ed.id).set(d,{merge:true});if(f&&ed.fileKey)await spDropFile(ed.fileKey,ed.chunks)}
    else id=(await S.db.collection('schoolPlanFiles').add({...d,kind:K,...(KN.ages?{age}:{}),...(KN.cls?{cls:spCls()}:{}),createdAt:d.updatedAt,createdBy:S.meId||''})).id;
    if(P){const el=$('[data-act=spSave]');if(el)el.textContent='Đang cập nhật dữ liệu từ file';if(KN.topics)await applyTopics(P,{id,...d});else await applyYccd(K,age,P,{id,...d})}
  },P?(KN.topics?`Đã lưu file và nạp ${P.items.length} chủ đề`:`Đã lưu file và nạp ${P.items.length} mục tiêu`):ed?'Đã lưu':'Đã thêm');
  S.sp.busy=null;S.sp.edit=null;S.sp.parsed=null;lastKey='';render();
}
async function spBlob(x){
  const parts=[];for(let i=0;i<(x.chunks||1);i++){const d=await S.db.doc(`fileChunks/${x.fileKey}_${i}`).get();if(!d.exists)throw new Error('missing chunk');parts.push(d.data().data)}
  const bin=atob(parts.join(''));const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type:x.mime||'application/octet-stream'});
}
async function ycLoad(id){
  const x=S.spFiles.find(y=>y.id===id);if(!x?.fileKey)return;toast('Đang đọc file…');
  try{if(x.kind==='namhoc'){const p=await parseTopics(await spBlob(x));if(!p.items.length){toast('Không tìm thấy phần Dự kiến chủ đề trong file này');return}await applyTopics(p,x);toast(`Đã nạp ${p.items.length} chủ đề lớn từ file này`);return}
    const p=await parseYccd(await spBlob(x));if(!p.items.length){toast('Không tìm thấy bảng YCCĐ trong file này');return}
    const n=await applyYccd(x.kind,x.age,p,x);toast(`Đã nạp ${p.items.length} mục tiêu từ file này${n?`, ẩn ${n} mã không còn trong file`:''}`)}
  catch(e){console.warn(e);toast(e?.code==='permission-denied'?'Tài khoản của bạn không có quyền làm việc này':'Không đọc được file này')}
}
async function spDownload(id){
  const x=S.spFiles.find(y=>y.id===id);if(!x?.fileKey)return;toast('Đang tải file…');
  try{const url=URL.createObjectURL(await spBlob(x));const a=document.createElement('a');a.href=url;a.download=x.fileName||'ke-hoach';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){console.warn(e);toast('Chưa tải được file, thử lại sau')}
}

/* ---------- KHGD lớp: mục tiêu gắn chủ đề (sheet CHU DE) ---------- */
const GDOM=[['TC','Thể chất',/TH[EỂ]\s*CH[AẤ]T/i],['NN','Ngôn ngữ',/NG[OÔ]N\s*NG[UỮ]/i],['NT','Nhận thức',/NH[AẬ]N\s*TH[UỨ]C/i],['TX','TC – XH',/TCXH|T[IÌ]NH\s*C[AẢ]M/i],['NgT','Nghệ thuật',/NGH[EỆ]\s*THU[AẬ]T|(^|\s)N\.?\s*THU[AẬ]T/i]];
const clsLabel=code=>{const c=S.classes.find(x=>(x.code||x.id)===code);return c?c.name:code};
const AGEKEY={'Nhà trẻ 24–36 tháng':'24-36','Mẫu giáo bé 3–4 tuổi':'3-4','Mẫu giáo nhỡ 4–5 tuổi':'4-5','Mẫu giáo lớn 5–6 tuổi':'5-6'};
async function parseGoalsXlsx(file){
  if(!window.XLSX)throw new Error('no xlsx');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sn=wb.SheetNames.find(n=>n.replace(/\s/g,'').toUpperCase()==='CHUDE');if(!sn)return{err:'Không thấy sheet CHUDE (hoặc CHU DE) trong file này.'};
  const g=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  const str=v=>String(v??'').replace(/\s+/g,' ').trim();
  const iso=v=>{if(typeof v==='number'&&v>20000){const d=XLSX.SSF.parse_date_code(v);return`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
    const m=str(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return'';const Y=m[3].length===2?'20'+m[3]:m[3];return`${Y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};
  let year='',applies='';const notes=[];
  const hi=g.findIndex((r,i)=>i<20&&/^Tuần$/i.test(str(r[0])));if(hi<0)return{err:'Không thấy dòng tiêu đề (cột A ghi “Tuần”) trong sheet CHUDE.'};
  for(const r of g.slice(0,hi)){const a=str(r[0]);
    const ym=a.match(/Năm học:?\s*(\d{4})\s*[-–]\s*(\d{4})/i);if(ym)year=ym[1]+'-'+ym[2];
    const km=a.match(/^Khối\s*:?\s*(.+)$/i);if(km)applies=km[1];
    const b=str(r[1]).replace(/\s*\d{4}\s*[-–]\s*\d{4}$/,'');if(/^(Ngày|Nghỉ)/i.test(b)&&r[2]!==''){const v=r[2];notes.push(b+': '+(typeof v==='number'?fmtD(iso(v)):str(v)))}}
  const H=g[hi].map(str);const col={};GDOM.forEach(([k,,re])=>{col[k]=H.findIndex(h=>re.test(h))});
  const nCol=H.findIndex(h=>/SỐ\s*MT/i.test(h)),tCol=H.findIndex(h=>/Giáo viên|Phụ trách/i.test(h));
  const age=ageKey(applies);
  const topics=[],events=[],bad=[];
  for(const r of g.slice(hi+1,60)){
    const wk=str(r[0]),name=str(r[1]),fr=iso(r[2]),to=iso(r[3])||fr,own=tCol>=0?str(r[tCol]):'';
    if(!name)continue;const t=topics[topics.length-1];
    if(/^\d+$/.test(wk)&&t){const goals={};let n=0;
      for(const [k] of GDOM){const raw=col[k]>=0?str(r[col[k]]):'';const codes=raw.split(/[;,\s]+/).map(x=>x.trim()).filter(Boolean);
        codes.forEach(c=>{if(!/^[A-Za-zĐđ]+\d+\.\d+$/.test(c))bad.push(`Tuần ${wk}: “${c}”`)});goals[k]=codes;n+=codes.length}
      t.subs.push({id:t.id+'.'+(t.subs.length+1),week:+wk,name,from:fr,to,...(own?{owner:own}:{}),goals,n,nFile:nCol>=0?+r[nCol]||0:n});continue}
    if(!fr){topics.push({id:'t'+(topics.length+1),no:topics.length+1,name:name.replace(/^\d+\s*\.\s*/,''),owner:own,from:'',to:'',weeks:0,subs:[]});continue}
    const ev=/^NGH[IỈ]\s*T[EẾ]T/i.test(name)?'Nghỉ Tết Nguyên đán':name;const last=events[events.length-1];
    if(last&&last.name===ev&&last.after===topics.length)last.to=to;else events.push({name:ev,from:fr,to,after:topics.length,...(own?{owner:own}:{})});
  }
  const tp=topics.filter(t=>t.subs.length);
  if(!tp.length)return{err:'Không đọc được tuần nào từ sheet CHUDE.'};
  tp.forEach((t,i)=>{t.no=i+1;t.id='t'+(i+1);t.subs.forEach((x,j)=>x.id=t.id+'.'+(j+1));t.from=t.subs[0].from;t.to=t.subs.reduce((a,x)=>x.to>a?x.to:a,'');t.weeks=new Set(t.subs.map(x=>x.week)).size});
  const subs=tp.flatMap(t=>t.subs);
  return{year,applies,age,progNote:notes.join('; '),topics:tp,events,bad,weekCount:new Set(subs.map(x=>x.week)).size,goalCount:subs.reduce((a,x)=>a+x.n,0)};
}
async function loadGoalsXlsx(file,cls){
  if(!canCls(cls)){toast('Chỉ giáo viên lớp này hoặc Ban giám hiệu được nạp');return}
  const p=await parseGoalsXlsx(file);if(p.err){toast(p.err);return}
  const c=S.classes.find(x=>(x.code||x.id)===cls);const year=p.year||S.year;
  const age=p.age||AGEKEY[c?.ageGroup]||'';
  const doc=JSON.parse(JSON.stringify({year,cls,className:c?.name||cls,age,applies:p.applies,progNote:p.progNote,topics:p.topics,events:p.events,weekCount:p.weekCount,goalCount:p.goalCount,bad:p.bad.slice(0,50),fileName:file.name,updatedAt:new Date().toISOString(),updatedBy:S.meId||''}));
  await guard(()=>S.db.doc(`classGoals/${year}_${cls}`).set(doc),`Đã nạp ${p.weekCount} tuần, ${p.goalCount} lượt mục tiêu cho lớp ${c?.name||cls}`+(year!==S.year?` (năm học ${year})`:''));
}
function vGoals(cls,ro){
  const G=S.classGoals.find(x=>x.id===`${S.year}_${cls}`);const sp=S.sp;
  const up=ro?'':`<label class="btn sm ${G?'':'pri'}" style="cursor:pointer">${G?'Nạp lại Excel mục tiêu':'Nạp Excel mục tiêu'}<input type="file" accept=".xlsx,.xls" data-gxl="${esc(cls)}" hidden></label>`;
  if(!G)return`<section class="sheet stack"><h3 style="margin:0">Mục tiêu gắn chủ đề – ${esc(clsLabel(cls))}</h3><p class="muted small" style="margin:0">Chưa có. Chọn file Excel KHGD của lớp, app đọc sheet CHUDE (từ dòng tiêu đề “Tuần” đến dòng 60, cột A – K): chủ đề, tuần, thời gian và mã mục tiêu theo 5 lĩnh vực.</p>${up?`<div class="row">${up}</div>`:''}</section>`;
  const Y=S.yccd.filter(x=>x.age===G.age&&x.active!==false);const ymap=Object.fromEntries(Y.map(x=>[x.code,x]));
  const used=new Set(G.topics.flatMap(t=>t.subs.flatMap(s=>GDOM.flatMap(([k])=>s.goals?.[k]||[]))));
  const unknown=Y.length?[...used].filter(c=>!ymap[c]):[];const unused=Y.filter(x=>!used.has(x.code)).map(x=>x.code);
  const td=today();const inR=(a,b)=>a&&b&&a<=td&&td<=b;
  const chip=c=>{const y=ymap[c];return`<span class="pill" style="margin:1px;${Y.length&&!y?'background:var(--rose-soft,#fde2e4);color:var(--rose)':''}" title="${esc(y?(y.mt||y.yccd||''):(Y.length?'Mã này không có trong bảng phân giải YCCĐ '+G.age:''))}">${esc(c)}</span>`};

  let rows='';
  G.topics.forEach((t,i)=>{
    (G.events||[]).filter(e=>e.after===i).forEach(e=>rows+=evRow(e));
    const now=inR(t.from,t.to);
    t.subs.forEach((s,j)=>{const sNow=inR(s.from,s.to);
      rows+=`<tr${now?' style="background:var(--leaf-soft)"':''}>${j===0?`<td rowspan="${t.subs.length}" style="vertical-align:top"><b>${t.no}</b></td><td rowspan="${t.subs.length}" style="vertical-align:top;min-width:150px"><b>${esc(t.name)}</b><div class="small muted">${fmtD(t.from)} – ${fmtD(t.to)} · ${t.weeks} tuần</div>${t.owner?`<div class="small muted">Phụ trách: ${esc(t.owner)}</div>`:''}</td>`:''}
      <td style="text-align:center"><b>${s.week}</b></td><td style="min-width:160px${S.planLog.some(l=>l.year===G.year&&l.cls===cls&&l.subId===s.id)?';background:var(--sun-soft)':''}">${esc(s.name)}<div class="small muted">${fmtD(s.from)} – ${fmtD(s.to)}</div>${sNow?' <span class="pill st-cho">Tuần này</span>':''}</td>
      ${GDOM.map(([k])=>`<td>${(s.goals?.[k]||[]).map(chip).join('')}</td>`).join('')}<td style="text-align:center">${s.n}</td></tr>`});
  });
  (G.events||[]).filter(e=>e.after>=G.topics.length).forEach(e=>rows+=evRow(e));
  const nDom=k=>[...used].filter(c=>c.replace(/[\d.]+$/,'')===k).length;
  return`<section class="sheet stack"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Mục tiêu của chủ đề lớp ${esc(G.className||clsLabel(cls))}</h3></div>
    <div class="row">${up}${ro?'':`<button class="btn sm warn" data-gclear="${esc(G.id)}">${S.confirm==='gc'+G.id?'Bấm lần nữa để xóa':'Xóa bảng mục tiêu'}</button>`}</div></div>
  ${!Y.length?`<p class="small muted" style="margin:0">Chưa có bảng phân giải YCCĐ ${esc(G.age||'')} nên chưa đối chiếu được mã. Nạp bảng ở mục Phân giải YCCĐ rồi quay lại đây.</p>`:''}

     const nl=d.rows.filter(r=>kcName(r,ymap)!==kcName(old[r.code]||{code:r.code},ymap)).map(r=>({code:r.code,old:kcName(old[r.code]||{code:r.code},ymap),new:kcName(r,ymap),at:now,by:S.meId||'',byName:S.me?.name||S.fbUser?.displayName||''}));

// AI soạn Nội dung và Hoạt động cho từng mục tiêu của nhánh; kết quả vào bản nháp, cô sửa rồi bấm Ghi.
async function kcAi(){
  kcSync();const {code,G,T,Sb,docId}=kcCtx();if(!Sb)return;
  if(!canCls(code)){toast('Cô không có quyền soạn kế hoạch lớp này');return}
  const url=S.aiCfg?.workerUrl;if(!url){toast('Chưa cài máy chủ AI');return}
  const saved=S.topicPlans.find(x=>x.id===docId);const max=aiMax(code,'khcd');if(max&&(saved?.aiRuns||0)>=max){toast(`Đã hết ${max} lượt AI soạn cho chủ đề nhánh này`);return}
  const d=S.kc.draft;if(!d?.rows.length){toast('Chưa có mục tiêu nào để soạn');return}
  const c=S.classes.find(x=>(x.code||x.id)===code);const ymap=Object.fromEntries(S.yccd.filter(x=>x.age===G.age&&x.active!==false).map(x=>[x.code,x]));
  const req={task:'topicPlan',cls:G.className||c?.name||code,block:G.applies||c?.ageGroup||'',age:G.age||'',week:Sb.week,from:fmtD(Sb.from),to:fmtD(Sb.to),
    topic:T.name,topicFrom:fmtD(T.from),topicTo:fmtD(T.to),sub:Sb.name,
    goals:d.rows.map(r=>({code:r.code,domain:(GDOM.find(([k])=>k===domOf(r.code))||[])[1]||'',name:kcName(r,ymap),yccd:ymap[r.code]?.yccd||'',content:r.nd||'',activity:r.hd||''}))};
  S.kc.busy=true;S.kc.err='';lastKey='';render();
  try{
    const tok=await S.auth.currentUser.getIdToken();
    const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(req)});
    const out=await r.json().catch(()=>({}));
    if(!r.ok){S.kc.err=out.error==='Chưa hỗ trợ yêu cầu này'?'Máy chủ AI chưa được cập nhật phần KH chủ đề. Cô đợi vài phút cho Cloudflare deploy xong rồi bấm lại.':out.error||`Máy chủ AI báo lỗi ${r.status}.`;toast('AI chưa soạn được');return}
    const m=Object.fromEntries((out.plan?.rows||[]).map(x=>[x.code,x]));
    if(S.kc.draft?.id===docId){S.kc.draft.rows.forEach(r=>{const a=m[r.code];if(a){r.nd=a.noiDung||r.nd;r.hd=a.hoatDong||r.hd}});S.kc.draft.ai=true;S.kc.draft.aiNote=out.plan?.note||''}
    S.db.doc('topicPlans/'+docId).set({aiRuns:firebase.firestore.FieldValue.increment(1)},{merge:true}).catch(e=>console.warn(e));
    aiLog(req,out);toast('AI đã soạn xong, cô xem và sửa rồi bấm Ghi'+aiCost(out));
  }catch(e){console.warn(e);S.kc.err='Không kết nối được máy chủ AI ('+(e.message||e)+'). Cô kiểm tra mạng rồi thử lại.';toast('Chưa kết nối được máy chủ AI')}
  finally{S.kc.busy=false;lastKey='';render()}
}

const kcAiReq=(code,G,T,sb,rows)=>{const c=S.classes.find(x=>(x.code||x.id)===code);const ymap=Object.fromEntries(S.yccd.filter(x=>x.age===G.age&&x.active!==false).map(x=>[x.code,x]));

async function kcAiAll(){

  const max=aiMax(code,'khcd');

  const out=todo.filter(x=>max&&(S.topicPlans.find(p=>p.id===x.id)?.aiRuns||0)>=max),go=todo.filter(x=>!out.includes(x));
  if(!go.length){toast(todo.length?`Các nhánh còn thiếu đều đã hết ${max} lượt AI soạn`:'Tất cả các nhánh đã soạn đủ Nội dung và Hoạt động');return}
  if(!await askYes(`AI sẽ soạn ${go.length} nhánh (${go.map(x=>'tuần '+x.sb.week).join(', ')}) và ghi luôn vào kế hoạch. Cô đồng ý không?`,'Soạn'))return;

  const one=async x=>{const req=kcAiReq(code,G,T,x.sb,x.rows);
    try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(req)});const o=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(o.error||`Máy chủ AI báo lỗi ${r.status}`);

      await S.db.doc('topicPlans/'+x.id).set({aiRuns:firebase.firestore.FieldValue.increment(1)},{merge:true});aiLog(req,o);

  const q=[...go];await Promise.all([0,1].map(async()=>{while(q.length)await one(q.shift())}));

}

  });

  S.kc.draft=null;S.kc.ed=[];lastKey='';render();
}

/* ---------- Tải file KH tuần lên: đọc bảng trong file Word, kiểm tra đúng mẫu rồi điền vào từng ô ---------- */
// Đọc file Word (.docx, hoặc .doc dạng trang web như file app xuất ra) thành chữ toàn văn bản và các bảng [dòng][ô] = chữ.
async function ktReadDoc(f){
  const buf=new Uint8Array(await f.arrayBuffer());
  if(buf[0]===0x50&&buf[1]===0x4B){
    const zip=await JSZip.loadAsync(buf);const xf=zip.file('word/document.xml');if(!xf)throw new Error('Không đọc được nội dung file Word này');
    const x=new DOMParser().parseFromString(await xf.async('string'),'application/xml');const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    const kids=(el,n)=>[...el.childNodes].filter(c=>c.localName===n&&c.namespaceURI===W);
    const para=p=>{let s='';for(const n of p.getElementsByTagNameNS(W,'*')){if(n.localName==='t')s+=n.textContent;else if(n.localName==='tab')s+=' ';else if(n.localName==='br'||n.localName==='cr')s+='\n'}return s};
    const cell=tc=>[...tc.getElementsByTagNameNS(W,'p')].map(para).join('\n');
    const tables=[...x.getElementsByTagNameNS(W,'tbl')].map(t=>kids(t,'tr').map(tr=>kids(tr,'tc').map(cell)));
    return{text:[...x.getElementsByTagNameNS(W,'p')].map(para).join('\n'),tables};
  }
  if(buf[0]===0xD0&&buf[1]===0xCF)throw new Error('File này là Word kiểu cũ (Word 97–2003), app chưa đọc được. Cô mở file bằng Word, chọn Lưu thành (Save As), kiểu “Word Document (*.docx)” rồi tải file .docx lên.');
  let enc='utf-8';if(buf[0]===0xFF&&buf[1]===0xFE)enc='utf-16le';else if(buf[0]===0xFE&&buf[1]===0xFF)enc='utf-16be';
  else{const m=new TextDecoder('latin1').decode(buf.slice(0,4000)).match(/charset\s*=\s*["']?([\w-]+)/i);if(m)enc=m[1]}
  let txt='';try{txt=new TextDecoder(enc).decode(buf)}catch{}if(!/<table/i.test(txt))txt=new TextDecoder('utf-8').decode(buf);
  if(!/<table/i.test(txt))throw new Error('Không thấy bảng nào trong file này. Cô chọn đúng file kế hoạch tuần bằng Word.');
  const dom=new DOMParser().parseFromString(txt,'text/html');
  const BLK=/^(P|DIV|LI|H[1-6]|TR|TD|TH|TABLE)$/;
  const text=el=>{let s='';const walk=n=>{for(const c of n.childNodes){if(c.nodeType===3)s+=c.nodeValue.replace(/\s+/g,' ');else if(c.nodeType===1){if(c.tagName==='BR')s+='\n';else{const b=BLK.test(c.tagName);if(b)s+='\n';walk(c);if(b)s+='\n'}}}};walk(el);return s};
  const tables=[...dom.querySelectorAll('table')].map(t=>[...t.rows].map(tr=>[...tr.cells].map(text)));
  return{text:text(dom.body),tables};
}
const ktClean=s=>String(s||'').normalize('NFC').replace(/[\u200b-\u200d\ufeff\u00ad]/g,'').replace(/ /g,' ').split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
const ktKey=s=>ktClean(s).normalize('NFC').toLowerCase().replace(/[–—]/g,'-').replace(/[\s,.:;]+/g,' ').replace(/ ?- ?/g,'-').trim();
// Kiểm tra file đúng mẫu của trường và lấy nội dung từng ô. Trả {errs, warns, plan}.
function ktParseDoc(doc,ctx){
  const {G,T,Sb,code}=ctx;const errs=[],warns=[];
  const tb=doc.tables.find(t=>t.length&&ktKey(t[0][0])==='giờ sinh hoạt');
  if(!tb)return{errs:['Không thấy bảng kế hoạch tuần có dòng tiêu đề “Giờ sinh hoạt | Thứ hai | … | Thứ bảy”.'],warns};
  const hd=tb[0].slice(1).map(ktKey);
  if(hd.length!==6||KT_DAYS.some((x,i)=>hd[i]!==ktKey(x)))errs.push(`Dòng tiêu đề phải có đủ 6 cột: ${KT_DAYS.join(', ')}.`);
  const rows=tb.slice(1).filter(r=>r.some(c=>ktClean(c)));
  const plan={};
  KT_ROWS.forEach(([k,lab,kind],i)=>{
    const r=rows[i];
    if(!r){errs.push(`Thiếu dòng “${lab}”.`);return}
    if(ktKey(r[0])!==ktKey(lab)){errs.push(`Dòng thứ ${i+2} của bảng phải là “${lab}”, trong file đang là “${ktClean(r[0]).replace(/\n/g,' ')||'(trống)'}”.`);return}
    const cells=r.slice(1).map(ktClean);
    if(kind==='full'){if(cells.length!==1){errs.push(`Dòng “${lab}” phải là một ô chung cho cả tuần (trong file có ${cells.length} ô).`);return}plan[k]=cells[0];return}
    if(cells.length!==6){errs.push(`Dòng “${lab}” phải có đủ 6 ô từ Thứ hai đến Thứ bảy (trong file có ${cells.length} ô).`);return}
    plan[k]=cells;
  });
  rows.slice(KT_ROWS.length).forEach(r=>errs.push(`Bảng có thêm dòng “${ktClean(r[0]).replace(/\n/g,' ')||'(trống)'}” không có trong mẫu.`));
  const top=ktClean(doc.text).toUpperCase();const wm=top.match(/KẾ HOẠCH\s+GIÁO DỤC\s+TUẦN\s*(\d+)/);
  if(!wm)errs.push('Không thấy tiêu đề “KẾ HOẠCH GIÁO DỤC TUẦN …” ở đầu file.');
  else if(+wm[1]!==+Sb.week)errs.push(`File là kế hoạch tuần ${wm[1]}, nhưng cô đang chọn tuần ${Sb.week}. Cô chọn đúng chủ đề nhánh của tuần ${wm[1]} rồi tải lại.`);
  if(errs.length)return{errs,warns};
  const lm=ktClean(doc.text).match(/Lớp\s*:\s*([^\n]+)/i);const cn=G.className||clsLabel(code);
  if(!lm)warns.push('Đầu file chưa ghi “Lớp: …”.');else if(ktKey(lm[1])!==ktKey(cn))warns.push(`Trong file ghi lớp “${lm[1].trim()}”, cô đang chọn lớp “${cn}”.`);
  const dm=top.match(/TỪ NGÀY\s*(\d{1,2})\/(\d{1,2})/);
  if(dm&&`${dm[1].padStart(2,'0')}/${dm[2].padStart(2,'0')}`!==fmtD(Sb.from).slice(0,5))warns.push(`Trong file ghi từ ngày ${dm[1]}/${dm[2]}, tuần ${Sb.week} của app bắt đầu ngày ${fmtD(Sb.from).slice(0,5)}.`);
  const fg=(plan.muctieu||'').split(/[;,\s]+/).filter(Boolean),ag=ktGoals(G,Sb,code).map(g=>g.code);
  if(fg.join(';')!==ag.join(';'))warns.push(`Mục tiêu trong file (${fg.join('; ')||'trống'}) khác mục tiêu tuần trong app (${ag.join('; ')||'trống'}). App giữ mục tiêu theo KH chủ đề.`);
  const DM=Object.fromEntries(KT_DOM.map(k=>[k.toLowerCase(),k]));
  plan.hdh=plan.hdh.map((c,i)=>{const ls=c.split('\n');const m=ls[0]?.match(/^(TC|NN|NT|TX|NgT|KNS)(?![\p{L}\d])\s*[:–-]?\s*(.*)$/iu);
    if(!m){if(c)warns.push(`${KT_DAYS[i]}: hoạt động học chưa ghi lĩnh vực (TC, NN, NT, TX, NgT, KNS) ở dòng đầu.`);return{dom:'',title:c}}
    return{dom:DM[m[1].toLowerCase()],title:[m[2],...ls.slice(1)].filter(Boolean).join('\n')}});
  delete plan.muctieu;
  return{errs,warns,plan};
}

function gaParseDoc(doc,kind){
  const K=GA_K[kind];const all=ktClean(doc.text).split('\n').filter(l=>!/^[-–_.…\s]{5,}$/.test(l)&&Object.values(GA_BADGE).reduce((x,b)=>x.split(b).join(''),l).trim()!=='');

  const mine=gaAt.find(i=>K.re.test(all[i]));
  if(mine==null)return{errs:[`File này là ${gaAt.map(i=>all[i].replace(/^GA\s*:\s*/i,'')).join(', ')}, không phải GA ${K.ga}. Cô tải file vào đúng ô hoạt động.`]};
  // Khung đầu bắt đầu từ dòng “Tuần …” ngay trước dòng GA; phần của GA kéo đến khung đầu của GA tiếp theo.

  const at={};lines.forEach((l,i)=>{for(const [f,re] of H)if(at[f]==null&&re.test(l))at[f]=i});
  const iNx=lines.findIndex(l=>/^Nhận xét cuối ngày/i.test(l));
  for(const f of K.sec)if(at[f]==null)errs.push(`Không thấy mục “${GA_SEC[f]}”.`);
  if(errs.length)return{errs};
  const order=K.sec.map(f=>at[f]);if(order.some((x,i)=>i&&x<order[i-1]))return{errs:[`Các mục phải theo thứ tự: ${K.sec.map((f,i)=>`${i+1}. ${GA_SEC[f]}`).join('; ')}.`]};
  const end=f=>{const n=K.sec.indexOf(f)+1;return n<K.sec.length?at[K.sec[n]]:(iNx>=0?iNx:lines.length)};
  const body=f=>lines.slice(at[f]+1,end(f));const firstHead=at[K.sec[0]];

  const tt=[];let cur=null;
  for(const l of body('tienTrinh')){if(/^Bước\s*\d+/i.test(l)&&l.length<140){cur={buoc:l,noiDung:''};tt.push(cur)}else if(cur)cur.noiDung+=(cur.noiDung?'\n':'')+l;else{cur={buoc:'',noiDung:l};tt.push(cur)}}
  if(!tt.length)return{errs:['Mục “Tiến trình hoạt động” chưa có nội dung.']};
  const plan={mucTieu:items(body('mucTieu')),chuanBi:items(body('chuanBi')),tienTrinh:tt.map(x=>({buoc:x.buoc,noiDung:x.noiDung.replace(/^[–•]\s*/gm,'- ')}))};
  if(K.lv)plan.linhVuc=head(/^L[ĩi]nh v[ựu]c\s*:\s*(.+)$/i);
  plan.tenHoatDong=kind==='goc'?lines.slice(0,firstHead).filter(l=>/^Góc/i.test(l)).join('\n'):head(/^(?:T[êe]n ho[ạa]t đ[ộo]ng|Ho[ạa]t đ[ộo]ng)\s*:\s*(.+)$/i);
  if(K.tichHop)plan.tichHop=head(/^T[íi]ch h[ợo]p\s*:\s*(.*)$/i);
  if(K.sec.includes('phamChat')){plan.phamChat=items(body('phamChat'));plan.nangLuc=items(body('nangLuc'))}
  if(K.sec.includes('diaDiem'))plan.diaDiem=items(body('diaDiem')).join('; ');

// Đồng bộ chữ trong file GA giáo viên tải lên: cả file Times New Roman cỡ 14, giữ nguyên đậm, nghiêng, màu, bố cục.
async function gaNormFile(f){
  try{
    const buf=new Uint8Array(await f.arrayBuffer());
    const FONT='Times New Roman',SZ=28,rf=`<w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:eastAsia="${FONT}" w:cs="${FONT}"/>`;
    if(buf[0]===0x50&&buf[1]===0x4B){
      const zip=await JSZip.loadAsync(buf);
      const parts=Object.keys(zip.files).filter(n=>/^word\/(document|styles|header\d*|footer\d*|footnotes|endnotes)\.xml$/.test(n));
      for(const n of parts){
        let x=await zip.file(n).async('string');
        // Giữ font ký hiệu (gạch đầu dòng, dấu tick) để không hỏng ký tự.
        const sym=m=>/Symbol|Wingdings|Webdings/i.test(m)?m:rf;
        x=x.replace(/<w:rFonts\b[^>]*\/>/g,sym).replace(/<w:rFonts\b[^>]*>[\s\S]*?<\/w:rFonts>/g,sym)
           .replace(/<w:(sz|szCs) w:val="\d+"\s*\/>/g,`<w:$1 w:val="${SZ}"/>`);
        // Cỡ chữ mặc định cả file: chèn w:sz đúng thứ tự phần tử mà Word yêu cầu.
        if(n==='word/styles.xml')x=x.replace(/<w:rPrDefault\/>|<w:rPrDefault>\s*<\/w:rPrDefault>/,`<w:rPrDefault><w:rPr>${rf}</w:rPr></w:rPrDefault>`)
          .replace(/<w:rPrDefault>\s*<w:rPr\/>\s*<\/w:rPrDefault>/,`<w:rPrDefault><w:rPr>${rf}</w:rPr></w:rPrDefault>`)
          .replace(/(<w:rPrDefault>\s*<w:rPr>)([\s\S]*?)(<\/w:rPr>)/,(m,a,b,e)=>{b=b.replace(/<w:(sz|szCs) w:val="\d+"\/>/g,'');const i=b.search(/<w:(highlight|u|effect|bdr|shd|fitText|vertAlign|rtl|cs|em|lang|eastAsianLayout|specVanish|oMath)\b/);const z=`<w:sz w:val="${SZ}"/><w:szCs w:val="${SZ}"/>`;return a+(i<0?b+z:b.slice(0,i)+z+b.slice(i))+e});
        zip.file(n,x);
      }
      const out=await zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      return new File([out],f.name,{type:out.type});
    }
    // File .doc dạng trang web (Word lưu HTML): bỏ font, cỡ chữ riêng từng đoạn và đặt chung một kiểu.
    let t=new TextDecoder('utf-8').decode(buf);
    if(/<html[\s>]/i.test(t.slice(0,4000))){
      t=t.replace(/(font-family|mso-[a-z-]*font-family|font-size|mso-ansi-font-size|mso-bidi-font-size)\s*:\s*(?:'[^']*'|&quot;.*?&quot;|[^;"'}])*;?/gi,'').replace(/<font\b[^>]*>/gi,'<font>')
         .replace(/<\/head>/i,`<style>body,p,span,td,li,div,font{font-family:"${FONT}" !important;font-size:14pt !important}</style></head>`);
      return new File([t],f.name,{type:f.type||'application/msword'});
    }
  }catch(e){console.warn('gaNormFile',e)}
  return f;
}
