async function kcAi(){
  kcSync();const {code,G,T,Sb,docId}=kcCtx();if(!Sb)return;
  if(!canCls(code)){toast('Cô không có quyền soạn kế hoạch lớp này');return}
  const url=S.aiCfg?.workerUrl;if(!url){toast('Chưa cài máy chủ AI');return}
  const saved=S.topicPlans.find(x=>x.id===docId);const max=aiMax(code,'khcd');if(max&&(saved?.aiRuns||0)>=max){toast(`Đã hết ${max} lượt AI soạn cho chủ đề nhánh này`);return}
  const d=S.kc.draft;if(!d?.rows.length){toast('Chưa có mục tiêu nào để soạn');return}
  const c=S.classes.find(x=>(x.code||x.id)===code);const ymap=Object.fromEntries(S.yccd.filter(x=>x.age===G.age&&x.active!==false).map(x=>[x.code,x]));
  const req={task:'topicPlan',cls:G.className||c?.name||code,block:G.applies||c?.ageGroup||'',age:G.age||'',week:Sb.week,from:fmtD(Sb.from),to:fmtD(Sb.to),
    topic:T.name,topicFrom:fmtD(T.from),topicTo:fmtD(T.to),sub:Sb.name,
    goals:d.rows.map(r=>({code:r.code,domain:(GDOM.find(([k])=>k===domOf(r.code))||[])[1]||'',name:kcName(r,ymap),yccd:ymap[r.code]?.yccd||'',content:r.nd||'',activity:r.hd||'',form:r.ht||'',method:r.pp||''}))};
  S.kc.busy=true;S.kc.err='';lastKey='';render();
  try{
    const tok=await S.auth.currentUser.getIdToken();
    const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(req)});
    const out=await r.json().catch(()=>({}));
    if(!r.ok){S.kc.err=out.error==='Chưa hỗ trợ yêu cầu này'?'Máy chủ AI chưa được cập nhật phần KH chủ đề. Cô đợi vài phút cho Cloudflare deploy xong rồi bấm lại.':out.error||`Máy chủ AI báo lỗi ${r.status}.`;toast('AI chưa soạn được');return}
    const m=Object.fromEntries((out.plan?.rows||[]).map(x=>[x.code,x]));
    if(S.kc.draft?.id===docId){S.kc.draft.rows.forEach(r=>{const a=m[r.code];if(a){r.nd=a.noiDung||r.nd;r.hd=a.hoatDong||r.hd;r.ht=a.hinhThuc||r.ht||'';r.pp=a.phuongPhap||r.pp||''}});S.kc.draft.ai=true;S.kc.draft.aiNote=out.plan?.note||''}
    S.db.doc('topicPlans/'+docId).set({aiRuns:firebase.firestore.FieldValue.increment(1)},{merge:true}).catch(e=>console.warn(e));
    aiLog(req,out);toast('AI đã soạn xong, cô xem và sửa rồi bấm Ghi'+aiCost(out));
  }catch(e){console.warn(e);S.kc.err='Không kết nối được máy chủ AI ('+(e.message||e)+'). Cô kiểm tra mạng rồi thử lại.';toast('Chưa kết nối được máy chủ AI')}
  finally{S.kc.busy=false;lastKey='';render()}
}

async function ktAuto(){

  finally{S.kt.busy=false;lastKey='';render()}

/* ---------- Kế hoạch thể dục sáng: theo tháng, mỗi cột một tuần; lập cho toàn trường, một khối hoặc một lớp ---------- */
// Dòng của bảng: [khóa, tên, số dòng ô nhập, nhóm (ô gộp bên trái), có ô link YouTube].
const TDS_TD='Trọng động',TDS_NH='Bài hát, nhạc';
const TDS_ROWS=[['phuTrach','Cô phụ trách',1],['khoiDong','Khởi động',4],['hoHap','Hô hấp',2,TDS_TD],['tay','Tay – vai',2,TDS_TD],['bung','Bụng – lườn',2,TDS_TD],['chan','Chân',2,TDS_TD],['bat','Bật',2,TDS_TD],['hoiTinh','Hồi tĩnh',2],
  ['nhacKD','Nhạc khởi động',1,TDS_NH,1],['nhacBT','Nhạc bài tập chung',1,TDS_NH,1],['nhacHT','Nhạc hồi tĩnh',1,TDS_NH,1]];

const tdsGrp=i=>{const g=TDS_ROWS[i][3];if(!g)return null;const f=TDS_ROWS.findIndex(x=>x[3]===g);return{g,first:f===i,n:TDS_ROWS.filter(x=>x[3]===g).length}};
const TDS_DEF={mucDich:'- Trẻ tập đúng, đều, nhịp nhàng các động tác theo hiệu lệnh và theo nhạc.\n- Phát triển các nhóm cơ và hô hấp; rèn sự nhanh nhẹn, khéo léo.\n- Trẻ hứng thú, có thói quen tập thể dục buổi sáng.',
  chuanBi:'- Sân tập sạch, bằng phẳng, an toàn.\n- Loa, nhạc bài hát; dụng cụ tập (nơ, vòng, gậy…) đủ cho trẻ.\n- Trang phục của cô và trẻ gọn gàng.',
  khoiDong:'Cho trẻ đi vòng tròn kết hợp các kiểu đi: đi thường, đi bằng mũi bàn chân, đi bằng gót chân, chạy chậm, chạy nhanh, chạy chậm, về hàng theo tổ.',
  hoiTinh:'Đi nhẹ nhàng 1 – 2 vòng quanh sân, hít thở sâu.'};
const tdsBlk=b=>b==='Nhà trẻ'?'NT':b==='Mẫu giáo'?'MG':'';
// Đối tượng lập kế hoạch: toàn trường, các khối, các lớp cô được xem.
function tdsScopes(){
  const vc=visCls();const bl=seeAllCls()?['Nhà trẻ','Mẫu giáo']:[...new Set(vc.map(c=>c.block))];
  return[{k:'TRUONG',name:'Toàn trường'},...bl.filter(tdsBlk).map(b=>({k:tdsBlk(b),name:'Khối '+b,block:b})),...vc.map(c=>({k:c.code||c.id,name:'Lớp '+c.name,cls:c}))];
}
const tdsCodes=sc=>sc==='TRUONG'?TCLS().map(c=>c.code||c.id):sc==='NT'||sc==='MG'?TCLS().filter(c=>tdsBlk(c.block)===sc).map(c=>c.code||c.id):[sc];
// Các tháng của năm học (tháng 8 đến tháng 5 năm sau), dạng YYYY-MM.
const tdsMonths=y=>{const a=+String(y).slice(0,4);return[...Array(10)].map((_,i)=>{const m=8+i;return m>12?`${a+1}-${String(m-12).padStart(2,'0')}`:`${a}-${String(m).padStart(2,'0')}`})};
const tdsMLabel=m=>`Tháng ${+m.slice(5)}/${m.slice(0,4)}`;
// Số tuần lấy theo chủ đề nhánh của lớp (KHGD lớp) trùng với tuần đó.
function tdsWeekNo(from,to,codes){
  for(const G of S.classGoals){if(!codes.some(c=>G.id===`${S.year}_${c}`))continue;
    for(const t of G.topics||[])for(const x of t.subs||[])if(x.from&&x.from<=to&&from<=x.to&&x.week)return x.week}
  return'';
}
// Các tuần của tháng: tuần có Thứ hai nằm trong tháng.
function tdsWeeks(month,sc){
  const [y,m]=month.split('-').map(Number);const d=new Date(y,m-1,1);while(d.getDay()!==1)d.setDate(d.getDate()+1);
  const codes=tdsCodes(sc);const out=[];
  while(d.getMonth()===m-1){const e=new Date(d);e.setDate(e.getDate()+KT_DAYS.length-1);const from=d.toLocaleDateString('sv'),to=e.toLocaleDateString('sv');out.push({from,to,week:tdsWeekNo(from,to,codes)});d.setDate(d.getDate()+7)}
  return out;
}
function tdsNorm(p,weeks,blank){

  return{mucDich:p.mucDich??df('mucDich'),chuanBi:p.chuanBi??df('chuanBi'),src:p.src||'',note:p.note||'',
    weeks:weeks.map(w=>{const o0=(p.weeks||[]).find(x=>x.from===w.from)||{};const o={...o0,nhacBT:o0.nhacBT??o0.nhac};delete o.nhac;return{...w,...Object.fromEntries(TDS_KEYS.map(k=>[k,o[k]??df(k)]))}})};
}

  const ms=tdsMonths(S.year);if(!ms.includes(st.month)){const cur=today().slice(0,7);st.month=ms.includes(cur)?cur:ms[1]}
  const sc=scs.find(x=>x.k===st.scope)||scs[0];const weeks=tdsWeeks(st.month,sc.k);
  const docId=`${S.year}_${sc.k}_${st.month}`;const saved=S.morningPlans.find(x=>x.id===docId&&x.weeks);

  return{st,scs,sc,scope:sc.k,month:st.month,weeks,docId,saved,can,topics,G};
}

async function tdsAuto(){

  const url=S.aiCfg?.workerUrl;if(!url){toast('Chưa cài máy chủ AI');return}
  const max=tdsRunMax(c.scope);if(max&&(S.morningPlans.find(x=>x.id===c.docId)?.aiRuns||0)>=max){toast(`Đã hết ${max} lượt AI soạn cho kế hoạch này`);return}

  const ages=[...new Set(cl.map(x=>c.G?.age||x.ageGroup||x.block).filter(Boolean))].join(', ');
  const req={task:'morningPlan',cls:c.sc.name,block:c.sc.block||c.sc.cls?.block||[...new Set(cl.map(x=>x.block))].join(', '),age:ages,month:tdsMLabel(c.month),
    topics:c.topics.map(t=>`${t.name} (${fmtD(t.from)} – ${fmtD(t.to)})`),weeks:d.weeks.map(w=>({week:w.week,from:fmtD(w.from),to:fmtD(w.to)}))};

    const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(req)});
    const out=await r.json().catch(()=>({}));
    if(!r.ok){st.err=out.error||`Máy chủ AI báo lỗi ${r.status}.`;toast('AI chưa soạn được');return}
    const p=out.plan||{};

    st.draft={id:c.docId,mucDich:p.mucDich||d.mucDich,chuanBi:p.chuanBi||d.chuanBi,src:'ai',note:p.note||'',
      weeks:d.weeks.map((w,j)=>({...w,...Object.fromEntries(TDS_ROWS.filter(([k])=>k!=='phuTrach').map(([k])=>[k,p.weeks?.[j]?.[k]||w[k]]))}))};
    aiLog(req,out);toast('AI đã soạn xong bản nháp, cô xem và sửa rồi bấm Ghi'+aiCost(out));

  finally{st.busy=false;lastKey='';render()}
}

function ktParseDoc(doc,ctx){

  if(dm&&`${dm[1].padStart(2,'0')}/${dm[2].padStart(2,'0')}`!==fmtD(Sb.from).slice(0,5))warns.push(`Trong file ghi từ ngày ${dm[1]}/${dm[2]}, tuần ${Sb.week} của app bắt đầu ngày ${fmtD(Sb.from).slice(0,5)}.`);

    return{dom:DM[m[1].toLowerCase()],title:[m[2],...ls.slice(1)].filter(Boolean).join('\n')}});
  delete plan.muctieu;
  return{errs,warns,plan};
}

      ups['lessons.'+g.key]=JSON.parse(JSON.stringify({...g.d,...(GA_K[g.kind].nhanXet&&old?.nhanXet?{nhanXet:old.nhanXet}:{}),mt,...(r=>r?{aiRv:{muc:r.muc,lyDo:r.lyDo,goiY:r.goiY,mt:r.sig,at:now}}:{})(im.rv[o.week]?.res?.[g.key]),note:'',src:'gv',imp:g.file.name,updatedAt:now,updatedBy:me,status:'cho',statusAt:now,statusBy:me,rv:old?.rv||null}));n++}
    if(Object.keys(ups).length)await S.db.doc('weekPlans/'+docId).update(ups);

async function rvDel(){

  lastKey='';render();
}

  const kind=GA_K[st.kind]?st.kind:'hoc';const wp=S.weekPlans.find(x=>x.id===c.docId);const key=`${st.day}_${kind}`;

}

function gaSrc(p,day,kind){
  if(!p)return'';
  if(kind==='hoc'){const h=p.hdh?.[day]||{};return h.title?`${h.dom?h.dom+' – ':''}${h.title}`:''}
  if(kind==='chieu')return p.chieu?.[day]||'';
  if(kind==='nt')return p.ngoaiTroi?.[day]||'';
  if(Array.isArray(p.gocNgay))return p.gocNgay[day]||'';
  return(p.goc||[]).map(g=>g.name+(g.content?': '+g.content:'')).join('\n');
}

// Tải GA giáo viên tự soạn: đọc file Word theo mẫu của trường rồi điền vào các ô.
// File có thể chứa một GA hoặc cả ngày (4 GA); app lấy phần có dòng “GA: …” đúng loại hoạt động đang tải.
function gaParseDoc(doc,kind){
  const K=GA_K[kind];const all=ktClean(doc.text).split('\n').filter(l=>!/^[-–_.…\s]{5,}$/.test(l)&&Object.values(GA_BADGE).reduce((x,b)=>x.split(b).join(''),l).trim()!=='');
  const gaPart=l=>{const m=l.match(/(?:^|\s)GA\s*:\s*(.*)$/i);return m?m[1]:null};const gaAt=all.map((l,i)=>gaPart(l)!=null?i:-1).filter(i=>i>=0);
  if(!gaAt.length)return{errs:[`Không thấy dòng “GA: ${K.ga}” trong khung đầu giáo án.`]};
  const mine=gaAt.find(i=>K.re.test(gaPart(all[i])));
  if(mine==null)return{errs:[`File này là ${gaAt.map(i=>gaPart(all[i])).join(', ')}, không phải GA ${K.ga}. Cô tải file vào đúng ô hoạt động.`]};
  // Khung đầu bắt đầu từ dòng “Tuần …” ngay trước dòng GA; phần của GA kéo đến khung đầu của GA tiếp theo.
  const startOf=i=>{for(let j=i;j>=Math.max(0,i-4);j--)if(/^Tuần\s*\d+/i.test(all[j]))return j;return i};
  const nx=gaAt.find(i=>i>mine);const lines=all.slice(startOf(mine),nx==null?all.length:startOf(nx));
  const errs=[];const H=Object.entries(GA_SEC).map(([f,l])=>[f,new RegExp('^(\\d+|[IVX]+)\\s*[.)]\\s*'+(f==='tienTrinh'?'Ti[êếe]n tr[ìi]nh':l.normalize('NFC')),'i')]);
  const at={};lines.forEach((l,i)=>{for(const [f,re] of H)if(at[f]==null&&re.test(l))at[f]=i});
  const iNx=lines.findIndex(l=>/^Nhận xét cuối ngày/i.test(l));
  for(const f of K.sec)if(at[f]==null)errs.push(`Không thấy mục “${GA_SEC[f]}”.`);
  if(errs.length)return{errs};
  const order=K.sec.map(f=>at[f]);if(order.some((x,i)=>i&&x<order[i-1]))return{errs:[`Các mục phải theo thứ tự: ${K.sec.map((f,i)=>`${i+1}. ${GA_SEC[f]}`).join('; ')}.`]};
  const end=f=>{const n=K.sec.indexOf(f)+1;return n<K.sec.length?at[K.sec[n]]:(iNx>=0?iNx:lines.length)};
  const body=f=>lines.slice(at[f]+1,end(f));const firstHead=at[K.sec[0]];
  const items=a=>a.map(x=>x.replace(/^\s*[-–•+*o▪]\s*/,'').trim()).filter(Boolean);
  const head=re=>{for(const l of lines.slice(0,firstHead)){const m=l.match(re);if(m)return m[1].trim()}return''};
  const tt=[];let cur=null;
  for(const l of body('tienTrinh')){if(/^Bước\s*\d+/i.test(l)&&l.length<140){cur={buoc:l,noiDung:''};tt.push(cur)}else if(cur)cur.noiDung+=(cur.noiDung?'\n':'')+l;else{cur={buoc:'',noiDung:l};tt.push(cur)}}
  if(!tt.length)return{errs:['Mục “Tiến trình hoạt động” chưa có nội dung.']};
  const plan={mucTieu:items(body('mucTieu')),chuanBi:items(body('chuanBi')),tienTrinh:tt.map(x=>({buoc:x.buoc,noiDung:x.noiDung.replace(/^[–•]\s*/gm,'- ')}))};
  if(K.lv)plan.linhVuc=head(/^L[ĩi]nh v[ựu]c\s*:\s*(.+)$/i);
  plan.tenHoatDong=kind==='goc'?lines.slice(0,firstHead).filter(l=>/^Góc/i.test(l)).join('\n'):head(/^(?:T[êe]n ho[ạa]t đ[ộo]ng|Ho[ạa]t đ[ộo]ng)\s*:\s*(.+)$/i);
  if(K.tichHop)plan.tichHop=head(/^T[íi]ch h[ợo]p\s*:\s*(.*)$/i);
  if(K.sec.includes('phamChat')){plan.phamChat=items(body('phamChat'));plan.nangLuc=items(body('nangLuc'))}
  if(K.sec.includes('diaDiem'))plan.diaDiem=items(body('diaDiem')).join('; ');
  if(K.nhanXet&&iNx>=0){const nl=lines.slice(iNx+1);const ix=GA_NX.map(([,l])=>nl.findIndex(x=>x.replace(/:$/,'').toLowerCase()===l.toLowerCase()||x.toLowerCase().startsWith(l.slice(0,l.indexOf('.')+1).toLowerCase()+' ')));
    plan.nhanXet=Object.fromEntries(GA_NX.map(([f],j)=>[f,ix[j]<0?'':nl.slice(ix[j]+1,ix.slice(j+1).find(x=>x>=0)??nl.length).join('\n')]))}
  return{errs:[],plan};

// Đồng bộ chữ trong file GA giáo viên tải lên: cả file Times New Roman cỡ 14, giữ nguyên đậm, nghiêng, màu, bố cục.
async function gaNormFile(f){
  try{
    const buf=new Uint8Array(await f.arrayBuffer());
    const FONT='Times New Roman',SZ=28,rf=`<w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:eastAsia="${FONT}" w:cs="${FONT}"/>`;
    if(buf[0]===0x50&&buf[1]===0x4B){
      if(!await needLib('jszip'))throw new Error('jszip');
      const zip=await JSZip.loadAsync(buf);
      const parts=Object.keys(zip.files).filter(n=>/^word\/(document|styles|header\d*|footer\d*|footnotes|endnotes)\.xml$/.test(n));
      for(const n of parts){
        let x=await zip.file(n).async('string');
        // Giữ font ký hiệu (gạch đầu dòng, dấu tick) để không hỏng ký tự.
        const sym=m=>/Symbol|Wingdings|Webdings/i.test(m)?m:rf;
        x=x.replace(/<w:rFonts\b[^>]*\/>/g,sym).replace(/<w:rFonts\b[^>]*>[\s\S]*?<\/w:rFonts>/g,sym)
           .replace(/<w:(sz|szCs) w:val="\d+"\s*\/>/g,`<w:$1 w:val="${SZ}"/>`);
        // Cỡ chữ mặc định cả file: chèn w:sz đúng thứ tự phần tử mà Word yêu cầu.
        if(n==='word/styles.xml')x=x.replace(/<w:rPrDefault\/>|<w:rPrDefault>\s*<\/w:rPrDefault>/,`<w:rPrDefault><w:rPr>${rf}</w:rPr></w:rPrDefault>`)
          .replace(/<w:rPrDefault>\s*<w:rPr\/>\s*<\/w:rPrDefault>/,`<w:rPrDefault><w:rPr>${rf}</w:rPr></w:rPrDefault>`)
          .replace(/(<w:rPrDefault>\s*<w:rPr>)([\s\S]*?)(<\/w:rPr>)/,(m,a,b,e)=>{b=b.replace(/<w:(sz|szCs) w:val="\d+"\/>/g,'');const i=b.search(/<w:(highlight|u|effect|bdr|shd|fitText|vertAlign|rtl|cs|em|lang|eastAsianLayout|specVanish|oMath)\b/);const z=`<w:sz w:val="${SZ}"/><w:szCs w:val="${SZ}"/>`;return a+(i<0?b+z:b.slice(0,i)+z+b.slice(i))+e});
        zip.file(n,x);
      }
      const out=await zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      return new File([out],f.name,{type:out.type});
    }
    // File .doc dạng trang web (Word lưu HTML): bỏ font, cỡ chữ riêng từng đoạn và đặt chung một kiểu.
    let t=new TextDecoder('utf-8').decode(buf);
    if(/<html[\s>]/i.test(t.slice(0,4000))){
      t=t.replace(/(font-family|mso-[a-z-]*font-family|font-size|mso-ansi-font-size|mso-bidi-font-size)\s*:\s*(?:'[^']*'|&quot;.*?&quot;|[^;"'}])*;?/gi,'').replace(/<font\b[^>]*>/gi,'<font>')
         .replace(/<\/head>/i,`<style>body,p,span,td,li,div,font{font-family:"${FONT}" !important;font-size:14pt !important}</style></head>`);
      return new File([t],f.name,{type:f.type||'application/msword'});
    }
  }catch(e){console.warn('gaNormFile',e)}
  return f;
}

  const z=new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdF" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/><Relationship Id="rIdH" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rIdSet" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>${links.map(([id,u])=>`<Relationship Id="${id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${xq(u)}" TargetMode="External"/>`).join('')}</Relationships>`);
  z.file('word/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${W}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="28"/><w:szCs w:val="28"/><w:lang w:val="vi-VN" w:eastAsia="en-US" w:bidi="ar-SA"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="288" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`);

}

/* ---------- phân giải YCCĐ: đọc bảng từ file Word ---------- */
const ageKey=t=>{const m=String(t||'').match(/(\d+)\s*[–-]\s*(\d+)/);return m?m[1]+'-'+m[2]:''};
const niceDom=s=>{s=s.replace(/^LĨNH VỰC\s*/i,'').trim().toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)};
async function parseYccd(file){
  if(!await needLib('jszip'))throw new Error('Chưa tải được thư viện, kiểm tra mạng rồi thử lại');
  const zip=await JSZip.loadAsync(await file.arrayBuffer());const f=zip.file('word/document.xml');if(!f)throw new Error('not docx');
  const doc=new DOMParser().parseFromString(await f.async('string'),'application/xml');

  const kids=(el,n)=>[...el.childNodes].filter(c=>c.localName===n);
  const ptxt=p=>[...p.getElementsByTagNameNS(NS,'t')].map(t=>t.textContent).join('').trim();
  const ctxt=tc=>[...tc.getElementsByTagNameNS(NS,'p')].map(ptxt).filter(Boolean).join('\n');

  let dom=null,domName='',ageText='',head=null;const items=[],doms=[],dup=[];const seen=new Set();
  for(const el of body.childNodes){
    if(el.localName==='p'){const t=ptxt(el);
      const m=t.match(/^(I|II|III|IV|V|VI|VII)\.\s*(.+)$/);if(m){dom=m[1];domName=niceDom(m[2]);doms.push([dom,domName]);continue}
      const a=t.match(/ĐỘ TUỔI\s*(.+)$/i);if(a&&!ageText)ageText=a[1].trim();
    }else if(el.localName==='tbl'&&dom){
      let prev=[],map=null;
      for(const tr of kids(el,'tr')){

          const vm=pr&&kids(pr,'vMerge')[0];const cont=vm&&(vm.getAttributeNS(NS,'val')||'continue')!=='restart';
          const v=cont?(prev[g]||''):ctxt(tc);for(let k=0;k<span;k++)row[g+k]=v;g+=span}

        if(!map&&row.some(c=>/Mã\s*YCC/i.test(c))){map={code:row.findIndex(c=>/^Mã/i.test(c)),y:row.findIndex(c=>/^Yêu cầu/i.test(c)),m:row.findIndex(c=>/^Mục tiêu/i.test(c))};if(!head)head={y:row[map.y]||'Yêu cầu cần đạt',m:row[map.m]||'Mục tiêu giáo dục'};continue}
        if(!map||map.code<0)continue;

        if(seen.has(code)){dup.push(code);continue}seen.add(code);

      }
    }
  }
  return{ageText,age:ageKey(ageText),head,items,doms,dup};
}

async function clearYccd(age){

  for(let i=0;i<ids.length;i+=400){const b=S.db.batch();ids.slice(i,i+400).forEach(id=>b.delete(S.db.doc('yccd/'+id)));await b.commit()}

  for(let i=0;i<ops.length;i+=400){const b=S.db.batch();ops.slice(i,i+400).forEach(o=>o(b));await b.commit()}
  await S.db.doc('yccdMeta/'+age).set({age,group:K,head:p.head||null,count:p.items.length,doms:p.doms.map(([d,n])=>({d,n})),fileId:src.id||'',fileTitle:src.title||'',fileVersion:src.version||'',fileName:src.fileName||'',updatedAt:now,updatedBy:S.meId||''});

}

/* ---------- KHGD năm học: dự kiến chủ đề ---------- */
const TB={nt:'Nhà trẻ',mg:'Mẫu giáo'};
const niceName=s=>{if(s!==s.toUpperCase())return s;const l=s.toLowerCase();return l.charAt(0).toUpperCase()+l.slice(1).replace(/\bmn\b/g,'MN').replace(/bác hồ/g,'Bác Hồ').replace(/\bvn\b/g,'VN').replace(/tết/g,'Tết').replace(/việt nam/g,'Việt Nam').replace(/&/g,' & ').replace(/\s+/g,' ')};
async function parseTopics(file){
  if(!await needLib('jszip'))throw new Error('Chưa tải được thư viện, kiểm tra mạng rồi thử lại');
  const zip=await JSZip.loadAsync(await file.arrayBuffer());const f=zip.file('word/document.xml');if(!f)throw new Error('not docx');
  const doc=new DOMParser().parseFromString(await f.async('string'),'application/xml');
  const NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const kids=(el,n)=>[...el.childNodes].filter(c=>c.localName===n);
  const ptxt=p=>[...p.getElementsByTagNameNS(NS,'t')].map(t=>t.textContent).join('').trim();
  const clines=tc=>[...tc.getElementsByTagNameNS(NS,'p')].map(ptxt).filter(Boolean);
  const body=doc.getElementsByTagNameNS(NS,'body')[0];
  let year='',progNote='',cur=null;const blocks=[];
  const y0=()=>+(year.split('-')[0])||+(S.year.split('-')[0]);
  const dm=(d,m,yy)=>{const Y=yy?+yy:(+m>=8?y0():y0()+1);return`${Y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
  const range=s=>{const r=[...String(s).matchAll(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/g)].map(m=>dm(m[1],m[2],m[3]));return{from:r[0]||'',to:r[1]||r[0]||''}};
  for(const el of body.childNodes){
    if(el.localName==='p'){const t=ptxt(el);if(!t)continue;
      const ym=t.match(/^Năm học:?\s*(\d{4})\s*[-–]\s*(\d{4})/i);if(ym&&!year){year=ym[1]+'-'+ym[2];continue}
      if(/^Thời gian thực hiện chương trình/i.test(t)){progNote=t;continue}
      const bm=t.match(/^\d+(\.\d+)?\.?\s*Đối với\s+(.+)$/i);if(bm){cur={block:/nhà trẻ/i.test(bm[2])?'nt':/mẫu giáo/i.test(bm[2])?'mg':'b'+blocks.length,label:'',applies:'',topics:[],events:[],totalWeeks:0};cur.label=TB[cur.block]||bm[2];continue}
      const am=t.match(/^\(\s*Áp dụng cho\s+(.+?)\s*\)$/i);if(am&&cur){cur.applies=am[1].replace(/\s+/g,' ');continue}
    }else if(el.localName==='tbl'&&cur){
      let map=null;
      for(const tr of kids(el,'tr')){
        const row=[];let g=0;
        for(const tc of kids(tr,'tc')){const pr=kids(tc,'tcPr')[0];const gs=pr&&kids(pr,'gridSpan')[0];const span=+(gs?.getAttributeNS(NS,'val')||1);const v=clines(tc);for(let k=0;k<span;k++)row[g+k]=k?null:v;g+=span}
        const T=i=>(row[i]||[]).join('\n');
        if(!map){const fi=re=>row.findIndex(c=>c&&re.test(c.join(' ')));
          if(row.some(c=>c&&/Tên chủ đề/i.test(c.join(' '))))map={no:fi(/^Stt/i),name:fi(/Tên chủ đề/i),sub:fi(/nhánh/i),wk:fi(/Số tuần/i),time:fi(/Thời gian/i)};
          else if(row.some(c=>c&&/^TUẦN$/i.test(c.join(' ').trim()))&&row.some(c=>c&&/Từ ngày/i.test(c.join(' '))))map={flat:true,wk:fi(/^TUẦN$/i),name:fi(/CHỦ ĐỀ/i),from:fi(/Từ ngày/i),to:fi(/Đến ngày/i)};
          continue}
        if(map.flat){
          const wk=T(map.wk).trim(),name=T(map.name).replace(/\s+/g,' ').trim(),fr=range(T(map.from)).from,to=range(T(map.to)).from;
          if(!name&&!fr)continue;
          const t=cur.topics[cur.topics.length-1];
          if(/^\d+$/.test(wk)&&t){const par=t.subs.length&&t.subs[t.subs.length-1].week===+wk;const cm=name.match(/\(\s*(Khối[^)]*|Lớp[^)]*)\)\s*$/i);
            t.subs.push({id:t.id+'.'+(t.subs.length+1),week:+wk,name:cm?name.slice(0,cm.index).trim():name,from:fr,to:to||fr,classes:cm?cm[1]:'',...(par?{parallel:true}:{})});continue}
          if(!fr){const k=cur.block+(cur.topics.length+1);cur.topics.push({id:k,no:cur.topics.length+1,name:name.replace(/\s+/g,' ').trim(),weeks:0,from:'',to:'',note:'',subs:[]});continue}
          const ev=/^NGH[IỈ]\s*T[EẾ]T/i.test(name)?'Nghỉ Tết Nguyên đán':niceName(name);const last=cur.events[cur.events.length-1];
          if(last&&last.name===ev&&last.after===cur.topics.length)last.to=to||fr;else cur.events.push({name:ev,from:fr,to:to||fr,after:cur.topics.length});
          continue}
        const no=T(map.no).trim();
        if(/^\d+$/.test(no)){
          const tr2=range(T(map.time));const note=(T(map.time).match(/\(([^)]*)\)/)||[])[1]||'';
          const subs=[];
          for(let line of row[map.sub]||[]){line=line.trim();
            if(/^\(/.test(line)&&!/^-/.test(line)){const inner=line.replace(/^\(|\)$/g,'').trim();subs.push({name:inner,isBreak:true,...range(inner)});continue}
            line=line.replace(/^[-–•]\s*/,'');const m=line.match(/\(\s*(\d{1,2}\/\d{1,2})\s*[-–]\s*(\d{1,2}\/\d{1,2})\s*\)/);
            if(m){const r=range(m[1]+' '+m[2]);const after=line.slice(m.index+m[0].length).replace(/^\s*[-–]\s*/,'').trim();subs.push({name:line.slice(0,m.index).trim(),...r,classes:after})}
            else{const pm=line.match(/^(.*?)\s*\(([^)]*)\)\s*$/);subs.push({name:pm?pm[1]:line,from:'',to:'',note:pm?pm[2]:''})}
          }
          const k=cur.block+no;
          cur.topics.push({id:k,no:+no,name:T(map.name).trim(),weeks:parseInt(T(map.wk))||0,...tr2,note,subs:(n=>subs.map(s=>s.isBreak?s:{id:k+'.'+(++n),...s}))(0)});
        }else{
          const label=(row.find((c,i)=>c&&c.length&&i!==map.time)||[]).join(' ').trim();
          if(/Tổng số tuần/i.test(label)){cur.totalWeeks=parseInt(T(map.wk))||0;continue}
          if(label)cur.events.push({name:label,...range(T(map.time)),after:cur.topics.length});
        }
      }
      if(map?.flat){cur.topics=cur.topics.filter(t=>t.subs.length);cur.topics.forEach((t,i)=>{t.no=i+1;t.from=t.subs[0].from;t.to=t.subs.reduce((a,x)=>x.to>a?x.to:a,'');t.weeks=new Set(t.subs.map(x=>x.week)).size});const ws=cur.topics.flatMap(t=>t.subs.map(x=>x.week));cur.totalWeeks=new Set(ws).size;cur.maxWeek=Math.max(...ws)}
      if(cur.topics.length){cur.subCount=cur.topics.reduce((a,t)=>a+t.subs.filter(s=>!s.isBreak).length,0);blocks.push(cur)}cur=null;
    }
  }
  return{year,progNote,blocks,items:blocks.flatMap(b=>b.topics)};
}
async function parseTopicsXlsx(file,block){
  await needLib('xlsx');
  if(!window.XLSX)throw new Error('no xlsx');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sn=wb.SheetNames.find(n=>n.replace(/\s/g,'').toUpperCase()==='CHUDE');if(!sn)return{err:'Không thấy sheet CHUDE (hoặc CHU DE) trong file này.'};
  const g=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  const str=v=>String(v??'').replace(/\s+/g,' ').trim();
  const iso=v=>{if(typeof v==='number'&&v>20000){const d=XLSX.SSF.parse_date_code(v);return`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
    const m=str(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return'';const Y=m[3].length===2?'20'+m[3]:m[3];return`${Y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};
  let year='',applies='';const notes=[];
  for(const r of g.slice(0,10)){const a=str(r[0]);
    const ym=a.match(/Năm học:?\s*(\d{4})\s*[-–]\s*(\d{4})/i);if(ym)year=ym[1]+'-'+ym[2];
    const km=a.match(/^Khối\s*:?\s*(.+)$/i);if(km)applies=km[1];
    if(/^Tuần$/i.test(a))break;
    const b=str(r[1]).replace(/\s*\d{4}\s*[-–]\s*\d{4}$/,'');if(/^(Ngày|Nghỉ)/i.test(b)&&r[2]!==''){const v=r[2];notes.push(b+': '+(typeof v==='number'?fmtD(iso(v)):str(v)))}}
  const cur={block,label:TB[block],applies,topics:[],events:[],totalWeeks:0};
  for(const r of g.slice(10,60)){
    const wk=str(r[0]),name=str(r[1]),fr=iso(r[2]),to=iso(r[3])||fr,own=str(r[4]);
    if(!name||/^Tuần$/i.test(wk))continue;
    const t=cur.topics[cur.topics.length-1];
    if(/^\d+$/.test(wk)&&t){const par=t.subs.length&&t.subs[t.subs.length-1].week===+wk;
      t.subs.push({id:t.id+'.'+(t.subs.length+1),week:+wk,name,from:fr,to,classes:'',...(own?{owner:own}:{}),...(par?{parallel:true}:{})});continue}
    if(!fr){const k=block+(cur.topics.length+1);cur.topics.push({id:k,no:cur.topics.length+1,name:name.replace(/^\d+\s*\.\s*/,''),owner:own,weeks:0,from:'',to:'',note:'',subs:[]});continue}
    const ev=/^NGH[IỈ]\s*T[EẾ]T/i.test(name)?'Nghỉ Tết Nguyên đán':name;const last=cur.events[cur.events.length-1];
    if(last&&last.name===ev&&last.after===cur.topics.length)last.to=to;else cur.events.push({name:ev,from:fr,to,after:cur.topics.length});
  }
  cur.topics=cur.topics.filter(t=>t.subs.length);
  if(!cur.topics.length)return{err:'Không đọc được chủ đề nào từ sheet CHUDE (dòng 11 – 60).'};
  cur.topics.forEach((t,i)=>{t.no=i+1;t.from=t.subs[0].from;t.to=t.subs.reduce((a,x)=>x.to>a?x.to:a,'');t.weeks=new Set(t.subs.map(x=>x.week)).size});
  const ws=cur.topics.flatMap(t=>t.subs.map(x=>x.week));cur.totalWeeks=new Set(ws).size;cur.maxWeek=Math.max(...ws);
  cur.subCount=cur.topics.reduce((a,t)=>a+t.subs.length,0);
  return{year,progNote:notes.join('; '),blocks:[cur]};
}

const toISO=v=>{if(!v)return'';if(v instanceof Date&&!isNaN(v))return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;const m=String(v).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;const m2=String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:''};
async function readStaffFile(file){
  await needLib('xlsx');
  if(!window.XLSX){toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng');return}
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames.find(n=>n.trim().toUpperCase()==='GV')||wb.SheetNames[0]];
  const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const norm=t=>String(t||'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
  const hi=grid.findIndex(r=>r.some(c=>norm(c)==='email'));
  if(hi<0){toast('Không tìm thấy dòng tiêu đề có cột Email');return}
  const H=grid[hi].map(norm);
  const col=(...names)=>H.findIndex(h=>names.some(n=>h===n||h.includes(n)));
  const c={code:col('mã nhân viên','mã nv'),cls:col('mã lớp'),name:col('tên nhân viên','họ và tên','họ tên'),email:col('email'),dob:col('ngày sinh'),pos:col('chức vụ')};
  const seen=new Set();const rows=[];
  grid.slice(hi+1).forEach((r,i)=>{
    const g=k=>c[k]>=0?r[c[k]]:'';
    const name=String(g('name')).trim(),email=String(g('email')).trim().toLowerCase();
    if(!name&&!email)return;
    const row={line:hi+i+2,code:String(g('code')).trim(),classCode:String(g('cls')).trim().toUpperCase(),name,email,dob:toISO(g('dob')),position:normPosition(g('pos'))};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))Object.assign(row,{kind:'error',err:'Email không hợp lệ'});
    else if(!name)Object.assign(row,{kind:'error',err:'Thiếu họ tên'});
    else if(seen.has(email))Object.assign(row,{kind:'error',err:'Trùng email trong file'});
    else row.kind=S.staff.some(x=>x.id===email)?'update':'new';
    seen.add(email);rows.push(row);
  });
  S.importPreview={file:file.name,rows};lastKey='';render();
}
async function confirmImport(){
  const ok=S.importPreview.rows.filter(r=>r.kind!=='error');
  const newCodes=[...new Set(ok.map(r=>r.classCode).filter(Boolean))].filter(v=>!classCodes().includes(v));
  const newPos=[...new Set(ok.map(r=>r.position).filter(Boolean))].filter(v=>!positions().includes(v));
  await guard(async()=>{
    for(let i=0;i<ok.length;i+=400){const b=S.db.batch();for(const r of ok.slice(i,i+400)){const ex=S.staff.find(x=>x.id===r.email);b.set(S.db.doc('staff/'+r.email),{code:r.code,classCode:r.classCode,name:r.name,email:r.email,dob:r.dob,position:r.position,status:ex?.status||'active',deptId:ex?.deptId||'',updatedAt:new Date().toISOString()},{merge:true})}await b.commit()}
    if(newCodes.length||newPos.length||!S.catalog)await S.db.doc('settings/catalog').set({classCodes:[...classCodes(),...newCodes],positions:[...positions(),...newPos]},{merge:true});
  },`Đã nhập ${ok.length} người`);
  S.importPreview=null;lastKey='';render();
}

const WF_DIRS=['01. KHGD nhà trường','02. KHGD năm học','03. KHGD lớp','04. Phân giải YCCĐ','05. KH chủ đề','06. KH tuần','07. Giáo án','08. Đánh giá trẻ','09. Đánh giá NLGV'];

async function wfIdb(mode,fn){const db=await wfDb();return new Promise((res,rej)=>{const t=db.transaction('h',mode);const r=fn(t.objectStore('h'));t.oncomplete=()=>res(r?.result);t.onerror=()=>rej(t.error)})}

function wfSub(name){
  const v=S.view,a=typeof S.arg==='string'?S.arg:'';
  if(v==='school')return{ctgd:0,namhoc:1,lop:2,yccd_nt:3,yccd_mg:3}[a]??-1;

const wfKy=n=>String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/\s+/g,'');

async function wfSubDir(h,i,create){const want=WF_DIRS[i],no=i+1;let own='',app='';
  try{for await(const [n,e] of h.entries())if(e.kind==='directory'&&wfNo(n)===no){if(wfKy(n)===wfKy(want))app=n;else if(!own||n<own)own=n}}catch(e){}
  const name=own||app||want;return(own||app||create)?await h.getDirectoryHandle(name,{create:name===want}):null}
async function wfMkdirs(h){for(let i=0;i<WF_DIRS.length;i++)await wfSubDir(h,i,true)}

async function dlSave(blob,name){

  try{const h=await wfGet();if(h){let perm=await h.queryPermission({mode:'readwrite'});if(perm!=='granted')try{perm=await h.requestPermission({mode:'readwrite'})}catch(e){}
    if(perm==='granted'){const i=wfSub(name),dir=i<0?h:await wfSubDir(h,i,true);
      const dot=name.lastIndexOf('.'),base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';let fn=name;
      for(let k=2;k<100;k++){try{await dir.getFileHandle(fn);fn=`${base} (${k})${ext}`}catch(e){break}}
      const w=await(await dir.getFileHandle(fn,{create:true})).createWritable();await w.write(blob);await w.close();
      const rel=`${i<0?'':dir.name+'\\'}${fn}`;toastOpen(`Đã lưu vào ${h.name}\\${rel}`,rel,h.name);return}
    toast('Chưa được phép ghi vào thư mục làm việc, file tải về thư mục Tải về')}}
  catch(e){console.warn('dlSave',e)}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}

function wfOpen(full){
  try{navigator.clipboard?.writeText(full)}catch(e){}
  const app=/\.docx?$/i.test(full)?'ms-word':/\.xls[xm]?$/i.test(full)?'ms-excel':'';
  if(app)location.href=`${app}:ofe|u|file:///${full.replace(/\\/g,'/').split('/').map(encodeURIComponent).join('/').replace(/^([A-Za-z])%3A/,'$1:')}`;
  toast(app?'Đang mở file. Nếu không thấy mở, cô dán đường dẫn đã chép vào ô tìm kiếm của Windows':'Đã chép đường dẫn file, cô dán vào ô tìm kiếm của Windows để mở');
}

// Đường dẫn cô dán có thể là thư mục con (ví dụ …\CHUYEN MON\06. KH tuần): cắt về đúng thư mục làm việc để khỏi lặp tên thư mục con.
function wfFix(root,rel,dir){const seg=root.split(/[\\/]+/),lo=x=>x.toLowerCase();const i=dir?seg.map(lo).lastIndexOf(lo(dir)):-1;if(i>0)return seg.slice(0,i+1).join('\\');
  const r=rel.split(/[\\/]+/);for(let k=Math.min(r.length-1,seg.length-1);k>0;k--)if(seg.slice(-k).map(lo).join('/')===r.slice(0,k).map(lo).join('/'))return seg.slice(0,-k).join('\\');return root}
function toastOpen(msg,rel,dir){const e=$('#toast');e.innerHTML=`<span>${esc(msg)}</span><button type="button" class="btn sm pri" data-wfopen>Mở file</button><button type="button" class="toast-x" aria-label="Đóng">×</button>`;e.hidden=false;
  e.onclick=ev=>{if(ev.target.closest('[data-wfopen]')){let root=wfPath();
      if(!root){root=(prompt(`Lần đầu mở file: cô dán đường dẫn đầy đủ của thư mục “${dir}” trên máy (mở thư mục trong File Explorer, bấm vào thanh địa chỉ rồi chép), ví dụ D:\\${dir}. App nhớ cho lần sau.`,'')||'').trim().replace(/^"|"$/g,'').replace(/[\\/]+$/,'');
        if(!root)return}
      const fx=wfFix(root,rel,dir);if(fx!==wfPath()){try{localStorage.setItem(wfPathKey(),fx)}catch(er){}}wfOpen(fx+'\\'+rel)}else{clearTimeout(toast.h);e.hidden=true}};clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,15000)}

// Chữ ký của từng người ở signatures/{email} {png,name}: mọi người trong trường đọc được để app tự chèn vào ô ký
// (Giáo viên lớp, Hiệu phó, Hiệu trưởng) khi xuất Word, Excel, bản in. Người chưa tải chữ ký thì ô ký để trống như cũ.
const sigCache=new Map();// email -> {png,b64,w,h} | null
const sigNorm=t=>String(t||'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
const sigEmailOf=name=>{const n=sigNorm(name);return n?S.staff.find(x=>sigNorm(x.name)===n)?.id||'':''};
function sigWH(b64){const s=atob(b64.slice(0,44)),u=i=>((s.charCodeAt(i)<<24)|(s.charCodeAt(i+1)<<16)|(s.charCodeAt(i+2)<<8)|s.charCodeAt(i+3))>>>0;return{w:u(16)||1,h:u(20)||1}}
const sigOfPng=png=>png&&png.startsWith('data:image/png;base64,')?(b=>({png,b64:b,...sigWH(b)}))(png.split(',')[1]):null;
async function sigGet(email){
  if(!email||!S.db)return null;if(sigCache.has(email))return sigCache.get(email);
  let v=null;try{const d=await S.db.doc('signatures/'+email).get();v=sigOfPng(d.exists?d.data().png:'')}catch(e){console.warn('sig',e)}
  sigCache.set(email,v);return v;
}
// Nạp trước chữ ký theo họ tên; sau đó sigBy(tên) dùng được ngay khi dựng file.
async function sigsLoad(names){for(const n of new Set(names.filter(Boolean)))await sigGet(sigEmailOf(n))}
const sigBy=n=>sigCache.get(sigEmailOf(n))||null;
const sigFit=(s,hEmu=480000,maxW=1600000)=>{const cx=Math.min(maxW,Math.round(hEmu*s.w/s.h));return{cx,cy:Math.round(cx*s.h/s.w)}};
// Ảnh chữ ký trong bản in, bản xem (HTML).
function sigHtml(names,empty){const im=names.map(sigBy).filter(Boolean);return im.length?`<div style="height:38pt;display:flex;justify-content:center;align-items:center;gap:6pt">${im.map(s=>`<img src="${s.png}" alt="Chữ ký" style="max-height:36pt;max-width:46mm">`).join('')}</div>`:empty}
// Một run ảnh nhúng trong Word (docx). rid trỏ tới word/media/<rid>.png trong document.xml.rels.
function sigDocxRun(rid,n,s){const {cx,cy}=sigFit(s);return`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${900+n}" name="Chu ky ${n}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${900+n}" name="${rid}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`}
// Gắn ảnh chữ ký vào các trang tính đã có trong file Excel (JSZip). pics: [{sheet:1, col:0-based, row:0-based, colsPx:[độ rộng px các cột của ô gộp], names:[...]}]
async function sigXlsx(z,pics){
  const REL='http://schemas.openxmlformats.org/officeDocument/2006/relationships/',XDR='http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing';
  const by={};for(const p of pics){const im=p.names.map(sigBy).filter(Boolean);if(im.length)(by[p.sheet]=by[p.sheet]||[]).push({...p,im})}
  if(!Object.keys(by).length)return;
  let ct=await z.file('[Content_Types].xml').async('string');if(!/Extension="png"/.test(ct))ct=ct.replace('<Default Extension="xml"','<Default Extension="png" ContentType="image/png"/><Default Extension="xml"');
  let nImg=0;
  for(const [sh,list] of Object.entries(by)){
    const sp=`xl/worksheets/sheet${sh}.xml`,srp=`xl/worksheets/_rels/sheet${sh}.xml.rels`;let sx=await z.file(sp).async('string');
    let srels=z.file(srp)?await z.file(srp).async('string'):`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;
    let dPath,dx,drels;const m=sx.match(/<drawing r:id="([^"]+)"\/>/);
    if(m){const t=srels.match(new RegExp(`Id="${m[1]}"[^>]*Target="\\.\\./drawings/([^"]+)"`))||srels.match(new RegExp(`Target="\\.\\./drawings/([^"]+)"[^>]*Id="${m[1]}"`));dPath='xl/drawings/'+t[1];dx=await z.file(dPath).async('string')}
    else{dPath=`xl/drawings/drawingSig${sh}.xml`;dx=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="${XDR}" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="${REL.slice(0,-1)}"></xdr:wsDr>`;
      sx=sx.replace('</worksheet>','<drawing r:id="rIdSig"/></worksheet>');srels=srels.replace('</Relationships>',`<Relationship Id="rIdSig" Type="${REL}drawing" Target="../drawings/${dPath.split('/').pop()}"/></Relationships>`);
      ct=ct.replace('</Types>',`<Override PartName="/${dPath}" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>`)}
    const drp=dPath.replace('xl/drawings/','xl/drawings/_rels/')+'.rels';
    drels=z.file(drp)?await z.file(drp).async('string'):`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;
    let anc='';
    for(const p of list){const fit=p.im.map(s=>sigFit(s,520000,1500000));const tot=fit.reduce((a,f)=>a+f.cx,0)+(fit.length-1)*60000;
      let x=Math.max(0,Math.round(((p.colsPx||[]).reduce((a,b)=>a+b,0)*9525-tot)/2));
      p.im.forEach((s,i)=>{const id='rIdSg'+(++nImg),nm=`chuky${sh}_${nImg}.png`;z.file('xl/media/'+nm,s.b64,{base64:true});
        drels=drels.replace('</Relationships>',`<Relationship Id="${id}" Type="${REL}image" Target="../media/${nm}"/></Relationships>`);
        const {cx,cy}=fit[i];anc+=`<xdr:oneCellAnchor><xdr:from><xdr:col>${p.col}</xdr:col><xdr:colOff>${x}</xdr:colOff><xdr:row>${p.row}</xdr:row><xdr:rowOff>40000</xdr:rowOff></xdr:from><xdr:ext cx="${cx}" cy="${cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${500+nImg}" name="Chu ky ${nImg}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="${id}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`;x+=cx+60000})}
    if(!/xmlns:r=/.test(dx.slice(0,400)))dx=dx.replace('<xdr:wsDr ',`<xdr:wsDr xmlns:r="${REL.slice(0,-1)}" `);
    z.file(dPath,dx.replace('</xdr:wsDr>',anc+'</xdr:wsDr>'));z.file(drp,drels);z.file(sp,sx);z.file(srp,srels);
  }
  z.file('[Content_Types].xml',ct);
}
// Word dạng HTML (.doc) có ảnh: đóng gói MHTML để Word hiện được ảnh chữ ký.
function sigMht(html,imgs){
  const B='----=_RoseKids_'+Date.now().toString(36),wrap=s=>s.replace(/.{76}/g,'$&\r\n');
  const b64u=s=>btoa(unescape(encodeURIComponent(s)));
  return[`MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${B}"; type="text/html"\r\n\r\n--${B}\r\nContent-Location: file:///C:/rosekids/phieu.htm\r\nContent-Transfer-Encoding: base64\r\nContent-Type: text/html; charset="utf-8"\r\n\r\n${wrap(b64u(html))}\r\n`,
    ...imgs.map(([nm,b64])=>`--${B}\r\nContent-Location: file:///C:/rosekids/${nm}\r\nContent-Transfer-Encoding: base64\r\nContent-Type: image/png\r\n\r\n${wrap(b64)}\r\n`),`--${B}--\r\n`].join('');
}

async function sigClean(file){
  let img;try{img=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){img=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Ảnh không đọc được'))};i.src=u})}
  const r=Math.min(1,1200/Math.max(img.width,img.height)),w=Math.round(img.width*r),h=Math.round(img.height*r);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
  const d=cx.getImageData(0,0,w,h),px=d.data,L=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)L[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
  const srt=Float32Array.from(L).sort(),paper=srt[Math.floor(srt.length*.6)];
  const hi=paper*.82,lo=paper*.45;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,a=L[i]>=hi?0:L[i]<=lo?255:Math.round(255*(hi-L[i])/(hi-lo));
    px[i*4+3]=a;if(a>60){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)throw new Error('Không thấy nét chữ ký trong ảnh');
  cx.putImageData(d,0,0);const pd=8;x0=Math.max(0,x0-pd);y0=Math.max(0,y0-pd);x1=Math.min(w-1,x1+pd);y1=Math.min(h-1,y1+pd);
  const cw=x1-x0+1,ch=y1-y0+1,k=Math.min(1,160/ch,600/cw),o=document.createElement('canvas');o.width=Math.round(cw*k);o.height=Math.round(ch*k);
  o.getContext('2d').drawImage(cv,x0,y0,cw,ch,0,0,o.width,o.height);return o.toDataURL('image/png');
}

async function readClassFile(file){
  await needLib('xlsx');
  if(!window.XLSX){toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng');return}
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sn=wb.SheetNames.find(n=>n.trim().toUpperCase()==='DSLOP')||wb.SheetNames.find(n=>n.trim().toUpperCase()!=='GV')||wb.SheetNames[0];
  const grid=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
  const norm=t=>String(t||'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
  const hi=grid.findIndex(r=>r.some(c=>norm(c)==='mã lớp'));
  if(hi<0){toast('Không tìm thấy dòng tiêu đề có cột Mã lớp');return}
  const H=grid[hi].map(norm);const ix=n=>H.indexOf(n);
  const c={code:ix('mã lớp'),name:ix('tên lớp'),block:ix('khối')};
  const seen=new Set();const rows=[];
  grid.slice(hi+1).forEach((r,i)=>{
    const code=String(r[c.code]||'').trim().toUpperCase(),name=String(c.name>=0?r[c.name]:'').trim(),rawB=c.block>=0?r[c.block]:'';
    if(!code&&!name)return;
    const row={line:hi+i+2,code,name,block:normBlock(rawB)||String(rawB).trim()};
    if(!code)Object.assign(row,{kind:'error',err:'Thiếu mã lớp'});
    else if(!/^[A-Za-z0-9_\-]+$/.test(code))Object.assign(row,{kind:'error',err:'Mã lớp chỉ dùng chữ, số'});
    else if(!name)Object.assign(row,{kind:'error',err:'Thiếu tên lớp'});
    else if(!normBlock(rawB))Object.assign(row,{kind:'error',err:'Khối phải là Văn phòng, Nhà trẻ hoặc Mẫu giáo'});
    else if(seen.has(code))Object.assign(row,{kind:'error',err:'Trùng mã lớp trong file'});
    else row.kind=S.classes.some(x=>x.id===code)?'update':'new';
    seen.add(code);rows.push(row);
  });
  S.clsImport={file:file.name,rows};lastKey='';render();
}

async function saveCls(){
  const v=id=>document.getElementById(id).value.trim();

  const code=(ed?ed.code||ed.id:v('cCode')).toUpperCase(),name=v('cName2');
  if(!code||!/^[A-Za-z0-9_\-]+$/.test(code)){toast('Mã lớp chỉ dùng chữ và số, không dấu cách');return}
  if(!name){toast('Nhập tên lớp');return}
  if(!ed&&S.classes.some(c=>c.id===code||c.code===code)){toast('Mã lớp này đã có');return}

  S.clsEdit=null;lastKey='';render();
}

async function costLoad(){
  const c=S.cost;c.busy=true;c.key=c.from+'|'+c.to;

    c.logs=a.docs.map(d=>d.data());c.manual=m.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.date||'').localeCompare(x.date||''));c.err='';
  }catch(e){console.warn(e);c.logs=[];c.manual=[];c.err=/permission/i.test(e.message||'')?'Firebase chưa cho đọc nhật ký chi phí: cô dán bản firestore.rules mới vào Firebase (Firestore → Rules → Publish) rồi tải lại trang.':'Không tải được số liệu ('+(e.message||e)+').'}
  c.busy=false;lastKey='';render();
}

async function exportPlan(id){
  const p=S.plans.find(x=>x.id===id);if(!p)return;const L=LV[p.level];const d=p.data||{};
  const para=t=>esc(t||'').replace(/\n/g,'<br>');
  let body=`${['truong','namhoc'].includes(p.level)?`<table style="border:none"><tr><td style="border:none">${prmHead()}</td></tr></table>`:''}<h1 style="text-align:center">${esc(p.title)}</h1><p><b>Năm học:</b> ${esc(p.year)}${p.classId?` &nbsp; <b>Lớp:</b> ${esc(clsName(p.classId))}`:''}${p.ageGroup?` &nbsp; <b>Độ tuổi:</b> ${esc(p.ageGroup)}`:''}</p>`;
  for(const [k,label] of L.fields){
    if(k==='DOMAINS')body+=`<h2>${esc(label)}</h2>`+DOMAINS.map(([dk,dl])=>`<h3>${dl}</h3><p>${para(d['dm_'+dk])}</p>`).join('');
    else if(k==='GRID')body+=`<h2>${esc(label)}</h2><table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%"><tr><th>Hoạt động</th>${WEEK_COLS.map(c=>`<th>${c}</th>`).join('')}</tr>${WEEK_ROWS.map((r,ri)=>`<tr><td><b>${r}</b></td>${WEEK_COLS.map((c,ci)=>`<td>${para(d.grid?.[ri+'_'+ci])}</td>`).join('')}</tr>`).join('')}</table>`;
    else if(k==='LINHVUC')body+=`<p><b>${esc(label)}:</b> ${esc(Object.fromEntries(DOMAINS)[d.linh_vuc]||'')}</p>`;
    else body+=`<h2>${esc(label)}</h2><p>${para(d[k])}</p>`;
  }
  const html=`<html><head><meta charset="utf-8"><style>body{font-family:"Times New Roman";font-size:13pt}h1{font-size:16pt}h2{font-size:14pt}h3{font-size:13pt}</style></head><body>${body}</body></html>`;

  const name=(p.title||'ke-hoach').replace(/[\\/:*?"<>|]/g,'-').slice(0,80);
  dlSave(new Blob(['\ufeff'+html],{type:'application/msword'}),name+'.doc');
}
