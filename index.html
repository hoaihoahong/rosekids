<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hệ sinh thái RoseKids</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b23a5b">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RoseKids">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Dancing+Script:wght@700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: a garden-notebook app. Left rail of modules (top tabs on phones), working sheet on the right. */
:root{
  --bg:#fbf7f6; --sheet:#ffffff; --ink:#2b1f22; --muted:#76656a; --line:#ecdfe0;
  --rose:#b23a5b; --rose-soft:#f8e3e9; --leaf:#3f7a52; --leaf-soft:#e3f1e6;
  --sun:#a86a12; --sun-soft:#fbefd9; --sky:#2f6a8f; --sky-soft:#e1eef6;
  --display:"Lora",Georgia,"Times New Roman",serif;
  --body:"RK So","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1517; --sheet:#251c1f; --ink:#f3e9eb; --muted:#b7a3a8; --line:#3a2d31;
  --rose:#ec7d9a; --rose-soft:#43232d; --leaf:#80c595; --leaf-soft:#20352a;
  --sun:#e3b066; --sun-soft:#3d2e17; --sky:#82bde0; --sky-soft:#1b2f3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1517; --sheet:#251c1f; --ink:#f3e9eb; --muted:#b7a3a8; --line:#3a2d31;
  --rose:#ec7d9a; --rose-soft:#43232d; --leaf:#80c595; --leaf-soft:#20352a;
  --sun:#e3b066; --sun-soft:#3d2e17; --sky:#82bde0; --sky-soft:#1b2f3c; color-scheme:dark}
*{box-sizing:border-box}
/* Chữ số lấy từ phông hệ thống có số rộng đều (Be Vietnam Pro của Google Fonts không có số rộng đều), để ngày tháng thẳng cột. */
@font-face{font-family:"RK So";font-weight:100 500;src:local("Segoe UI"),local("SegoeUI"),local("Arial"),local("ArialMT"),local("Roboto"),local("Helvetica");size-adjust:106%;unicode-range:U+0030-0039}
@font-face{font-family:"RK So";font-weight:600 900;src:local("Segoe UI Semibold"),local("SegoeUI-Semibold"),local("Arial Bold"),local("Arial-BoldMT"),local("Roboto Bold"),local("Roboto-Bold"),local("Helvetica Bold");size-adjust:106%;unicode-range:U+0030-0039}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.5rem} h3{font-size:1.1rem}
.app{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--sheet)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.4rem;display:block;color:var(--rose)}
.brand small{color:var(--muted);font-size:.85rem;font-weight:500}
.navs{display:flex;flex-direction:column;gap:16px}
.navgroup{display:flex;flex-direction:column;gap:3px}
.navgroup>span{display:flex;align-items:center;gap:8px;font-size:10.5pt;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--rose);padding:4px 10px 7px;margin-bottom:3px;border-bottom:2px solid var(--rose-soft)}
.navgroup>span::before{content:"";width:5px;height:15px;border-radius:3px;background:var(--rose);flex:none}
.nav{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;font-size:12.5pt;font-weight:600;color:var(--ink);border-left:3px solid transparent}
.nav:hover{background:var(--rose-soft);border-left-color:var(--rose)}
.nav:focus-visible{outline:2px solid var(--rose)}
.nav.on{background:var(--rose);color:#fff;border-left-color:var(--rose);box-shadow:0 2px 8px rgba(178,58,91,.28)}
.nav em{font-style:normal;font-size:10pt;font-weight:700;font-variant-numeric:tabular-nums;background:var(--rose-soft);color:var(--rose);border-radius:999px;padding:1px 9px;min-width:12px;text-align:center}
.nav.on em{background:rgba(255,255,255,.25);color:#fff}
.main{padding-block:22px 60px;padding-inline:clamp(16px,3vw,40px);min-width:0}
.main{position:relative}
/* Góc phải trên cùng: tên, chức vụ, năm học, Đăng xuất. Trang chủ: nằm cùng hàng tiêu đề, sau nút Hôm nay có gì? */
.topbar{display:flex;justify-content:flex-end;margin:-12px 0 12px}
.main.is-home .topbar{position:absolute;top:10px;right:clamp(16px,3vw,40px);margin:0;z-index:2}
.main.is-home .db-head{padding-right:var(--whoW,0px);flex-wrap:nowrap}.main.is-home .who-yl{display:none}
.kt-page .main.is-home .db-head h2,.main.is-home .kt-page .db-head h2{font-size:clamp(12pt,1.1vw,16pt)!important;white-space:nowrap}
.main.is-home .db-today{padding:6px 12px;white-space:nowrap;flex:none;font-size:10.5pt}.main.is-home .db-today svg{width:17px;height:17px}.main.is-home .who{padding:3px 4px 3px 10px;gap:8px}.main.is-home .who-me b{font-size:.88rem}.main.is-home .who-me span{font-size:.75rem}.main.is-home .who-yr select{font-size:.8rem;padding:2px 18px 2px 5px}.main.is-home .btn.who-out{font-size:.8rem;padding:4px 10px}.main.is-home .db-head h2{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1380px){.main.is-home .topbar{position:static;margin:-12px 0 12px}.main.is-home .db-head{padding-right:0;flex-wrap:wrap}.main.is-home .who-yl{display:inline}.main.is-home .db-head h2{white-space:normal}}
.who{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border-radius:999px;background:linear-gradient(135deg,var(--rose-soft),var(--sky-soft));border:1px solid var(--line)}
.who:empty{display:none}
.who-me{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.who-me b{color:var(--rose);font-size:.95rem;white-space:nowrap}
.who-me span{color:var(--sky);font-weight:600;font-size:.8rem;white-space:nowrap}
.who-row{display:flex;gap:6px;align-items:center}
.who-yr{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--leaf);font-size:.85rem;white-space:nowrap}
.who-yr select{font-weight:700;color:var(--leaf);border:2px solid var(--leaf);padding:3px 22px 3px 6px;width:auto;font-size:.85rem;border-radius:999px}
.btn.who-out{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;padding:5px 12px;white-space:nowrap;font-size:.85rem;border-radius:999px}
.btn.who-out:hover{background:#9c2f4e;border-color:#9c2f4e}
select,input[type=text],input[type=date],input[type=month],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.5}
select:focus,input:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:-1px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 14px;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--rose)}
.btn:focus-visible{outline:2px solid var(--rose)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.warn{color:var(--rose)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* Bộ màu nút chuẩn của cả hệ thống: app tự tô theo chức năng ghi trên nút (xem btnTint). */
:root{--b-save:#2e7d4f;--b-ai:#6a45b0;--b-out:#1f6aa5;--b-edit:#a8620a;--b-undo:#6b6266;--b-del:#c0392b}
.btn.b-save,.btn.b-ai,.btn.b-out,.btn.b-edit,.btn.b-undo,.btn.b-del{color:#fff;font-weight:600}
.btn.b-save{background:var(--b-save);border-color:var(--b-save)}
.btn.b-ai{background:var(--b-ai);border-color:var(--b-ai)}
.btn.b-out{background:var(--b-out);border-color:var(--b-out)}
.btn.b-edit{background:var(--b-edit);border-color:var(--b-edit)}
.btn.b-undo{background:var(--b-undo);border-color:var(--b-undo)}
.btn.b-del{background:var(--b-del);border-color:var(--b-del)}
.btn.b-save:hover,.btn.b-ai:hover,.btn.b-out:hover,.btn.b-edit:hover,.btn.b-undo:hover,.btn.b-del:hover{filter:brightness(1.12);border-color:transparent}
dialog.ask{border:1px solid var(--line);border-radius:14px;width:420px;box-sizing:border-box;background:var(--sheet);color:var(--ink);padding:20px 22px;max-width:min(420px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.18)}
dialog.ask::backdrop{background:rgba(0,0,0,.35)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-nhap{background:var(--line);color:var(--muted)}
.st-cho{background:var(--sun-soft);color:var(--sun)}
.st-duyet{background:var(--leaf-soft);color:var(--leaf)}
.st-sua{background:var(--rose-soft);color:var(--rose)}
.banner{border-radius:10px;padding:12px 16px;background:var(--sun-soft);color:var(--ink);font-size:.9rem;margin-bottom:16px}
/* hierarchy stem */
.stem{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.stem button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 4px;position:relative}
.stem button:focus-visible{outline:2px solid var(--rose);border-radius:8px}
.stem .bud{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);font-family:var(--display);font-weight:700;font-size:1.1rem;z-index:1;border:2px solid var(--sheet)}
.stem button:hover .bud{background:var(--rose);color:#fff}
.stem .lbl{font-size:.8rem;line-height:1.3}
.stem::before{content:"";position:absolute;left:8%;right:8%;top:29px;height:2px;background:var(--leaf);opacity:.5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.stat b{font-family:var(--display);font-size:1.6rem;display:block;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.item{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:hover{background:var(--rose-soft)}
.item:focus-visible{outline:2px solid var(--rose)}
.item .t{font-weight:600}
.item .m{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.86rem;font-weight:500;min-width:0}
label.f>span.h{font-weight:400;color:var(--muted);font-size:.78rem}
.domain{border-left:3px solid var(--leaf);padding-left:12px}
.ktgrid th,.ktgrid td{border-right:2px solid #8a6b74;border-bottom:1px solid #b9a3aa}
.ktgrid thead th{font-size:1rem}
.ktgrid tbody th{font-size:.98rem}
.mtc{border-bottom:1px dotted currentColor;cursor:help}
#tipbox{position:fixed;z-index:9999;max-width:420px;background:#fff59d;color:#000;border:1px solid #c9b400;border-radius:8px;padding:8px 10px;font-size:.9rem;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.nk-tbl{table-layout:fixed;min-width:1100px}.nk-tbl td:last-child>.row{flex-direction:column;align-items:stretch;gap:6px}.nk-tbl input[type=date]{padding:6px 8px}.nk-tbl input,.nk-tbl select{width:100%}
.nk-files{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.nk-file{display:flex;align-items:center;gap:8px;max-width:100%}
.nk-file .small{white-space:nowrap}
.nk-fname{all:unset;cursor:pointer;color:var(--sky);font-weight:600;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.nk-fname:focus-visible{outline:2px solid var(--rose)}
.nk-x{all:unset;cursor:pointer;flex:none;color:#c0392b;font-weight:700;font-size:1.05rem;line-height:1;padding:2px 6px;border-radius:6px}.nk-x:hover,.nk-x.on{background:#fbe1e1}.nk-x.on{font-size:.78rem;padding:3px 7px}.nk-x:focus-visible{outline:2px solid var(--rose)}
.nk-limg{all:unset;cursor:zoom-in;display:block;max-width:1100px}.nk-limg img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}.nk-limg:focus-visible{outline:2px solid var(--rose)}
.nk-old{border-top:1px dashed var(--line);padding-top:10px}.nk-thumbs{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}.nk-thumb{width:200px;display:flex;flex-direction:column;gap:4px}.nk-thumb img{border-radius:8px}.nk-thumb>.row{align-items:flex-start}.nk-thumb .nk-link{display:block;margin:2px 0 0}
.nk-lup{display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right}.nk-lup .row{gap:8px;justify-content:flex-end}.nk-link{all:unset;cursor:pointer;color:var(--sky);text-decoration:underline;font-size:.8rem;margin-left:4px}.nk-link:focus-visible{outline:2px solid var(--rose)}.nk-edd{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.nk-edd input{padding:3px 6px}.nk-lup .f{font-size:.82rem;flex-direction:row;align-items:center;gap:6px;display:flex}.nk-lup .f input{padding:4px 8px}.nk-lup label.btn{cursor:pointer}
.nk-up{cursor:pointer}.nk-up.is-busy{opacity:.7;cursor:progress}
.rs-t tr.rs-g td{background:var(--leaf-soft)}
.rs-box{display:inline-block;width:22px;height:22px;padding:0;border:1.5px solid var(--muted);border-radius:5px;vertical-align:middle;background:transparent;position:relative}
button.rs-box{cursor:pointer}button.rs-box:hover{border-color:var(--ink)}
.rs-box.on{border-color:transparent}.rs-box.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;line-height:1}
.rs-box.rs-l0.on{background:#3f9a5c}.rs-box.rs-l1.on{background:#d08a1e}.rs-box.rs-l2.on{background:#d6336c}
.rs-wrap{max-height:calc(100vh - 160px);overflow:auto}
.rs-tot{font-weight:700;color:var(--rose);margin-top:4px;line-height:1.3}
.rs-q{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rs-opts{display:flex;gap:6px;flex-wrap:wrap}
.rs-opt{border:2.5px solid currentColor;background:var(--sheet);border-radius:999px;padding:6px 14px;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap}
.rs-opt.rs-l0{color:#2f7d48}.rs-opt.rs-l1{color:#b06f0d}.rs-opt.rs-l2{color:#c2255c}
.rs-opt:hover{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
/* Phiếu GV: mỗi nhóm một màu (dải màu bên trái, tiêu đề nhóm có nền); chữ tiêu chí đậm. */
.rs-card{border-left:6px solid var(--gc);padding-top:0;overflow:hidden}
.rs-card .rs-gh{background:var(--gcs);margin:0 -20px;padding:12px 20px;color:var(--gc)}.rs-card .rs-gh h3{color:var(--gc)}
.rs-gc0{--gc:var(--rose);--gcs:var(--rose-soft)}.rs-gc1{--gc:var(--sky);--gcs:var(--sky-soft)}.rs-gc2{--gc:var(--leaf);--gcs:var(--leaf-soft)}.rs-gc3{--gc:var(--sun);--gcs:var(--sun-soft)}
.rs-qt{color:var(--ink);font-weight:500}.rs-qt b{color:var(--gc);font-weight:800;margin-right:2px}
.rs-gh+.rs-q{border-top:0}
.rs-opt.on{color:#fff;border-color:transparent}.rs-opt.rs-l0.on{background:#3f9a5c}.rs-opt.rs-l1.on{background:#d08a1e}.rs-opt.rs-l2.on{background:#d6336c}
.rs-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.rs-bar i{display:block;height:100%;background:var(--leaf)}
.rs-wrap thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
.rs-wrap tfoot td{position:sticky;bottom:0;background:var(--sheet);box-shadow:0 -1px 0 var(--line)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--rose-soft);font-weight:600;font-size:.8rem}
td textarea{min-height:70px;border:none;padding:4px;background:transparent}
/* Mọi trang: chữ cỡ 13pt cho dễ đọc (tiêu đề to hơn) */
.kt-page,.kt-page *{font-size:13pt!important}
.kt-page .phead,.kt-page .phead *{font-size:15pt!important}
.kt-page h2{font-size:19pt!important}.kt-page h3.kt-title,.kt-page h3.kt-title *{font-size:18pt!important}.kt-page h3.kt-title .pill{font-size:11pt!important}.kt-page .stat b{font-size:22pt!important}.kt-page .stem .bud{font-size:15pt!important}.kt-page .tog.mini{font-size:18pt!important}.kt-page .tog.mini.cg{font-size:14pt!important}.kt-page h3,.kt-page h3 *{font-size:15pt!important}
.ga-card{gap:8px;padding:10px 12px;border-radius:10px}
.ga-head{justify-content:space-between;align-items:flex-start;flex-wrap:nowrap;height:52px;overflow:hidden}
.ga-btns{display:grid;grid-template-columns:1fr auto;gap:6px}
.ga-src{white-space:pre-wrap;height:7.2em;overflow:auto;line-height:1.45}
.ga-hint{width:100%;height:160px;min-height:160px;resize:vertical}
.gaed input[type=text],.gaed textarea{font-family:inherit;font-size:.95rem;font-weight:400;line-height:1.5}
.wk{min-width:760px}
.wk td:first-child{font-weight:600;width:130px;background:var(--bg)}
.ctw{align-self:flex-start;max-width:100%}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.cgrid>*{min-width:0}
@media(max-width:900px){.cgrid{grid-template-columns:1fr}}
.chd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px}.chd h3{margin:0}
.ctot-row td{background:#ffe066!important;color:#3a2c00;font-weight:700;font-size:1.05rem}
.ctot{background:#ffe066;color:#3a2c00;border:1px solid #e3bd00;border-radius:8px;padding:4px 12px;font-size:1.05rem}
.ct{width:auto;font-size:.8rem}
.ct th,.ct td{padding:3px 6px;white-space:nowrap}
.ct td:first-child{font-weight:600;background:var(--bg)}
.ct .n{text-align:right}.ct .c{text-align:center}
.ct td.w{white-space:normal;min-width:180px;max-width:340px}
.ev td.c{text-align:center;width:88px}
.tog{all:unset;cursor:pointer;display:inline-block;min-width:68px;padding:3px 6px;border-radius:6px;font-size:.78rem;font-weight:600;background:var(--line);color:var(--muted)}
.tog.dat{background:var(--ev-ok,#3aa76d);color:var(--ev-ok-ink,#fff)}
.tog.chua{background:var(--ev-no,#e0337a);color:var(--ev-no-ink,#fff)}
.tog.cg{background:var(--ev-cg,#ffc933);color:var(--ev-cg-ink,#2b1d00)}
.tog:focus-visible{outline:2px solid var(--rose)}
.tog.mini{min-width:34px;padding:6px 8px;text-align:center;font-size:1.3rem;line-height:1;font-weight:800;border-radius:8px}
.tog.mini.dat{background:var(--ev-ok,#3aa76d);color:var(--ev-ok-ink,#fff)}

  const off=q.onSnapshot(snap=>{
    if(S.db!==db||lazyYr[col]!==yr)return;

async function dkAi(){

    classes:withKt.map(c=>({code:c.code||c.id,name:c.name,age:c.ageGroup||'',days:days[c.code||c.id].map(d=>({date:d.date,thu:d.thu,week:d.week,acts:d.acts.map(a=>`[${a.k}] ${a.label}: ${a.text}`)}))})),

  try{
    const tok=await S.auth.currentUser.getIdToken();
    const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(req)});
    const out=await r.json().catch(()=>({}));
    if(!r.ok){st.err=out.error==='Chưa hỗ trợ yêu cầu này'?'Máy chủ AI chưa được cập nhật phần lập kế hoạch đánh giá. Cô đợi Cloudflare deploy xong bản mới trên GitHub rồi thử lại.':out.error||`Máy chủ AI báo lỗi ${r.status}`;toast('AI chưa lập được');return}
    const codes=new Set(cls.map(c=>c.code||c.id));
    // Hoạt động lấy nguyên văn từ kế hoạch tuần của lớp đúng ngày AI chọn; AI chỉ chọn lớp, ngày, loại hoạt động.
    const rows=(out.plan?.rows||[]).map(x=>{const cl=codes.has(x.cls)?x.cls:(cls.find(c=>c.name===x.cls)?.code||x.cls||'');const date=dkDate(x.date);
      const a=days[cl]?.find(d=>d.date===date)?.acts.find(a=>a.k===x.kind);return{cls:cl,date,act:a?`${a.label}: ${a.text}`:String(x.activity||'').trim()}}).filter(x=>x.act);
    rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.cls).localeCompare(String(b.cls)));
    const bad=rows.filter(r=>!days[r.cls]?.some(d=>d.date===r.date)).length;
    const miss=req.noKt.length?`Lớp chưa có kế hoạch tuần trong chủ đề nên chưa lập: ${req.noKt.join(', ')}.`:'';
    st.draft={id:docId,rows,note:[out.plan?.note||'',bad?`Có ${bad} dòng không trùng ngày nào trong kế hoạch tuần của lớp, cô xem lại các dòng ghi chữ đỏ.`:'',miss].filter(Boolean).join(' '),ai:{model:out.model||'',at:new Date().toISOString()}};
    aiLog(req,out);toast('AI đã lập xong bản nháp, cô xem và sửa rồi bấm Ghi'+aiCost(out));
  }catch(e){console.warn(e);st.err='Không kết nối được máy chủ AI ('+(e.message||e)+'). Cô kiểm tra mạng rồi thử lại.';toast('Chưa kết nối được máy chủ AI')}
  finally{st.busy=false;lastKey='';render()}
}

const RSNL=[{k:'pl1',name:'PL1 – Cán bộ quản lý',pl:'PHỤ LỤC 1'},{k:'pl2',name:'PL2 – Giáo viên',pl:'PHỤ LỤC 2'}];

const rsId=()=>Math.random().toString(36).slice(2,9);
const rsKind=()=>RSNL.find(x=>x.k===S.arg)||RSNL[0];
const rsNum=n=>{const m=String(n).match(/^\s*Nhóm\s*(\d+)\s*[.:–-]?\s*/i);return m?m[0]:''};
// Đọc một trang tính: dòng tiêu đề có ô “Tiêu chí…”, các cột sau là các mức; dòng “Nhóm …” mở nhóm mới, dòng khác là tiêu chí.
function rsParseSheet(g){
  const hr=g.findIndex(r=>r.some(c=>/ti[êe]u ch[íi]/i.test(String(c))));if(hr<0)return null;
  const tc=g[hr].findIndex(c=>/ti[êe]u ch[íi]/i.test(String(c)));
  const lc=g[hr].map((c,i)=>i).filter(i=>i>tc&&String(g[hr][i]).trim());
  const levels=lc.map(i=>String(g[hr][i]).trim().replace(/\s*\n\s*/g,' – '));
  const title=g.slice(0,hr).flat().map(c=>String(c).trim()).filter(Boolean).find(t=>!/^ph[ụu] l[ụu]c/i.test(t))||'';
  const groups=[];
  for(const r of g.slice(hr+1)){
    const t=String(r[tc]??'').trim();if(!t||/^t[ổo]ng h[ợo]p/i.test(t))continue;
    if(/^nhóm\s*\d+/i.test(t)){groups.push({id:rsId(),name:t.slice(rsNum(t).length).trim()||t,items:[]});continue}
    if(!groups.length)groups.push({id:rsId(),name:'',items:[]});
    // x: cột mức có đánh dấu (x, ✓…) ở dòng tiêu chí, -1 nếu chưa đánh dấu; dùng ghi vào phiếu của người nạp.
    groups[groups.length-1].items.push({id:rsId(),text:t,x:lc.findIndex(i=>String(r[i]??'').trim())});
  }
  return groups.length?{title,levels:levels.length?levels.map(rsLv):RSNL_LV,groups}:null;
}
// Nhận diện trang nào là PL1, trang nào là PL2 (theo tên trang hoặc dòng “PHỤ LỤC 1/2”, “CÁN BỘ QUẢN LÝ”, “GV”).
async function rsReadFile(file){
  await needLib('xlsx');
  if(!window.XLSX)throw new Error('no xlsx');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const out={};
  for(const sn of wb.SheetNames){
    const g=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
    const p=rsParseSheet(g);if(!p)continue;
    const head=(sn+' '+g.slice(0,4).flat().join(' ')).toUpperCase();
    const k=/PL\s*1\b|PHỤ LỤC 1\b|QUẢN LÝ/.test(head)?'pl1':/PL\s*2\b|PHỤ LỤC 2\b|\bGV\b|GIÁO VIÊN/.test(head)?'pl2':null;
    if(k&&!out[k])out[k]={...p,sheet:sn};else if(!k&&!out._)out._={...p,sheet:sn};
  }
  if(out._){const k=rsKind().k;if(!out[k])out[k]=out._;delete out._}
  return out;
}

  S.rs=null;lastKey='';render();
}

function readForm(L){
  const v=id=>document.getElementById(id)?.value??'';
  const data={};
  for(const [k] of L.fields){
    if(k==='DOMAINS')DOMAINS.forEach(([dk])=>data['dm_'+dk]=v('f_dm_'+dk));
    else if(k==='GRID'){data.grid={};WEEK_ROWS.forEach((r,ri)=>WEEK_COLS.forEach((c,ci)=>{const x=v(`g_${ri}_${ci}`);if(x)data.grid[ri+'_'+ci]=x}))}
    else if(k==='LINHVUC')data.linh_vuc=v('f_linh_vuc');
    else data[k]=v('f_'+k);
  }
  return{year:v('h_year')||S.year,classId:v('h_cls'),ageGroup:v('h_age'),period:v('h_period'),parentId:v('h_parent'),title:v('h_title').trim(),data};
}
function autoTitle(L,f){
  const cn=f.classId?clsName(f.classId):'';
  switch(L.k){
    case'truong':return`Kế hoạch nhà trường ${f.year}`;
    case'namhoc':return`KHGD năm học ${f.year} – ${f.ageGroup||''}`;
    case'lop':return`KHGD lớp ${cn} ${f.year}`;
    case'thang':return`Kế hoạch tháng ${f.period?+f.period.slice(5):''} – ${cn}${f.data.chu_de?' – '+f.data.chu_de.split('\n')[0]:''}`;
    case'tuan':return`Tuần từ ${fmtD(f.period)} – ${cn}${f.data.chu_de?' – '+f.data.chu_de.split('\n')[0]:''}`;
    case'ngay':return`${(f.data.ten_hd||'Giáo án').split('\n')[0]} – ${cn} – ${fmtD(f.period)}`;
  }
}
async function savePlan(status){
  const a=S.arg;const p=a.id?S.plans.find(x=>x.id===a.id):null;const pl=p||a.draft;const L=LV[pl.level];
  const f=readForm(L);
  if(L.cls&&!f.classId){toast('Hãy chọn lớp');return}
  const doc={level:L.k,...f,title:f.title||autoTitle(L,f),status,...stamp()};
  if(status==='cho')doc.reviewNote='';
  await guard(async()=>{
    if(p){if(p.authorId)doc.authorId=p.authorId;await S.db.doc('plans/'+p.id).update(doc)}
    else{doc.createdAt=doc.updatedAt;const ref=await S.db.collection('plans').add(doc);S.arg={id:ref.id,saving:true};lastKey=''}
  },status==='cho'?'Đã gửi duyệt':'Đã lưu nháp');
  render();
}

",45,"Con kể lại được câu chuyện \"…\" theo tranh."],["t",45,"Con nói câu đủ ý, rõ ràng, mạch lạc."],["t",5,"Con nhận biết và phát âm đúng chữ cái …"],["t",5,"Con tô, đồ chữ đúng chiều, ngồi đúng tư thế."],["t",5,"Con biết đọc sách từ trái sang phải, từ trên xuống dưới."],["t",45,"Con biết thể hiện giọng nhân vật khi kể chuyện."],["d",0,"Con đọc, kể được khi cô gợi ý."],["c",0,"Con chưa thuộc bài thơ, cô sẽ ôn thêm cho con."],["c",0,"Con nói còn nhỏ, chưa rõ câu, cô khuyến khích con nói nhiều hơn."],["c",5,"Con còn nhầm chữ cái … với …, cô sẽ cho con ôn thêm."]]],["Tình cảm – xã hội",[["t",0,"Con mạnh dạn, tự tin khi trả lời."],["t",0,"Con biết chờ đến lượt, lắng nghe bạn nói."],["t",45,"Con nói được điều mình thích, điều mình không thích."],["t",45,"Con biết chia sẻ đồ dùng học tập với bạn."],["t",5,"Con biết nhận lỗi và sửa lỗi."],["d",0,"Con thực hiện được khi cô nhắc nhở."],["c",0,"Con còn tranh lời, chưa chờ đến lượt."]]],["Nghệ thuật (âm nhạc, tạo hình)",[["t",0,"Con hát đúng giai điệu bài hát \"…\"."],["t",45,"Con vỗ tay, gõ đệm đúng nhịp bài hát."],["t",45,"Con biểu diễn tự nhiên, có cảm xúc."],["t",3,"Con biết tô màu, nặn, dán tạo sản phẩm đơn giản."],["t",45,"Con phối hợp màu đẹp, bố cục cân đối."],["t",5,"Con tạo sản phẩm sáng tạo, nói được ý tưởng của mình."],["d",0,"Con hoàn thành sản phẩm khi cô hướng dẫn."],["c",0,"Con chưa hoàn thành sản phẩm, cô sẽ cho con làm tiếp."],["c",0,"Con còn ngại hát, ngại biểu diễn trước lớp."]]],["Năng lực chung (tự lực, giao tiếp, hợp tác, giải quyết vấn đề)",[["t",0,"Con tự lấy và cất đồ dùng học tập đúng nơi."],["t",45,"Con phối hợp tốt với bạn khi làm việc nhóm."],["t",45,"Con kiên trì thử nhiều cách khi gặp khó."],["t",5,"Con biết tự kiểm tra lại kết quả và sửa cho đúng."],["t",5,"Con nói được cách mình làm cho cô và bạn nghe."],["d",0,"Con làm được khi có cô gợi ý."],["c",0,"Con còn dễ bỏ cuộc khi gặp khó, cô động viên con."],["c",45,"Con chưa phối hợp được với bạn trong nhóm."]]],["Tiến bộ (so với trước)",[["t",0,"Con mạnh dạn phát biểu hơn trước."],["t",0,"Con tập trung lâu hơn trước."],["t",0,"Con đã làm được … mà trước đây con chưa làm được."],["t",5,"Con cầm bút, tô chữ đúng hơn trước."],["d",0,"Con có tiến bộ nhưng chưa đều, cô tiếp tục theo dõi."]]],["Câu gợi ý phối hợp với gia đình",[["p",0,"Gia đình cùng con đọc lại bài thơ, kể lại câu chuyện đã học."],["p",0,"Gia đình trò chuyện, hỏi con hôm nay học gì, khuyến khích con kể."],["p",0,"Gia đình cho con đếm đồ vật trong nhà, so sánh nhiều – ít."],["p",0,"Gia đình cho con chơi cắt, xé, nặn, xâu hạt để đôi tay khéo hơn."],["p",0,"Gia đình cùng con chơi tìm chữ cái trên sách báo, biển hiệu."],["p",0,"Gia đình khen ngợi khi con cố gắng, không so sánh con với bạn."],["p",0,"Gia đình hạn chế cho con dùng điện thoại, tăng thời gian đọc sách cùng con."]]]],"nt":[["Thái độ, hứng thú khi ra sân",[["t",0,"Con vui vẻ, hào hứng khi được ra sân chơi."],["t",0,"Con tích cực tham gia các hoạt động ngoài trời."],["t",45,"Con tự chọn khu chơi mình thích và chơi lâu."],["d",0,"Con tham gia khi được cô động viên."],["c",0,"Con còn đứng một mình, chưa tham gia cùng bạn."],["c",0,"Hôm nay con mệt, cô cho con chơi nhẹ nhàng."]]],["Quan sát, khám phá thiên nhiên",[["t",3,"Con gọi đúng tên …, nói được màu sắc, đặc điểm nổi bật."],["t",45,"Con quan sát kỹ, nói được nhiều đặc điểm của …"],["t",45,"Con so sánh được điểm giống, khác nhau giữa … và …"],["t",5,"Con nói được ích lợi của cây, con vật đối với con người."],["t",45,"Con nhận biết thời tiết nắng, mưa, nhiều mây, có gió."],["t",5,"Con đặt được câu hỏi \"vì sao\" khi quan sát."],["t",0,"Con biết chăm sóc cây, tưới nước, nhặt lá vàng cùng cô."],["d",0,"Con quan sát cùng cô, trả lời khi được gợi ý."],["c",0,"Con chưa chú ý quan sát, còn chạy chỗ khác."]]],["Trò chơi vận động, trò chơi dân gian",[["t",0,"Con hiểu và chơi đúng luật trò chơi \"…\"."],["t",0,"Con thuộc lời đồng dao khi chơi \"…\"."],["t",45,"Con chơi khéo léo, nhanh nhẹn, phối hợp tốt với đồng đội."],["t",5,"Con biết nhắc bạn chơi ,"Gia đình cho con chơi ngoài trời, đi dạo công viên vào cuối tuần."],["p",0,"Gia đình cùng con quan sát cây, hoa, con vật và trò chuyện về chúng."],["p",0,"Gia đình cho con mặc quần áo gọn, đi giày dép có quai hậu."],["p",0,"Gia đình gửi mũ, khăn lau mồ hôi, bình nước cho con."],["p",0,"Gia đình chơi cùng con trò chơi dân gian, dạy con chấp nhận thắng thua."],["p",0,"Gia đình nhắc con tránh xa ao hồ, ổ điện, chỗ nguy hiểm."]]]],"goc":[["Thái độ, chọn góc, hứng thú",[["t",0,"Con hứng thú, vui vẻ khi chơi ở các góc."],["t",0,"Con tự chọn góc chơi mình thích."],["t",45,"Con chơi tập trung, chơi đến hết giờ."],["t",5,"Con biết tự đặt kế hoạch chơi cùng bạn."],["d",0,"Con chơi được khi cô gợi ý góc chơi."],["c",0,"Con còn đi lại nhiều, chưa tập trung chơi ở góc nào."],["c",0,"Con chỉ chơi một góc, chưa thử góc khác."]]],["Góc phân vai (gia đình, cửa hàng, bác sĩ)",[["t",3,"Con biết bế em, nấu ăn, cho em ăn."],["t",45,"Con nhận vai và thể hiện đúng vai …"],["t",45,"Con biết giao tiếp với bạn theo vai chơi."],["t",5,"Con biết thỏa thuận, phân vai cùng các bạn."],["t",5,"Con biết liên kết với góc khác, như mua hàng về nấu ăn."],["d",0,"Con chơi được khi cô nhập vai cùng."],["c",0,"Con chưa thể hiện được vai chơi, cô sẽ chơi cùng con."]]],["Góc xây dựng, lắp ghép",[["t",3,"Con xếp chồng, xếp cạnh tạo thành …"],["t",45,"Con lắp ghép, xây được công trình …"],["t",45,"Con biết dùng vật liệu mở, tái chế để xây dựng."],["t",5,"Con biết bàn bạc, phân công cùng bạn xây công trình chung."],["t",45,"Con giới thiệu được công trình của mình."],["d",0,"Con xây được khi có cô hướng dẫn."],["c",0,"Con chưa hoàn thành công trình, cô động viên con."],["c",0,"Con còn làm đổ công trình của bạn."]]],["Góc học tập – khám phá (toán, chữ cái, khoa học)",[["t",3,"Con biết phân loại đồ chơi theo màu, hình."],["t",45,"Con chơi xếp số, tạo nhóm đúng số lượng."],["t",5,"Con chơi tìm chữ cái, ghép chữ theo mẫu."],["t",45,"Con thích làm thí nghiệm, nói được điều mình thấy."],["t",5,"Con biết ghi kết qu // Ghi lớp/trẻ: giữ người tạo (authorId) khi sửa để không mất quyền sửa của giáo viên.
async function pqSave(who){

}
function pqPick(kid){const P=pqS();P.kid=kid;render();const c=S.classes.find(x=>x.id===S.evCls);if(!c||!kid)return;
  const r=(pqRecs(c.code||c.id,P.date)||[]).find(x=>x.kind==='tre'&&x.childId===kid);PQ_F.forEach(([f])=>{const el=$('#pqT_'+f);if(el)el.value=pqGhi(r,f)});

/* ---------- minh chứng đánh giá trẻ ---------- */
/* Ảnh, video minh chứng: tệp gốc (ảnh đã nén) ở Firebase Storage minhchung/{năm}/{mã lớp}/{mã}.{đuôi};
   thông tin ở Firestore evidence/{mã}: lớp, chủ đề, mục tiêu (goal), các trẻ trong ảnh (kids), ảnh nhỏ xem trước (tệp {mã}_t.jpg cạnh tệp gốc, bản ghi giữ địa chỉ thumbUrl; bản ghi cũ còn thumb dạng base64 thì app tự chuyển dần).
   Ảnh nhóm gắn nhiều trẻ, ảnh cá nhân gắn một trẻ. Giáo viên của lớp và Ban giám hiệu được thêm, xoá. */
const MC_IMG=1600,MC_THUMB=360;
const mcS=()=>S.mc||(S.mc={kids:[],goal:'',files:[],note:'',date:today(),fk:'',fg:'',busy:false,docs:{},subs:{}});
// Chỉ đọc minh chứng của lớp đang chọn trong năm học (không tải cả bộ sưu tập).
function mcRecs(code){const M=mcS();if(M.db!==S.db){M.db=S.db;M.docs={};M.subs={}}const k=S.year+'|'+code;
  if(!M.subs[k]&&S.db&&code){M.subs[k]=1;unsubs.push(S.db.collection('evidence').where('cls','==',code).where('year','==',S.year).onSnapshot(s=>{M.docs[k]=s.docs.map(d=>{const t=d.data();return{id:d.id,...t,thumb:t.thumbUrl||t.thumb||null,oldThumb:!t.thumbUrl&&/^data:/.test(t.thumb||'')}}).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));renderSoon()},e=>{console.warn('evidence',e);M.docs[k]=[];renderSoon()}))}
  return M.docs[k]}
const mcVidMB=()=>Math.max(1,parseFloat(prm('mcVideoMB'))||50);
const mcVidSec=()=>Math.max(5,parseFloat(prm('mcVideoGiay'))||30);
const mcStore=()=>{try{return firebase.storage()}catch(e){console.warn(e);return null}};
// Nén ảnh về cạnh dài tối đa max điểm ảnh, xoay đúng chiều chụp; trả về Blob JPEG.
async function mcShrink(src,max,q){
  let img;try{img=await createImageBitmap(src,{imageOrientation:'from-image'})}catch(e){img=await new Promise((res,rej)=>{const u=URL.createObjectURL(src),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Ảnh không đọc được'))};i.src=u})}
  return mcDraw(img,img.width,img.height,max,q);
}
function mcDraw(img,w0,h0,max,q){const r=Math.min(1,max/Math.max(w0,h0)),w=Math.max(1,Math.round(w0*r)),h=Math.max(1,Math.round(h0*r));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
  return new Promise((res,rej)=>cv.toBlob(b=>b?res({blob:b,w,h}):rej(new Error('Không nén được ảnh')),'image/jpeg',q))}
const mcB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
// Ảnh nhỏ cất thành tệp riêng trên Storage (trình duyệt tự nhớ một năm), bản ghi chỉ giữ địa chỉ: mở Kho không phải tải ảnh nhỏ của mọi minh chứng.
const mcThumbPath=path=>String(path).replace(/\.[^./]+$/,'')+'_t.jpg';
async function mcPutThumb(st,path,blob,code){const ref=st.ref(mcThumbPath(path));
  await ref.put(blob,{contentType:'image/jpeg',cacheControl:'public,max-age=31536000',customMetadata:{cls:code,by:S.meId||''}});return{thumbUrl:await ref.getDownloadURL(),thumbPath:ref.fullPath}}
// Xoá hẳn tệp gốc và ảnh nhỏ của một minh chứng khỏi kho ảnh (tệp không còn thì coi như đã xoá).
// Trả về false nếu còn tệp chưa xoá được: khi đó giữ lại bản ghi để lần sau xoá tiếp, không để tệp mồ côi chiếm chỗ.
async function mcDelFiles(st,r,strict){let ok=true;for(const p of [r.path,r.thumbPath].filter(Boolean)){try{await st.ref(p).delete()}catch(e){if(e?.code==='storage/object-not-found')continue;if(strict)throw e;console.warn(e);ok=false}}return ok}
// Ghi nhiều minh chứng một lần (gói 450 bản ghi mỗi lượt, giới hạn của Firestore là 500): [mã, dữ liệu cần sửa] hoặc [mã, null] để xoá.
async function mcBatch(list){for(let i=0;i<list.length;i+=450){const b=S.db.batch();for(const [id,d] of list.slice(i,i+450)){const ref=S.db.doc('evidence/'+id);d?b.update(ref,d):b.delete(ref)}await b.commit()}}
// Ảnh nhỏ dạng base64 (để chèn vào file Word): bản ghi cũ có sẵn, bản ghi mới tải từ địa chỉ ảnh nhỏ.
async function mcThumbB64(r){if(/^data:/.test(r.thumb||''))return r.thumb.split(',')[1]||'';const M=mcS();M.tb64=M.tb64||{};
  if(!(r.id in M.tb64)){try{M.tb64[r.id]=String(await mcB64(await (await fetch(r.thumb)).blob())).split(',')[1]||''}catch(e){console.warn(e);return''}}return M.tb64[r.id]}
// Chuyển dần ảnh nhỏ base64 của minh chứng cũ sang Storage (chạy ngầm, một lần mỗi phiên, chỉ giáo viên lớp hoặc Ban giám hiệu).
async function mcMoveThumbs(X){const M=mcS();M.mv=M.mv||{};const code=X.code;if(!code||M.mv[code]||!canCls(code)||!X.recs)return;
  const todo=X.recs.filter(r=>r.oldThumb&&r.path);if(!todo.length)return;M.mv[code]=1;const st=mcStore();if(!st)return;
  for(const r of todo){try{const bl=await (await fetch(r.thumb)).blob();const ph=r.ph||await mcPH(bl);const t=await mcPutThumb(st,r.path,bl,r.cls||code);
      await S.db.doc('evidence/'+r.id).update({...t,thumb:firebase.firestore.FieldValue.delete(),...(r.ph?{}:{ph})})}
    catch(e){console.warn('mcMoveThumbs',e);if(e?.code==='permission-denied'||e?.code==='storage/unauthorized')break}}}
// Đọc thời lượng video và chụp một khung hình làm ảnh nhỏ (không chụp được thì để trống).
function mcVideoInfo(f){return new Promise(res=>{const u=URL.createObjectURL(f),v=document.createElement('video');let done=false;
  const end=(dur,thumb)=>{if(done)return;done=true;URL.revokeObjectURL(u);res({dur,thumb})};
  v.muted=true;v.playsInline=true;v.preload='auto';
  v.onloadedmetadata=()=>{const d=isFinite(v.duration)?v.duration:0;v.currentTime=Math.min(1,d/2||0);setTimeout(()=>end(d,null),4000)};
  v.onseeked=async()=>{try{const t=await mcDraw(v,v.videoWidth,v.videoHeight,MC_THUMB,.6);end(v.duration,await mcB64(t.blob))}catch(e){end(v.duration,null)}};
  v.onerror=()=>end(0,null);setTimeout(()=>end(0,null),10000);v.src=u})}
/* Dấu vân ảnh: ảnh giống nhau dù khác tệp (gửi qua Zalo, lưu lại, nén lại...) vẫn cho dấu gần nhau.
   Thu ảnh về 17×16 ô xám, so độ sáng từng cặp ô cạnh nhau → 256 bit. Hai ảnh lệch ≤ PH_SAME bit coi là một. */
const PH_SAME=12,PH_BITS=[0,1,1,2,1,2,2,3,1,2,2,3,2,3,3,4];
async function mcPH(src){try{const bl=src instanceof Blob?src:await (await fetch(src)).blob();let img;
    try{img=await createImageBitmap(bl,{imageOrientation:'from-image'})}catch(e){img=await new Promise((res,rej)=>{const u=URL.createObjectURL(bl),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}
    const W=17,H=16,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,W,H);const d=g.getImageData(0,0,W,H).data;
    let hex='',v=0,n=0;for(let y=0;y<H;y++)for(let x=0;x<W-1;x++){const i=(y*W+x)*4,j=i+4;v=v<<1|((d[i]*.299+d[i+1]*.587+d[i+2]*.114)>(d[j]*.299+d[j+1]*.587+d[j+2]*.114)?1:0);if(++n===4){hex+=v.toString(16);v=0;n=0}}
    return hex}catch(e){return''}}
const mcPHd=(a,b)=>{if(!a||!b||a.length!==b.length)return 999;let n=0;for(let i=0;i<a.length;i++)n+=PH_BITS[parseInt(a[i],16)^parseInt(b[i],16)];return n};
const mcSame=(a,b)=>!!(a&&b)&&((a.hash&&a.hash===b.hash)||mcPHd(a.ph,b.ph)<=PH_SAME);
async function mcPick(list){
  const M=mcS();const lim=mcVidMB(),sec=mcVidSec();let bad=[],dup=[];
  for(const f of list){
    if(f.type.startsWith('video/')){if(f.size>lim*1048576){bad.push(`${f.name}: video ${fmtSize(f.size)}, quá ${lim} MB`);continue}
      M.files.push({f,kind:'vid',url:URL.createObjectURL(f),info:mcVideoInfo(f),kids:[...M.kids]})}
    else if(f.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)){const x={f,kind:'img',hash:await mcHash(f),ph:await mcPH(f),kids:[...M.kids]};
      if(M.files.some(y=>mcSame(x,y))){dup.push(0);continue}
      const old=M.goal&&(mcCtx().recs||[]).find(r=>r.goal===M.goal&&mcSame(x,{hash:r.hash,ph:r.ph||M.ph?.[r.id]}));
      if(old){dup.push(1);continue}
      x.url=URL.createObjectURL(f);M.files.push(x)}
    else bad.push(f.name+': không phải ảnh hoặc video')}
  for(const x of M.files.filter(x=>x.kind==='vid'&&x.info instanceof Promise)){const i=await x.info;x.info=i;if(i.dur>sec+0.5){x.err=`Video dài ${Math.round(i.dur)} giây, quá ${sec} giây`}}
  const long=M.files.filter(x=>x.err);if(long.length){bad.push(...long.map(x=>x.f.name+': '+x.err));long.forEach(x=>URL.revokeObjectURL(x.url));M.files=M.files.filter(x=>!x.err)}
  if(dup.length||bad.length)toast([dup.length&&`Đã chặn ${dup.length} ảnh trùng`+(dup.includes(1)?` (${dup.filter(Boolean).length} ảnh đã có trong Kho ${M.goal})`:''),bad.length&&'Bỏ qua '+bad.slice(0,3).join('; ')+(bad.length>3?` và ${bad.length-3} tệp khác`:'')].filter(Boolean).join('. '));render();
}
/* Nhận diện khuôn mặt để tự gắn tên trẻ: chạy hoàn toàn trên máy (thư viện face-api, tải lần đầu khoảng 13 MB rồi trình duyệt giữ lại).
   Ảnh chuẩn không được lưu: chỉ lưu "đặc điểm khuôn mặt" (128 số) và một ảnh mặt nhỏ 64 px ở Firestore faces/{mã trẻ}.
   Khi cô thêm loạt ảnh mới, app dò các khuôn mặt trong ảnh, so với đặc điểm của các bé trong lớp và tích sẵn tên; cô sửa lại được. */
const FA_CDN='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15',FC_MAX=8,FC_LEARN=12;
// Ghép mặt học thêm vào bộ ảnh chuẩn: ảnh cô tự gán luôn giữ; mỗi bé giữ tối đa FC_LEARN mặt học thêm.
// Mặt mới (cô vừa xác nhận) luôn được thêm; đầy chỗ thì bỏ mặt học thêm "thừa" nhất, tức mặt giống một mặt khác của bé nhất,
// để bộ ảnh chuẩn giữ được nhiều góc chụp, nét mặt khác nhau (trước đây bỏ mặt mới nếu nó mờ hơn nên ảnh khó vẫn không nhận ra).
function fcMerge(of,news){const std=of.filter(f=>f.src!=='mc');let lr=of.filter(f=>f.src==='mc');
  const near=f=>Math.min(9,...[...std,...lr].filter(g=>g!==f).map(g=>fcDist(f.d,g.d)));
  for(const n of news){lr.push(n);if(lr.length>FC_LEARN){const w=lr.filter(f=>f!==n).reduce((a,b)=>near(a)<=near(b)?a:b);lr=lr.filter(f=>f!==w)}}
  return[...std,...lr]}
const fcDist=(a,b)=>{let t=0;for(let i=0;i<a.length;i++){const x=a[i]-b[i];t+=x*x}return Math.sqrt(t)};
// Chất lượng một khuôn mặt: độ tin cậy của bộ dò × độ lớn của mặt (mặt rộng từ 160 điểm ảnh coi là đủ nét).
const fcQ=d=>Math.round(d.detection.score*Math.min(1,d.detection.box.width/160)*100)/100;
let faReady=null;
function faLoad(){return faReady||(faReady=(async()=>{
  if(!window.faceapi)await new Promise((res,rej)=>{const s=document.createElement('script');s.src=FA_CDN+'/dist/face-api.js';s.onload=res;s.onerror=()=>rej(new Error('Không tải được bộ nhận diện, kiểm tra mạng'));document.head.appendChild(s)});
  // Chọn bộ tính toán: đồ hoạ (webgl) nếu máy có, không thì CPU (chậm hơn nhưng chạy được mọi máy).
  const tf=faceapi.tf;let be=false;try{be=await tf.setBackend('webgl')}catch(e){}if(!be)await tf.setBackend('cpu');await tf.ready();
  const u=FA_CDN+'/model';await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(u),faceapi.nets.faceLandmark68Net.loadFromUri(u),faceapi.nets.faceRecognitionNet.loadFromUri(u)]);return faceapi})().catch(e=>{faReady=null;throw e}))}
const fcTh=()=>{const v=parseFloat(String(prm('mcNguongMat')).replace(',','.'));return v>0.2&&v<0.9?v:0.5};
// Đặc điểm khuôn mặt của các bé trong lớp (chỉ đọc bản ghi của lớp đang chọn).
function fcRecs(code){const M=mcS();if(M.fdb!==S.db){M.fdb=S.db;M.fdocs={};M.fsubs={}}
  if(!M.fsubs[code]&&S.db&&code){M.fsubs[code]=1;unsubs.push(S.db.collection('faces').where('cls','==',code).onSnapshot(s=>{M.fdocs[code]=s.docs.map(d=>({id:d.id,...d.data()}));renderSoon()},e=>{console.warn('faces',e);M.fdocs[code]=[];renderSoon()}))}
  return M.fdocs[code]}
// Ảnh → khung vẽ (cạnh dài tối đa max) để dò mặt.
async function fcCanvas(src,max){let img;try{img=await createImageBitmap(src,{imageOrientation:'from-image'})}catch(e){img=await new Promise((res,rej)=>{const u=URL.createObjectURL(src),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Ảnh không đọc được'))};i.src=u})}

async function fcDetect(cv,conf){const fa=await faLoad();return fa.detectAllFaces(cv,new fa.SsdMobilenetv1Options({minConfidence:conf||.45})).withFaceLandmarks().withFaceDescriptors()}
function fcCrop(cv,b){const m=b.width*.25,x=Math.max(0,b.x-m),y=Math.max(0,b.y-m),w=Math.min(cv.width-x,b.width+2*m),h=Math.min(cv.height-y,b.height+2*m),s=Math.min(w,h);
  const o=document.createElement('canvas');o.width=o.height=64;o.getContext('2d').drawImage(cv,x+(w-s)/2,y+(h-s)/2,s,s,0,0,64,64);return o.toDataURL('image/jpeg',.7)}
// Nạp ảnh chuẩn cho một bé: mỗi ảnh lấy khuôn mặt lớn nhất. Trả về các tệp đã nạp được (để bỏ khỏi danh sách chờ gán).
async function fcAdd(kidId,files){
  const X=mcCtx();const kid=X.kids.find(k=>k.id===kidId);const done=new Set();if(!kid||!canCls(X.code)){toast('Chỉ giáo viên lớp này hoặc Ban giám hiệu được nạp ảnh chuẩn');return done}
  const M=mcS();M.fbusy=kidId;render();const got=[],bad=[];
  try{for(const f of files){try{const cv=await fcCanvas(f,1280);const ds=await fcDetect(cv);
      if(!ds.length){bad.push((f.name||'ảnh')+': không thấy khuôn mặt');continue}
      const d=ds.sort((a,b)=>b.detection.box.area-a.detection.box.area)[0];
      got.push({d:Array.from(d.descriptor,v=>Math.round(v*1e4)/1e4),t:fcCrop(cv,d.detection.box),at:new Date().toISOString()});done.add(f)}
    catch(e){console.warn(e);bad.push((f.name||'ảnh')+': '+(e.message||'lỗi'))}}
    if(got.length){const old=(fcRecs(X.code)||[]).find(r=>r.id===kidId);const of=old?.faces||[];const faces=[...[...of.filter(f=>f.src!=='mc'),...got].slice(-FC_MAX),...of.filter(f=>f.src==='mc')];let ok=false;
      await guard(async()=>{await S.db.doc('faces/'+kidId).set({cls:X.code,classId:X.c.id,name:kid.name,faces,consent:old?old.consent!==false:true,updatedAt:new Date().toISOString(),updatedBy:S.meId||''});ok=true},`Đã gán ${got.length} ảnh chuẩn cho ${kid.name}`);
      if(!ok)done.clear()}
    if(bad.length)toast('Bỏ qua '+bad.join('; '))}
  catch(e){console.warn(e);toast(e.message||'Chưa nhận diện được');done.clear()}
  finally{M.fbusy='';render()}
  return done;
}
// So khuôn mặt trong một ảnh với bộ ảnh chuẩn của lớp: trả về các bé nhận ra (mỗi bé một lần) và số khuôn mặt thấy được.
/* So khuôn mặt trong ảnh với bộ ảnh chuẩn. Chặt tay để tránh gắn nhầm: chỉ lấy khuôn mặt rõ (độ tin cậy cao, không quá nhỏ),
   khoảng cách phải dưới ngưỡng và bé giống nhất phải rõ ràng hơn bé giống thứ hai; mỗi khuôn mặt một bé, mỗi bé một lần. */
async function fcMatchFaces(fs,refs){await faLoad();const th=fcTh(),gap=.04;const pairs=[];
  fs.forEach((d,i)=>{const ds2=refs.map(r=>({id:r.id,dist:Math.min(...r.faces.map(f=>faceapi.euclideanDistance(d.d,f.d)))})).sort((a,b)=>a.dist-b.dist);
    const [a,b]=ds2;if(!a)return;const g=b?b.dist-a.dist:1;
    // Tự gắn khi rất giống (dưới ngưỡng, hơn hẳn bé thứ hai) hoặc hơi trên ngưỡng nhưng bỏ xa bé thứ hai.
    if((a.dist<th&&g>=gap)||(a.dist<th+.06&&g>=.08))pairs.push({i,id:a.id,dist:a.dist});
});
  pairs.sort((a,b)=>a.dist-b.dist);const usedF=new Set(),hit=[];
  for(const p of pairs){if(usedF.has(p.i)||hit.includes(p.id))continue;usedF.add(p.i);hit.push(p.id)}
  return{hit,n:fs.length}}
/* Dò khuôn mặt trong một ảnh minh chứng một lần rồi giữ kết quả trên máy (IndexedDB, theo mã minh chứng):
   Tự nhận diện sau khi tải lên, Duyệt (học thêm mặt), Nhận diện lại, Nhận diện tiếp đều dùng lại, không phải tải ảnh gốc và dò lại.
   Bộ ảnh chuẩn thay đổi cũng không sao vì chỉ lưu đặc điểm khuôn mặt, việc so với các bé làm lại mỗi lần (rất nhanh).
   Kết quả dò từ ảnh nhỏ (do chưa đọc được ảnh gốc) sẽ dò lại khi đọc được ảnh gốc. */
async function fcScan(id,getSrc){let c=id?await fcScanGet(id):null;if(c&&!c.small)return c;
  const src=await getSrc();if(!src||(c&&src.small))return c;
  let cv=await fcCanvas(src.blob,1600);const L0=Math.max(cv.width,cv.height);let k=1;
  if(L0<800){k=Math.min(2,1600/L0);const o=document.createElement('canvas');o.width=Math.round(cv.width*k);o.height=Math.round(cv.height*k);const g=o.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cv,0,0,o.width,o.height);cv=o}
  const L=Math.max(cv.width,cv.height);const ds=(await fcDetect(cv,.5)).filter(d=>d.detection.box.width>=Math.max(24,L*.025));
  c={id,small:!!src.small,L,k,at:Date.now(),faces:ds.map(d=>({d:Array.from(d.descriptor,v=>Math.round(v*1e4)/1e4),s:d.detection.score,w:d.detection.box.width,q:fcQ(d),t:fcCrop(cv,d.detection.box)}))};
  if(id)fcDbDo(st=>st.put(c),'scan');return c}
// Sau khi cô Duyệt (tên trẻ đã đúng 100%): chạy ngầm, lấy khuôn mặt các bé trong ảnh bổ sung vào bộ ảnh chuẩn.
// Mỗi khuôn mặt ghép với bé được gắn tên giống nhất (chỉ trong các bé của ảnh đó); ảnh 1 mặt 1 bé thì lấy luôn kể cả bé chưa có ảnh chuẩn.
// Chỉ thêm mặt máy chưa tự nhận ra đúng bé; mỗi bé tối đa FC_LEARN mặt học thêm (xem fcMerge).
// Các lần Duyệt liên tiếp được xếp hàng, không bỏ lần nào.
function fcLearnFrom(rs,X){const M=mcS();M.lq=(M.lq||Promise.resolve()).then(()=>fcLearnRun(rs,X));return M.lq}
async function fcLearnRun(rs,X){const M=mcS();M.learning=true;const add={},miss=new Set();let saved=0;
  try{await faLoad();const R=Object.fromEntries((fcRecs(X.code)||[]).map(r=>[r.id,(r.faces||[]).map(f=>f.d)]));
    for(const r of rs){if(r.kind!=='img')continue;const ks=(r.kids||[]).filter(k=>X.kids.some(x=>x.id===k));if(!ks.length)continue;
      try{const c=await fcScan(r.id,()=>mcSrc(r));if(!c)continue;
        // Học mọi mặt mà lúc nhận diện máy nhìn thấy (cùng bộ lọc trong fcScan), để mặt nhỏ hay hơi mờ đã duyệt lần sau cũng nhận ra; q chỉ dùng để xếp mặt rõ trước.
        const ds=c.faces.map(f=>({...f,q:Math.round(f.s*Math.min(1,f.w/c.k/160)*100)/100}));if(!ds.length){ks.forEach(k=>miss.add(k));continue}
        const known=k=>[...(R[k]||[]),...(add[k]||[]).map(f=>f.d)];const pairs=[];
        ds.forEach((d,i)=>ks.forEach(k=>{const fs=known(k);if(fs.length)pairs.push({i,k,dist:Math.min(...fs.map(f=>faceapi.euclideanDistance(d.d,f)))})}));
        pairs.sort((a,b)=>a.dist-b.dist);const uF=new Set(),uK=new Set(),got=[];
        for(const p of pairs){if(uF.has(p.i)||uK.has(p.k)||p.dist>.7)continue;uF.add(p.i);uK.add(p.k);got.push(p)}
        // Bé máy tự nhận ra chắc chắn cho mặt d (cùng luật với fcMatchFaces), không thì ''.
        const rec=d=>{const ids=[...new Set([...Object.keys(R),...Object.keys(add)])];const L=ids.map(id=>({id,dist:Math.min(9,...known(id).map(f=>faceapi.euclideanDistance(d.d,f)))})).sort((a,b)=>a.dist-b.dist);
          const [a,b]=L;const g=b?b.dist-a.dist:1;const th=fcTh();return a&&((a.dist<th&&g>=.04)||(a.dist<th+.06&&g>=.08))?a.id:''};
        // Còn đúng một bé đã duyệt chưa ghép (thường là bé chưa có ảnh chuẩn): lấy mặt to nhất trong các mặt còn lại mà máy không nhận chắc là bé khác ngoài ảnh.
        // (Trước đây đòi đúng một mặt và mặt đó không hơi giống bé nào khác, nên ảnh có tranh vẽ mặt trên tường hay bé giống bạn thì không học được.)
        const fL=ds.map((_,i)=>i).filter(i=>{if(uF.has(i))return false;const o=rec(ds[i]);return!o||ks.includes(o)}),kL=ks.filter(k=>!uK.has(k));
        if(fL.length&&kL.length===1)got.push({i:fL.reduce((a,b)=>ds[b].w>ds[a].w?b:a),k:kL[0],dist:1});
        ks.filter(k=>!got.some(p=>p.k===k)).forEach(k=>miss.add(k));
        // Bỏ qua mặt máy đã tự nhận ra đúng bé này (đã nhớ rồi); mặt chưa nhận ra được (kể cả rất giống bé khác) thì lưu để lần sau nhận ra.
        const knows=(d,k)=>rec(d)===k;
        for(const p of got){const d=ds[p.i];if(knows(d,p.k))continue;(add[p.k]=add[p.k]||[]).push({d:d.d,t:d.t,q:d.q,src:'mc',at:new Date().toISOString(),ev:r.id})}}
      catch(e){console.warn('fcLearnFrom',e)}}
    for(const [k,fs] of Object.entries(add)){const old=(fcRecs(X.code)||[]).find(r=>r.id===k);const kid=X.kids.find(x=>x.id===k);const of=old?.faces||[];
      const faces=fcMerge(of,fs.sort((a,b)=>b.q-a.q));if(JSON.stringify(faces)===JSON.stringify(of))continue;
      try{await S.db.doc('faces/'+k).set({cls:X.code,classId:X.c.id,name:kid?.name||old?.name||'',faces,consent:old?old.consent!==false:true,updatedAt:new Date().toISOString(),updatedBy:S.meId||''},{merge:true});saved+=fs.length}catch(e){console.warn('fcLearnFrom save',e)}}}
  catch(e){console.warn('fcLearnFrom',e)}
  finally{M.learning=false}
  // saved: số mặt đã lưu; miss: tên các bé được gắn mà máy không tìm được mặt trong ảnh để lưu.
  return{saved,miss:[...miss].map(k=>X.kids.find(x=>x.id===k)?.name).filter(Boolean)}}
// Ảnh để nhận diện lại một minh chứng đã ở trong Kho: lấy tệp gốc nếu kho ảnh cho đọc, không thì dùng ảnh nhỏ.
async function mcSrc(r){if(r.kind==='img'){try{const url=await mcStore().ref(r.path).getDownloadURL();const res=await fetch(url);if(res.ok)return{blob:await res.blob(),small:false}}catch(e){console.warn('Không đọc được ảnh gốc, dùng ảnh nhỏ',e)}}

// Nút theo mục tiêu trong Kho: xoá hết tên trẻ, bỏ tên một bé, hoặc nhận diện lại (xoá tên cũ rồi gắn theo bộ ảnh chuẩn).
async function mcGoalAct(kind,goal){const M=mcS();const X=mcCtx();if(!canCls(X.code))return;
  const rs=(X.recs||[]).filter(r=>r.goal===goal&&(kind!=='bo'||(r.kids||[]).includes(M.fk))&&(kind!=='tiep'||!(r.kids||[]).length)&&(kind!=='lai'||!r.ok)&&(kind!=='duyet'||((r.kids||[]).length&&!r.ok)));if(!rs.length)return;
  const now=new Date().toISOString();
  if(kind==='duyet'){if(!armConfirm('mcd'+goal))return;
    if(await guard(()=>mcBatch(rs.map(r=>[r.id,{ok:true,okAt:now,okBy:S.meId||''}])),`Đã duyệt ${rs.length} ảnh`))fcLearnFrom(rs,X).then(({saved:n,miss:ms})=>{toast((n?`Đã lưu thêm ${n} khuôn mặt vào Bộ ảnh chuẩn để lần sau tự nhận ra`:'Các khuôn mặt trong ảnh vừa duyệt máy đã nhớ rồi, không lưu thêm')+(ms.length?`. Chưa tìm được mặt của ${ms.join(', ')} trong ảnh để lưu, cô thêm ảnh rõ mặt bé ở Bộ ảnh chuẩn giúp em`:''))});return}
  if(kind==='xoa'){if(!armConfirm('mcx'+goal))return;
    await guard(()=>mcBatch(rs.map(r=>[r.id,{kids:[],autoKids:[],recAt:now,ok:false}])),`Đã xoá tên trẻ khỏi ${rs.length} minh chứng`)}
  else if(kind==='bo'){const k=X.kids.find(x=>x.id===M.fk);if(!armConfirm('mcb'+goal))return;
    await guard(()=>mcBatch(rs.map(r=>[r.id,{kids:(r.kids||[]).filter(x=>x!==M.fk),autoKids:(r.autoKids||[]).filter(x=>x!==M.fk)}])),`Đã bỏ tên ${k?.name||'bé'} khỏi ${rs.length} minh chứng`)}
  else if(kind==='lai'||kind==='tiep'){const refs=(fcRecs(X.code)||[]).filter(r=>r.faces?.length&&X.kids.some(k=>k.id===r.id));
    if(!refs.length){toast('Lớp chưa có bộ ảnh chuẩn. Cô vào menu Bộ ảnh chuẩn để gán ảnh cho các bé trước.');return}
    if(M.scanning||(kind==='lai'&&!armConfirm('mcl'+goal)))return;M.scanning=true;M.rr=goal;M.rrN=0;M.rrT=rs.length;render();let n=0,none=0,small=0;
    try{await faLoad();
      for(const r of rs){try{const c=await fcScan(r.id,()=>mcSrc(r));if(c?.small)small++;const hit=c?(await fcMatchFaces(c.faces,refs)).hit:[];if(!hit.length)none++;n+=hit.length;
          await S.db.doc('evidence/'+r.id).update({kids:hit,autoKids:hit,recAt:new Date().toISOString()})}catch(e){console.warn(e);none++}
        M.rrN++;render()}
      toast(`Đã nhận diện ${kind==='tiep'?'tiếp':'lại'} ${rs.length} minh chứng: gắn ${n} lượt tên trẻ`+(none?`; ${none} ảnh chưa nhận ra ai, cô gắn tay giúp em`:'')+(small?`. Lưu ý: ${small} ảnh phải dùng ảnh thu nhỏ vì kho ảnh chưa cho đọc ảnh gốc nên dễ sót`:''))}
    catch(e){console.warn(e);toast(e.message||'Chưa tải được bộ nhận diện')}
    finally{M.scanning=false;M.rr='';render()}}
}
// Tải lên xong: lớp đã có Bộ ảnh chuẩn thì app tự nhận diện các ảnh vừa tải, gắn tên các bé nhận ra vào Kho.
// Tiến độ hiện ở dòng mục tiêu trong Kho; ảnh chưa nhận ra ai thì cô gắn tay ngay ở thẻ ảnh trong Kho.
async function mcAutoRecog(items,goal){const M=mcS();const X=mcCtx();const refs=(fcRecs(X.code)||[]).filter(r=>r.faces?.length&&X.kids.some(k=>k.id===r.id));

        const m=c?await fcMatchFaces(c.faces,refs):{hit:[]};const hit=m.hit;const r=(mcCtx().recs||[]).find(x=>x.id===b.id);const had=r?r.kids||[]:b.kids;if(!hit.length&&!had.length)none++;
        if(hit.length){const kids=[...new Set([...had,...hit])];

    toast((n?`Đã nhận diện ${items.length} ảnh vừa tải: gắn ${n} lượt tên trẻ`:'Chưa nhận ra bé nào trong các ảnh vừa tải')+(none?`; ${none} ảnh chưa có tên, cô bấm vào ảnh trong Kho để gắn tay`:''))}
  catch(e){console.warn(e);toast(e.message||'Chưa tải được bộ nhận diện, cô bấm Nhận diện tiếp ở mục tiêu trong Kho sau nhé')}
  finally{M.scanning=false;M.rr='';render()}}
// Gắn hoặc bỏ tên một bé trong ảnh. Gắn thêm thì máy học luôn mặt bé từ ảnh đó (không đợi Duyệt) để lần sau tự nhận ra.
async function mcEk(id,kid){const X=mcCtx();const r=(X.recs||[]).find(x=>x.id===id);if(!r)return;const ks=r.kids||[];const add=!ks.includes(kid);const kids=add?[...ks,kid]:ks.filter(x=>x!==kid);

// Học bù: ảnh đã duyệt trong 30 ngày gần đây mà máy này chưa học thì học lại (chạy ngầm, mỗi lớp một lần mỗi phiên, tối đa 40 ảnh),

async function fcDbDo(fn,store='pool'){try{const db=await fcDb();if(!db)return;const tx=db.transaction(store,'readwrite');const st=tx.objectStore(store);const out=fn(st);await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});return out}catch(e){console.warn('IndexedDB',e)}}

    const have=new Set((F.pools[code]||[]).map(p=>p.id));const add=rows.filter(r=>!have.has(r.id)).sort((a,b)=>a.at-b.at).map(r=>{const f=new File([r.blob],r.name,{type:r.type});return{id:r.id,f,url:URL.createObjectURL(f),sel:false,hash:r.hash||'',ph:r.ph||''}});

async function fcScanGet(id){try{const db=await fcDb();if(!db)return null;return await new Promise((res,rej)=>{const q=db.transaction('scan').objectStore('scan').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch(e){console.warn('IndexedDB',e);return null}}

async function fcPoolAdd(files){const F=fcS();const cls=fcCode();if(!cls)return;const add=[],dup=[];let n=Date.now();F.adding=true;render();
  try{for(const f of files)if(f.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)){const x={hash:await mcHash(f),ph:await mcPH(f)};
      if(F.pool.some(p=>mcSame(x,p))){dup.push(f.name);continue}
      const id=cls+'_'+(n++)+'_'+Math.random().toString(36).slice(2,7);F.pool.push({id,f,url:URL.createObjectURL(f),sel:false,...x});add.push({id,cls,name:f.name,type:f.type,blob:f,at:n,...x})}}
  finally{F.adding=false;render()}
  if(dup.length)toast(`Đã chặn ${dup.length} ảnh trùng với ảnh đang chờ`);fcDbDo(st=>add.forEach(r=>st.put(r)))}
async function fcGan(kidId){const F=fcS();const ps=F.pool.filter(p=>p.sel);if(!ps.length){toast('Cô chọn ảnh của bé trước');return}
  const done=await fcAdd(kidId,ps.map(p=>p.f));
  F.pool.forEach(p=>{if(!p.sel)return;p.sel=false;if(!done.has(p.f))p.err='Không thấy mặt'});
  const gone=F.pool.filter(p=>done.has(p.f));gone.forEach(p=>URL.revokeObjectURL(p.url));F.pool=F.pool.filter(p=>!done.has(p.f));render();fcPoolDel(gone.map(p=>p.id).filter(Boolean))}

function mcCtx(){const X=evCtx();const kids=S.children.filter(k=>k.classId===S.evCls).sort(viSort);return{...X,kids,recs:X.code?mcRecs(X.code):null}}

function mcGroups(recs,act,kids){const ok=new Set(act.map(k=>k.id)),m=new Map();
  for(const r of recs||[]){const ids=[...new Set(r.kids||[])].filter(id=>ok.has(id));if(ids.length<2||ids.length===act.length)continue;ids.sort();const k=ids.join(',');const g=m.get(k)||{ids,n:0};g.n++;m.set(k,g)}
  return[...m.values()].sort((a,b)=>b.n-a.n).slice(0,4).map(g=>{const names=g.ids.map(id=>kids.find(k=>k.id===id)?.name||'');const short=names.map(n=>n.trim().split(/\s+/).pop());return{...g,names,label:(short.length>3?short.slice(0,3).join(', ')+' +'+(short.length-3):short.join(', '))+' ('+g.n+')'}})}

async function mcHash(f){try{const b=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());return Array.from(new Uint8Array(b).slice(0,16),x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return''}}
const mcKeys=r=>[r.hash&&r.goal+'|h|'+r.hash,r.thumb&&r.goal+'|t|'+r.thumb].filter(Boolean);
function mcDups(recs){const M=mcS();const ph=r=>r.ph||M.ph?.[r.id]||'';const seen=new Map(),kept=[],out=[];
  for(const r of recs.slice().sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')))){const ks=mcKeys(r);let k0=ks.map(k=>seen.get(k)).find(Boolean);
    if(!k0){const p=ph(r);if(p)k0=kept.find(k=>k.goal===r.goal&&mcPHd(p,ph(k))<=PH_SAME)}
    if(k0)out.push({keep:k0,dup:r});else{ks.forEach(k=>seen.set(k,r));kept.push(r)}}
  return out}
// Tính dấu vân cho ảnh cũ trong Kho (từ ảnh nhỏ), chạy ngầm rồi vẽ lại để báo ảnh trùng.
function mcPHRecs(recs){const M=mcS();M.ph=M.ph||{};if(M.phBusy)return;const todo=recs.filter(r=>!r.ph&&r.thumb&&!(r.id in M.ph));if(!todo.length)return;
  M.phBusy=true;(async()=>{for(const r of todo)M.ph[r.id]=await mcPH(r.thumb);M.phBusy=false;render()})()}
async function mcDedup(){const X=mcCtx();if(!canCls(X.code)||!armConfirm('mcdup'))return;const st=mcStore();

    const gone=[];for(const {dup} of ds)if(await mcDelFiles(st,dup))gone.push(dup.id);

async function mcUpload(){
  const M=mcS();const X=mcCtx();const {c,code,goals,T,Sb}=X;const st=mcStore();
  if(!c||!canCls(code)){toast('Chỉ giáo viên lớp này hoặc Ban giám hiệu được thêm minh chứng');return}
  if(!st){toast('Chưa kết nối được kho ảnh, tải lại trang rồi thử lại');return}
  const g=(goals||[]).find(x=>x.code===M.goal);if(!g||!M.files.length)return;
  M.date=$('#mcDate')?.value||M.date;M.note=($('#mcNote')?.value||'').trim();
  M.busy=true;render();let ok=0,fail=[],dupN=0,rq=0;const soon=()=>{if(!rq)rq=setTimeout(()=>{rq=0;render()},300)};const seen=new Set((X.recs||[]).flatMap(mcKeys));const sameG=(X.recs||[]).filter(r=>r.goal===g.code).map(r=>({hash:r.hash,ph:r.ph||M.ph?.[r.id]}));
  // Tải 3 tệp cùng lúc cho nhanh (nén, tải lên, ghi Kho); nhận diện sau đó vẫn theo thứ tự cô chọn.
  const order=new Map(M.files.map((x,i)=>[x,i])),q=M.files.filter(x=>!x.done),got=[];
  const one=async x=>{
    try{const ref=S.db.collection('evidence').doc();let blob,ext,thumb=null,w=0,h=0,dur=0;
      let tb=null;if(x.kind==='img'){const big=await mcShrink(x.f,MC_IMG,.82);blob=big.blob;w=big.w;h=big.h;ext='jpg';tb=(await mcShrink(blob,MC_THUMB,.6)).blob;thumb=await mcB64(tb)}
      else{blob=x.f;ext=(x.f.name.match(/\.(\w{2,4})$/)?.[1]||'mp4').toLowerCase();thumb=x.info?.thumb||null;dur=x.info?.dur||0}
      const hash=x.hash||await mcHash(x.f);const ph=x.ph||(thumb?await mcPH(thumb):'');const ks=mcKeys({goal:g.code,hash,thumb});if(ks.some(k=>seen.has(k))||sameG.some(o=>mcSame({hash,ph},o))){x.done=true;dupN++;return}ks.forEach(k=>seen.add(k));sameG.push({hash,ph});
      const path=`minhchung/${S.year}/${code}/${ref.id}.${ext}`;
      x.pct=0;soon();
      await new Promise((res,rej)=>{const t=st.ref(path).put(blob,{contentType:x.kind==='img'?'image/jpeg':(x.f.type||'video/mp4'),customMetadata:{cls:code,by:S.meId||''}});
        t.on('state_changed',s=>{const p=Math.round(s.bytesTransferred*100/(s.totalBytes||1));if(p!==x.pct){x.pct=p;soon()}},rej,res)});
      const now=new Date().toISOString();let th={};
      try{if(thumb){if(!tb)tb=await (await fetch(thumb)).blob();try{th=await mcPutThumb(st,path,tb,code)}catch(e){console.warn('Chưa cất được ảnh nhỏ lên kho ảnh, giữ trong bản ghi',e);th={thumb}}}
        await ref.set({year:S.year,cls:code,classId:c.id,topicId:T?.id||'',subId:Sb?.id||'',goal:g.code,goalName:g.name||'',dom:g.dom||'',kids:[...x.kids],kind:x.kind,path,...th,hash,ph,size:blob.size,w,h,dur,date:M.date,note:M.note,authorId:S.meId||'',createdAt:now})}
      catch(e){mcDelFiles(st,{path,thumbPath:th.thumbPath||mcThumbPath(path)});throw e}
      if(x.kind==='img')got.push({o:order.get(x),b:{id:ref.id,blob,thumb,kids:[...x.kids]}});x.done=true;x.pct=100;ok++;soon();
    }catch(e){console.warn(e);x.pct=null;fail.push(x.f.name+(e?.code?.includes('unauthorized')||e?.code==='permission-denied'?' (không có quyền)':''))}};
  await Promise.all([0,1,2].map(async()=>{while(q.length)await one(q.shift())}));
  clearTimeout(rq);const news=got.sort((a,b)=>a.o-b.o).map(x=>x.b);
  M.busy=false;
  M.files.filter(x=>x.done).forEach(x=>URL.revokeObjectURL(x.url));M.files=M.files.filter(x=>!x.done);if(!M.files.length){M.note='';M.kids=[]}
  render();toast(fail.length?`Đã tải lên ${ok} tệp; chưa tải được: ${fail.join(', ')}. Kiểm tra mạng rồi bấm Tải lên lần nữa.`:(!ok&&dupN?`${dupN} ảnh này đã có trong Kho ở mục tiêu này nên app không tải lại`:`Đã lưu ${ok} minh chứng`+(dupN?`; bỏ qua ${dupN} ảnh đã có trong Kho`:''))+(news.length?((fcRecs(code)||[]).some(r=>r.faces?.length)?'. Đang nhận diện tên trẻ…':'. Lớp chưa có Bộ ảnh chuẩn nên cô bấm vào ảnh trong Kho để gắn tên tay'):''));
  mcAutoRecog(news,g.code);
}

function pkProc(code){

      .then(ss=>{P.pq[k]={docs:ss.flatMap(s=>s.docs.map(d=>({id:d.id,...d.data()})))}}).catch(e=>{console.warn('pkProc',e);P.pq[k]={docs:[],err:true}}).then(()=>render())}

async function pkPrint(ids,kind=pkKind()){
  const X=pkCtx();if(!X.c)return;const ks=X.kids.filter(k=>ids.includes(k.id));if(!ks.length){toast('Cô tích chọn trẻ cần in giúp em');return}

  // Khung ẩn rộng đúng vùng in A4 để đo số trang của từng phiếu. Lề phải trang in chỉ 0,6 cm để nhãn Duyệt/Nháp nằm sát mép giấy, phần chữ vẫn chừa 1,5 cm.
  const f=document.createElement('iframe');f.style.cssText='position:fixed;width:184mm;height:10px;border:0;left:-9999px;top:0;visibility:hidden';document.body.appendChild(f);
  const w=f.contentWindow;w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Phieu ket qua danh gia tre</title><style>@page{size:A4;margin:1.2cm .6cm 1.2cm 2cm}${PK_CSS}.pg{padding-right:.9cm;page-break-after:always}.pg:last-child{page-break-after:auto}.pk-tag{right:-.9cm!important}</style></head><body>${ks.map(k=>`<div class="pg">${pkSheetOf(X,k,kind)}</div>`).join('')}</body></html>`);w.document.close();
  // In 2 mặt: phiếu nào có số trang lẻ thì thêm một trang trắng, để phiếu của bé sau luôn bắt đầu ở mặt trước tờ giấy mới.
  const ph=272*96/25.4;
  // Phiếu tổng hợp luôn gọn một trang: nội dung dài thì thu nhỏ cả phiếu cho vừa.
  const fit=()=>{if(kind==='ct')return;w.document.querySelectorAll('.pg').forEach(d=>{const h=d.scrollHeight;if(h>ph-4)d.style.zoom=Math.max(.6,(ph-8)/h).toFixed(3)})};
  const pad=()=>{[...w.document.querySelectorAll('.pg')].slice(0,-1).forEach(d=>{if(kind!=='ct'||Math.ceil((d.scrollHeight-4)/ph)%2){const b=w.document.createElement('div');b.className='pg';b.innerHTML='&nbsp;';d.after(b)}})};
  const go=()=>{try{fit();pad()}catch(e){console.warn(e)}w.focus();w.print();setTimeout(()=>f.remove(),60000)};

}

function pkCompReq(X,k,nx){

function pkFullReq(X,k){const {nx,...c}=pkCompReq(X,k,{});return{...pkAiReq(X,k),...c,task:'childFull'}}
const pkCompOut=(X,o)=>{const st=pkStages(X).map(s=>s.label),B=pkBand(X),N=pkNorm(o.plan||{},st.length);
  PK_G.forEach(([g])=>N[g].forEach(x=>{x.d=x.d.map(v=>Math.max(B.lo,Math.min(B.hi,v)))}));return{st,...N}};

async function pkAiAll(){
  const X=pkCtx();const P=X.P;if(X.ro)return;if(!S.aiCfg?.workerUrl){toast('Chưa cài máy chủ AI');return}
  if(X.pq.wait){toast('Đang đọc ghi chép của lớp, cô bấm lại sau giây lát');return}
  const hasNx=k=>PK_NX.some(([f])=>(pkRec(X,k.id)?.nx?.[f]||'').trim());
  const go=pkPicked(X).filter(k=>!hasNx(k)||!pkHasNl(pkRec(X,k.id)));
  if(!go.length){toast('Các trẻ đã chọn đều đã có đủ phiếu');return}
  const none=go.filter(k=>!pkNotes(X,k.id).length).length;
  if(!await askYes(`AI sẽ viết nhận xét (mục II) và đánh giá năng lực, phẩm chất (mục III) cho ${go.length} trẻ còn thiếu, ghi thành bản nháp chờ cô duyệt, phần cô đã viết giữ nguyên${none?` (${none} trẻ chưa có ghi chép hằng ngày nào, AI chỉ dựa vào kết quả mục tiêu và giáo án)`:''}. Cô đồng ý không?`,'Viết'))return;
  P.err='';const errs=[];let done=0;P.busy='Đang đọc giáo án của lớp…';render();await pkWpReady();const tok=await S.auth.currentUser.getIdToken();
  const one=async k=>{try{const R=pkRec(X,k.id);let nx=R?.nx||{},up={};
      const both=!hasNx(k)&&!pkHasNl(R);let o=null;
      if(both)o=(await pkAiCall(pkFullReq(X,k),tok)).plan||{};
      if(!hasNx(k)){const a=(both?o.nhanXet:(await pkAiCall(pkAiReq(X,k),tok)).plan)||{};nx={an:a.anNguVs||'',cx:a.camXuc||'',hc:a.hocChoi||''};up={nx,...((R?.loiNhan||'').trim()?{}:{loiNhan:a.loiNhan||''})}}
      if(!pkHasNl(R))up.nlpc=pkCompOut(X,both?{plan:o.danhGia}:await pkAiCall(pkCompReq(X,k,nx),tok));
      await S.db.doc('evalPeriod/'+pkId(X,k.id)).set({kind:'phieu',classId:X.c.id,cls:X.code,childId:k.id,year:S.year,from:P.from,to:P.to,...up,ai:true,duyet:false,...stamp()},{merge:true})}
    catch(e){console.warn(e);errs.push(`${k.name}: ${e.message||e}`)}
    finally{done++;P.busy=`AI đang soạn… ${done}/${go.length} trẻ`;render()}};
  P.busy=`AI đang soạn… 0/${go.length} trẻ`;render();
  const q=[...go];await Promise.all([0,1].map(async()=>{while(q.length)await one(q.shift())}));
  P.busy='';P.err=errs.length?'Chưa viết được:\n'+errs.join('\n'):'';render();toast(errs.length?`Đã viết ${go.length-errs.length}/${go.length} phiếu`:`AI đã viết nháp ${go.length} phiếu, cô mở từng bé xem và bấm Duyệt phiếu`);
}

async function readStuFile(file){
  await needLib('xlsx');
  if(!window.XLSX){toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng');return}
  const c=S.classes.find(x=>x.id===S.stuCls);if(!c)return;
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const norm=t=>String(t??'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
  const pick=wb.SheetNames.find(n=>n.trim().toUpperCase()===String(c.code||'').toUpperCase())||wb.SheetNames.find(n=>{const g=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});return g.some(r=>r.some(x=>norm(x)==='mã định danh'))})||wb.SheetNames[0];
  const grid=XLSX.utils.sheet_to_json(wb.Sheets[pick],{header:1,raw:true,defval:''});
  const hi=grid.findIndex(r=>r.some(x=>norm(x)==='tên')||r.some(x=>norm(x)==='mã định danh'));
  if(hi<0){toast('Không tìm thấy dòng tiêu đề (Họ đệm, Tên, Mã định danh…)');return}
  const H=grid[hi].map(norm);const ix=(...ns)=>H.findIndex(h=>ns.some(n=>h===n||h.includes(n)));
  const col={last:ix('họ đệm','họ và đệm'),first:H.findIndex(h=>h==='tên'),full:ix('họ tên','họ và tên'),sid:ix('mã định danh','định danh'),dob:ix('ngày sinh'),st:ix('thái'),note:ix('ghi chú'),from:ix('từ ngày'),to:ix('đến ngày')};
  const today=new Date().toISOString().slice(0,10);
  const rows=[];const seen=new Set();
  grid.slice(hi+1).forEach((r,i)=>{
    const g=k=>col[k]>=0?r[col[k]]:'';
    let last=String(g('last')).trim(),first=String(g('first')).trim();
    if(!first&&col.full>=0){const sp=splitName(g('full'));last=sp.last;first=sp.first}
    if(/^\d+$/.test(first)&&/^\d*$/.test(last))return; // dòng đánh số cột 1,2,3…
    if(!first&&!last)return;
    let sid=g('sid');sid=typeof sid==='number'?String(sid).padStart(12,'0'):String(sid).trim();
    const stRaw=norm(g('st'));const status=stRaw.includes('nghỉ')?'Tạm nghỉ':'Đang học';
    const row={line:hi+i+2,lastName:last,firstName:first,studentId:sid,dob:toISO(g('dob')),status,note:String(g('note')||'').trim(),fromDate:toISO(g('from')),toDate:toISO(g('to'))};
    if(!first)Object.assign(row,{kind:'error',err:'Thiếu tên'});
    else if(sid&&seen.has(sid))Object.assign(row,{kind:'error',err:'Trùng mã định danh trong file'});
    else{
      const ex=sid?S.children.find(k=>k.studentId===sid):S.children.find(k=>k.classId===c.id&&(k.name||'').toLowerCase()===`${last} ${first}`.trim().toLowerCase()&&(!row.dob||k.dob===row.dob));
      row.exId=ex?.id;row.kind=!ex?'new':ex.classId!==c.id?'move':'update';if(ex&&ex.classId!==c.id)row.from=clsName(ex.classId);
      if(row.dob&&row.dob>today)row.warn='Ngày sinh sau hôm nay';
      else if(!row.dob)row.warn='Thiếu ngày sinh';
    }
    if(sid)seen.add(sid);rows.push(row);
  });
  S.stuImport={file:file.name+(wb.SheetNames.length>1?` – sheet ${pick}`:''),rows};lastKey='';render();
}

const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
// Cất file vào Firestore thành nhiều mảnh (fileChunks/{key}_{i}); prog(%) báo tiến độ.
async function storeChunks(f,prog){
  const b64=await readB64(f);const n=Math.ceil(b64.length/SP_CHUNK)||1;const key=S.db.collection('fileChunks').doc().id;
  for(let i=0;i<n;i++){prog?.(Math.round(i*100/n));await S.db.doc(`fileChunks/${key}_${i}`).set({fileKey:key,i,data:b64.slice(i*SP_CHUNK,(i+1)*SP_CHUNK)})}
  return{fileKey:key,chunks:n,fileName:f.name,size:f.size,mime:f.type||''};
}
const spStoreFile=f=>storeChunks(f,p=>{S.sp.busy=`Đang tải lên ${p}%`;const el=$('[data-act=spSave]');if(el)el.textContent=S.sp.busy});
async function spDropFile(key,n){for(let i=0;i<(n||1);i++)await S.db.doc(`fileChunks/${key}_${i}`).delete()}

  S.sp.busy='Đang lưu';const el=$('[data-act=spSave]');if(el){el.textContent=S.sp.busy;el.disabled=true}
  const K=spKind(),KN=SPK[K],age=spAge(KN);if(KN.cls&&!canCls(spCls())){toast('Chỉ giáo viên lớp này hoặc Ban giám hiệu được lưu');S.sp.busy=null;render();return}const P=f&&(KN.ages||KN.topics)&&S.sp.parsed?.items?.length?S.sp.parsed:null;
  if(P&&P.age&&P.age!==age){const t=KN.ages.find(a=>a[0]===P.age);toast(t?`File này là ${t[1]}. Hãy chuyển sang tab ${t[1]} để lưu.`:'Độ tuổi trong file khác với tab đang chọn');return}
  await guard(async()=>{
    if(f)Object.assign(d,await spStoreFile(f));
    let id=ed?.id;
    if(ed){await S.db.doc('schoolPlanFiles/'+ed.id).set(d,{merge:true});if(f&&ed.fileKey)await spDropFile(ed.fileKey,ed.chunks)}
    else id=(await S.db.collection('schoolPlanFiles').add({...d,kind:K,...(KN.ages?{age}:{}),...(KN.cls?{cls:spCls()}:{}),createdAt:d.updatedAt,createdBy:S.meId||''})).id;
    if(P){const el=$('[data-act=spSave]');if(el)el.textContent='Đang cập nhật dữ liệu từ file';if(KN.topics)await applyTopics(P,{id,...d});else await applyYccd(K,age,P,{id,...d})}
  },P?(KN.topics?`Đã lưu file và nạp ${P.items.length} chủ đề`:`Đã lưu file và nạp ${P.items.length} mục tiêu`):ed?'Đã lưu':'Đã thêm');
  S.sp.busy=null;S.sp.edit=null;S.sp.parsed=null;lastKey='';render();

async function spBlob(x){
  const parts=[];for(let i=0;i<(x.chunks||1);i++){const d=await S.db.doc(`fileChunks/${x.fileKey}_${i}`).get();if(!d.exists)throw new Error('missing chunk');parts.push(d.data().data)}
  const bin=atob(parts.join(''));const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type:x.mime||'application/octet-stream'});
}

    const p=await parseYccd(await spBlob(x));if(!p.items.length){toast('Không tìm thấy bảng YCCĐ trong file này');return}
    const n=await applyYccd(x.kind,x.age,p,x);toast(`Đã nạp ${p.items.length} mục tiêu từ file này${n?`, ẩn ${n} mã không còn trong file`:''}`)}
  catch(e){console.warn(e);toast(e?.code==='permission-denied'?'Tài khoản của bạn không có quyền làm việc này':'Không đọc được file này')}
}
async function spDownload(id){

  try{dlSave(await spBlob(x),x.fileName||'ke-hoach');

}

const nkSafe=n=>n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w.\-]+/g,'_').slice(-80)||'file';
async function nkUpload(id,files){
  const x=S.nkPlans.find(y=>y.id===id),st=S.nk;if(!x||!files.length)return;
  const big=files.find(f=>f.size>NK_MAX);if(big){toast(`File ${big.name} lớn hơn ${NK_MAX/1048576} MB`);return}
  const sto=mcStore();if(!sto){toast('Chưa kết nối được kho file, thử lại sau');return}
  st.up=id;const add=[];render();
  try{for(const [i,f] of files.entries()){
      const path=`nangkhieu/${x.year}/${x.mon}/${id}_${Date.now()}_${nkSafe(f.name)}`;
      await new Promise((res,rej)=>{const t=sto.ref(path).put(f,{contentType:f.type||'application/octet-stream',customMetadata:{by:S.meId||''}});
        t.on('state_changed',s=>{st.upMsg=`Đang tải ${files.length>1?(i+1)+'/'+files.length+' ':''}${Math.round(s.bytesTransferred*100/(s.totalBytes||1))}%`;const el=$('.nk-up.is-busy');if(el&&el.firstChild)el.firstChild.textContent=st.upMsg},rej,res)});
      add.push({name:f.name,path,size:f.size,mime:f.type||'',at:new Date().toISOString(),by:S.meId||''})}
  }catch(e){console.warn(e);toast(e?.code==='storage/unauthorized'?'Tài khoản của cô chưa có quyền tải file lên kho năng khiếu':'Chưa tải được file, kiểm tra mạng rồi thử lại')}
  if(add.length)await guard(()=>S.db.doc('talentPlans/'+id).update({files:firebase.firestore.FieldValue.arrayUnion(...add),updatedAt:new Date().toISOString(),updatedBy:S.meId||''}),`Đã đính kèm ${add.length} file`);
  st.up=null;st.upMsg='';lastKey='';render();
}

/* ---------- KHGD lớp: mục tiêu gắn chủ đề (sheet CHU DE) ---------- */
const GDOM=[['TC','Thể chất',/TH[EỂ]\s*CH[AẤ]T/i],['NN','Ngôn ngữ',/NG[OÔ]N\s*NG[UỮ]/i],['NT','Nhận thức',/NH[AẬ]N\s*TH[UỨ]C/i],['TX','TC – XH',/TCXH|T[IÌ]NH\s*C[AẢ]M/i],['NgT','Nghệ thuật',/NGH[EỆ]\s*THU[AẬ]T|(^|\s)N\.?\s*THU[AẬ]T/i]];
const clsLabel=code=>{const c=S.classes.find(x=>(x.code||x.id)===code);return c?c.name:code};
// Độ tuổi theo tên lớp của trường: Thỏ trắng 12–24 tháng; Sóc nâu, Gấu trúc 24–36 tháng; Mầm 1, Mầm 2 3–4 tuổi; Chồi 1 4–5 tuổi; Lá 1, Lá 2 5–6 tuổi.
const CLS_AGE=[[/thỏ\s*trắng/i,0],[/sóc\s*nâu|gấu\s*trúc/i,1],[/(^|\s)mầm(\s|\d|$)/i,2],[/(^|\s)chồi(\s|\d|$)/i,3],[/(^|\s)lá(\s|\d|$)/i,4]];
const clsNameAge=n=>{const x=CLS_AGE.find(([r])=>r.test(String(n||'').trim()));return x?AGES[x[1]]:''};
const AGEKEY={'Nhà trẻ 12–24 tháng':'12-24','Nhà trẻ 24–36 tháng':'24-36','Mẫu giáo bé 3–4 tuổi':'3-4','Mẫu giáo nhỡ 4–5 tuổi':'4-5','Mẫu giáo lớn 5–6 tuổi':'5-6'};
async function parseGoalsXlsx(file){
  await needLib('xlsx');
  if(!window.XLSX)throw new Error('no xlsx');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sn=wb.SheetNames.find(n=>n.replace(/\s/g,'').toUpperCase()==='CHUDE');if(!sn)return{err:'Không thấy sheet CHUDE (hoặc CHU DE) trong file này.'};
  const g=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  const str=v=>String(v??'').replace(/\s+/g,' ').trim();
  const iso=v=>{if(typeof v==='number'&&v>20000){const d=XLSX.SSF.parse_date_code(v);return`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
    const m=str(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return'';const Y=m[3].length===2?'20'+m[3]:m[3];return`${Y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};
  let year='',applies='';const notes=[];
  const hi=g.findIndex((r,i)=>i<20&&/^Tuần$/i.test(str(r[0])));if(hi<0)return{err:'Không thấy dòng tiêu đề (cột A ghi “Tuần”) trong sheet CHUDE.'};
  for(const r of g.slice(0,hi)){const a=str(r[0]);
    const ym=a.match(/Năm học:?\s*(\d{4})\s*[-–]\s*(\d{4})/i);if(ym)year=ym[1]+'-'+ym[2];
    const km=a.match(/^Khối\s*:?\s*(.+)$/i);if(km)applies=km[1];
    const b=str(r[1]).replace(/\s*\d{4}\s*[-–]\s*\d{4}$/,'');if(/^(Ngày|Nghỉ)/i.test(b)&&r[2]!==''){const v=r[2];notes.push(b+': '+(typeof v==='number'?fmtD(iso(v)):str(v)))}}
  const H=g[hi].map(str);const col={};GDOM.forEach(([k,,re])=>{col[k]=H.findIndex(h=>re.test(h))});
  const nCol=H.findIndex(h=>/SỐ\s*MT/i.test(h)),tCol=H.findIndex(h=>/Giáo viên|Phụ trách/i.test(h));
  const age=ageKey(applies);
  const topics=[],events=[],bad=[];
  for(const r of g.slice(hi+1,60)){
    const wk=str(r[0]),name=str(r[1]),fr=iso(r[2]),to=iso(r[3])||fr,own=tCol>=0?str(r[tCol]):'';
    if(!name)continue;const t=topics[topics.length-1];
    if(/^\d+$/.test(wk)&&t){const goals={};let n=0;
      for(const [k] of GDOM){const raw=col[k]>=0?str(r[col[k]]):'';const codes=raw.split(/[;,\s]+/).map(x=>x.trim()).filter(Boolean);
        codes.forEach(c=>{if(!/^[A-Za-zĐđ]+\d+\.\d+$/.test(c))bad.push(`Tuần ${wk}: “${c}”`)});goals[k]=codes;n+=codes.length}
      t.subs.push({id:t.id+'.'+(t.subs.length+1),week:+wk,name,from:fr,to,...(own?{owner:own}:{}),goals,n,nFile:nCol>=0?+r[nCol]||0:n});continue}
